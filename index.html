  const t = document.getElementById('monthTable');
  if (t) t.innerHTML = `<table class="ytab"><thead><tr><th></th><th>In</th><th>Spent</th><th>Left</th></tr></thead><tbody>${data.map(d=>`<tr><td>${esc(d.title)}</td><td>${gbp(d.a)}</td><td>${gbp(d.b)}</td><td class="${d.a-d.b<0?'neg':''}">${gbp(d.a-d.b)}</td></tr>`).join('')}</tbody></table>`;
  const bc = document.getElementById('balChart');
  if (bc){
    let pts = X.bal.filter(b=>b.x>=r.from && b.x<=r.to);
    const before = X.bal.filter(b=>b.x<r.from).pop(); if (before) pts.unshift({...before, x:r.from});
    if (pts.length>400){ const wk={}; pts.forEach(p=>{ wk[Math.floor(dOf(p.x)/6048e5)]=p; }); pts=Object.values(wk); }   // weekly for long ranges
    const h = heldAt(); pts = pts.map(p=>({x:p.x, v:p.v+(p.s||0)-h(p.x)})); lineChart(bc, pts, {color:'var(--bal)'});
  }
}

/* columns from one baseline; pair = in/spent side by side. opts.hi highlights one; opts.pick(key) on tap */
function barChart(el, data, opts){
  opts = opts||{};
  const pair = !!opts.pair, W=340, H=170, L=38, B=22, T=8, n=data.length||1;
  const max = Math.max(...data.map(d=>Math.max(d.a||0,d.b||0)),opts.line||0,1);
  const step = niceStep(max), top = Math.ceil(max/step)*step;
  const y = v => T+(H-T-B)*(1-v/top);
  const bw = (W-L)/n, gap = 2, barW = pair ? Math.max(3,Math.min(14,(bw-6)/2)) : Math.max(3,Math.min(22,bw-6));
  const every = opts.every || Math.ceil(n/12);   // at most ~12 x labels
  const money = opts.axis || (v => v>=1000 ? '£'+(v/1000).toLocaleString('en-GB',{maximumFractionDigits:1})+'k' : '£'+v), fmt = opts.fmt || gbp;
  let g='';
  for(let v=0; v<=top; v+=step) g+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end" font-size="12.5" fill="var(--muted)">${money(v)}</text>`;
  const bar = (x,v,c,dim) => { const h=y(0)-y(v), rr=Math.min(4,barW/2,h); if(h<=0) return '';
    return `<path d="M${x},${y(0)} V${y(v)+rr} Q${x},${y(v)} ${x+rr},${y(v)} H${x+barW-rr} Q${x+barW},${y(v)} ${x+barW},${y(v)+rr} V${y(0)} Z" fill="${c}"${dim?' opacity=".35"':''}/>`; };
  data.forEach((d,i)=>{
    const cx = L + bw*i + bw/2, dim = opts.hi>=0 && i!==opts.hi;
    if(pair){ g+=bar(cx-barW-gap/2, d.a||0, 'var(--inc)', dim); g+=bar(cx+gap/2, d.b||0, 'var(--spd)', dim); }
    else g+=bar(cx-barW/2, d.a||0, opts.color||'var(--catbar)', dim);
    if (i%every===0 || i===opts.hi) g+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="12.5" fill="${i===opts.hi?'var(--text)':'var(--muted)'}"${i===opts.hi?' font-weight="700"':''}>${esc(d.label)}</text>`;
    g+=`<rect x="${L+bw*i}" y="0" width="${bw}" height="${H}" fill="transparent" data-i="${i}" style="cursor:pointer"/>`;
  });
  if (opts.line) g+=`<line x1="${L}" x2="${W}" y1="${y(opts.line)}" y2="${y(opts.line)}" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".55" pointer-events="none"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">${g}</svg><div class="tip"></div>`;
  const tip = el.querySelector('.tip');
  const show = e => { const i=e.target.dataset.i; if(i===undefined) return; const d=data[i]; const bb=el.getBoundingClientRect(), rb=e.target.getBoundingClientRect();
    tip.innerHTML = `<b>${esc(d.title||d.label)}</b><br>` + (pair?`In <b>${gbp(d.a)}</b> · Spent <b>${gbp(d.b)}</b><br>Left ${gbp(d.a-d.b)}`:`<b>${fmt(d.a)}</b>`) + (d.foot?`<br><span style="opacity:.75">${esc(d.foot)}</span>`:'');
    const left = Math.min(Math.max(rb.left-bb.left+rb.width/2, 90), bb.width-90);
    tip.style.left=left+'px'; tip.style.top=(y(Math.max(d.a||0,d.b||0))/H*bb.height)+'px'; tip.style.opacity=1; };
  el.querySelectorAll('rect').forEach(rc=>{ rc.addEventListener('mouseenter',show);
    rc.addEventListener('click',e=>{ const d=data[e.target.dataset.i]; if(opts.pick && d && d.key) opts.pick(d.key); else show(e); }); });   // one tap opens that month
  el.addEventListener('mouseleave',()=>{ tip.style.opacity=0; tip.dataset.i=''; });
}

/* balance over time: 2px lines, 10% wash, crosshair + readout that snaps to the nearest day.
   With opts.color2, a second line sits above at v + s (Savings & ISA on top of the current account). */
function lineChart(el, pts, opts){
  if (pts.length<2){ el.innerHTML=''; return; }
  const two = !!opts.color2 && pts.some(p=>p.s>0), top = p => p.v + (two ? (p.s||0) : 0);
  const W=340, H=150, L=40, B=20, T=10, R=6;
  const t0=dOf(pts[0].x).getTime(), t1=dOf(pts[pts.length-1].x).getTime(), span=Math.max(1,t1-t0);
  let lo=Math.min(0,...pts.map(p=>p.v)), hi=Math.max(...pts.map(top),1);
  if (opts.zero===false){ lo=Math.min(...pts.map(p=>p.v)); hi=Math.max(...pts.map(p=>p.v)); const pad=Math.max((hi-lo)*0.15,1); lo-=pad; hi+=pad; }
  const step=niceStep(hi-lo), yMin=Math.floor(lo/step)*step, yMax=Math.ceil(hi/step)*step;
  const x = p => L+(W-L-R)*(dOf(p.x).getTime()-t0)/span, y = v => T+(H-T-B)*(1-(v-yMin)/(yMax-yMin||1));
  const money = opts.axis || (v => Math.abs(v)>=1000 ? (v<0?'-':'')+'£'+(Math.abs(v)/1000).toLocaleString('en-GB',{maximumFractionDigits:1})+'k' : '£'+v), fmt = opts.fmt || gbp;
  let g='';
  for(let v=yMin; v<=yMax+1e-6; v+=step) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end" font-size="12.5" fill="var(--muted)">${money(v)}</text>`;
  const years = span > 400*864e5;   // long range: label years, else months
  const seen = new Set(); let lastX = -1e9;
  pts.forEach(p=>{ const k = years ? p.x.slice(0,4) : p.x.slice(0,7); if(seen.has(k)) return; seen.add(k);
    const lab = years ? k : shortMonth(k), xx = x({x:years?k+'-01-01':k+'-01'});   // label sits on the 1st of its month / year
    if (xx < L+10 || xx > W-R-10 || xx-lastX < 27) return; lastX = xx;
    g+=`<text x="${xx}" y="${H-5}" text-anchor="middle" font-size="12.5" fill="var(--muted)">${esc(lab)}</text>`; });
  const path = f => pts.map((p,i)=>(i?'L':'M')+x(p).toFixed(1)+','+y(f(p)).toFixed(1)).join('');
  const base = y(Math.max(yMin,0)), X0 = x(pts[0]).toFixed(1), X1 = x(pts[pts.length-1]).toFixed(1);
  const cur = path(p=>p.v);
  if (two){
    const tp = path(top), back = pts.slice().reverse().map(p=>'L'+x(p).toFixed(1)+','+y(p.v).toFixed(1)).join('');
    g+=`<path d="${tp} ${back} Z" fill="${opts.color2}" opacity=".12"/>`;
    g+=`<path d="${tp}" fill="none" stroke="${opts.color2}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  g+=`<path d="${cur} L${X1},${base} L${X0},${base} Z" fill="${opts.color}" opacity=".1"/>`;
  g+=`<path d="${cur}" fill="none" stroke="${opts.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const last = pts[pts.length-1];
  if (two) g+=`<circle cx="${x(last)}" cy="${y(top(last))}" r="4" fill="${opts.color2}" stroke="var(--card)" stroke-width="2"/>`;
  g+=`<circle cx="${x(last)}" cy="${y(last.v)}" r="4" fill="${opts.color}" stroke="var(--card)" stroke-width="2"/>`;
  g+=`<line class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" opacity="0"/>`;
  if (two) g+=`<circle class="xd2" r="4" fill="${opts.color2}" stroke="var(--card)" stroke-width="2" opacity="0"/>`;
  g+=`<circle class="xd" r="4" fill="${opts.color}" stroke="var(--card)" stroke-width="2" opacity="0"/>`;
  g+=`<rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent" style="cursor:crosshair"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Balance over time">${g}</svg><div class="tip"></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = el.querySelector('.xh'), xd = el.querySelector('.xd'), xd2 = el.querySelector('.xd2');
  const key = c => `<i style="display:inline-block;width:10px;height:2px;background:${c};vertical-align:3px;margin-right:5px"></i>`;
  const move = e => { const bb=svg.getBoundingClientRect(), sx=(e.clientX-bb.left)/bb.width*W;
    let best=0, bd=1e9; pts.forEach((p,i)=>{ const d=Math.abs(x(p)-sx); if(d<bd){bd=d;best=i;} });
    const p=pts[best], px=x(p), py=y(two?top(p):p.v);
    xh.setAttribute('x1',px); xh.setAttribute('x2',px); xh.setAttribute('opacity',1);
    xd.setAttribute('cx',px); xd.setAttribute('cy',y(p.v)); xd.setAttribute('opacity',1);
    if (xd2){ xd2.setAttribute('cx',px); xd2.setAttribute('cy',y(top(p))); xd2.setAttribute('opacity',1); }
    tip.innerHTML = two
      ? `<b>${gbp(top(p))}</b> ${key(opts.color2)}${esc(opts.label2||'with savings')}<br><b>${gbp(p.v)}</b> ${key(opts.color)}${esc(opts.label1||'current account')}<br><span style="opacity:.75">${dateY(p.x)}</span>`
      : `<b>${fmt(p.v)}</b><br><span style="opacity:.75">${dateY(p.x)}</span>`;
    tip.style.left=Math.min(Math.max(px/W*bb.width,80),bb.width-80)+'px'; tip.style.top=(py/H*bb.height)+'px'; tip.style.opacity=1; };
  svg.addEventListener('pointermove',move); svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',()=>{ tip.style.opacity=0; [xh,xd,xd2].forEach(n=>n&&n.setAttribute('opacity',0)); });
}
function niceStep(max){ const raw=Math.max(max,1)/4, p=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }

/* ============ insights: comparisons, projections, pace, bills, trends, goals ============ */
const famIncome = t => t.type==='income';
const famSpend = t => t.type==='spend';
/* money in / spent / profit for the four of us between two dates (inclusive) */
function flows(from, to){
  let inc=0, out=0; (D.transactions||[]).forEach(t=>{ if (t.date<from || t.date>to) return; if (famIncome(t)) inc+=t.amount; else if (famSpend(t)) out-=t.amount; });
  return {inc, out, profit:inc-out};
}
const shiftMonth = (m,k) => { const x=dOf(m+'-01'); x.setMonth(x.getMonth()+k); return iso(x).slice(0,7); };
const dayOf = s => +s.slice(8,10);
/* the month being imported: the newest month in the data, and how far into it the data goes */
function currentMonth(){ const X=txIndex(); if(!X.last) return null; const m=X.last.slice(0,7); return {m, day:dayOf(X.last), days:dayOf(monthEnd(m)), complete: X.last===monthEnd(m)}; }
/* a month, or the same days of it if the month is still coming in, so comparisons are like for like */
function monthFlows(m, uptoDay){ const end = uptoDay ? m+'-'+String(Math.min(uptoDay, dayOf(monthEnd(m)))).padStart(2,'0') : monthEnd(m); return flows(m+'-01', end); }
function lastFullMonths(n){ const X=txIndex(), cm=currentMonth(); const ms=X.months.filter(m=>m!==X.months[0] && (!cm || m<cm.m || cm.complete)); return ms.slice(-n); }

/* ---- comparisons: this month against last month and the same month last year ---- */
function compareCard(m){
  const cm = currentMonth(); if (!cm) return '';
  const partial = m===cm.m && !cm.complete, upto = partial ? cm.day : null;
  const a = monthFlows(m, upto), b = monthFlows(shiftMonth(m,-1), upto), c = monthFlows(shiftMonth(m,-12), upto);
  const hasC = c.inc || c.out;
  const pc = (now, was, upGood) => { if (!was) return '<td class="muted">–</td>'; const ch=(now-was)/Math.abs(was)*100; const good=(ch>0)===upGood;
    return `<td class="${Math.abs(ch)<1?'':good?'pos':'neg'}">${Math.abs(ch)<1?'same':(ch>0?'▲ ':'▼ ')+Math.abs(Math.round(ch))+'%'}</td>`; };
  const diff = (now, was) => { const dd = now-was; return `<td class="${Math.abs(dd)<1?'':dd>0?'pos':'neg'}">${Math.abs(dd)<1?'same':gbpS(Math.round(dd)).replace('.00','')}</td>`; };
  const row = (k, now, bb, cc, f) => `<tr onclick="SP.period='${m}';go('spending')" style="cursor:pointer"><td>${k}</td><td>${gbp(now)}</td>${f(now,bb)}${hasC?f(now,cc):''}</tr>`;
  return `<h2>Compared with</h2>
  <div class="card" style="padding:8px 12px"><table class="ytab cmp"><thead><tr><th></th><th>${esc(shortMonth(m))}${partial?' so far':''}</th><th>vs ${esc(shortMonth(shiftMonth(m,-1)))}</th>${hasC?`<th>vs ${esc(shortMonth(m))} ${shiftMonth(m,-12).slice(0,4)}</th>`:''}</tr></thead><tbody>
    ${partial ? '' : row('Money in', a.inc, b.inc, c.inc, (x,y)=>pc(x,y,true))}
    ${row('Spent', a.out, b.out, c.out, (x,y)=>pc(x,y,false))}
    ${partial ? '' : row('Profit', a.profit, b.profit, c.profit, diff)}
  </tbody></table><div class="hint" style="margin:6px 2px 4px">${partial ? `Spending up to day ${cm.day} of each month, like for like. Money in and profit compare once the month is complete, since paydays fall on different days.` : 'Profit shows the change in pounds.'}</div></div>`;
}

/* ---- projections: the last 12 complete months, carried on ---- */
function projection(){
  const ms = lastFullMonths(12); if (ms.length < 3) return null;
  const f = flows(ms[0]+'-01', monthEnd(ms[ms.length-1])), n = ms.length;
  const perMo = f.profit/n, spendMo = f.out/n, incMo = f.inc/n;
  // the current rate: the last 6 complete months, leaving out holidays and one-offs, so one trip does not swing it
  const last6 = lastFullMonths(6), from6 = last6[0]+'-01', to6 = monthEnd(last6[last6.length-1]);
  const oneOff = t => famSpend(t) && t.date>=from6 && t.date<=to6 && t.category!=='Mortgage' && (t.category==='Holidays & travel' || -t.amount>=BIG_ONE_OFF);

/* ---- worth checking: payments that might be a billing error ---- */
const normM = m => String(m||'').toUpperCase().split(/[^A-Z0-9]+/).filter(w=>w && !/^(COM|WWW|LTD|UK|GB|CO)$/.test(w)).sort().join(' ');
let CHK = null;
function checks(){
  const tx = D.transactions||[], X = txIndex(); if (!X.last) return [];
  if (CHK && CHK.src===tx) return CHK.list;
  const gapD = (a,b) => daysBetween(a,b)-1, from = addDays(X.last, -1100), out = [];
  const med = a => { const s=a.slice().sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
  const byDate = (a,b) => a.date<b.date?-1:a.date>b.date?1:a.row-b.row;
  const pay = tx.filter(t=>(t.type==='spend'||t.type==='parents') && t.amount<0 && !/^(Cash|Mortgage)$/.test(t.category));
  const by = {}; pay.forEach(t=>{ const k=normM(t.merchant); if (k) (by[k]||(by[k]=[])).push(t); });
  const refunded = (k, amt, d) => tx.some(r=>r.amount>0 && Math.abs(r.amount-amt)<0.005 && normM(r.merchant)===k && r.date>=d && gapD(d,r.date)<=75);
  const name = t => subName(t.merchant);
  Object.entries(by).forEach(([k, l])=>{
    l.sort(byDate);
    /* the same amount twice within 3 days, nothing refunded */
    const used = new Set(), pairs = {};
    for (let i=0;i<l.length;i++){ if (used.has(l[i])) continue;
      for (let j=i+1;j<l.length && gapD(l[i].date,l[j].date)<=3;j++){
        const a=l[i], b=l[j]; if (used.has(b) || -a.amount<20 || Math.abs(a.amount-b.amount)>=0.005) continue;
        if (!refunded(k, -a.amount, b.date)) { used.add(a); used.add(b); (pairs[-a.amount]||(pairs[-a.amount]=[])).push([a,b]); }
        break; } }
    Object.entries(pairs).forEach(([amt, ps])=>{ amt = Number(amt); if (ps[ps.length-1][1].date < from) return;
      const d1 = ps[0][0].date, d2 = ps[0][1].date, n = ps.length;
      out.push({kind:'dup', key:'dup|'+k+'|'+amt.toFixed(2)+'|'+d1, date:ps[n-1][1].date, amt, list:ps.flat(),
        title: name(ps[0][0])+' took '+gbp(amt)+' twice',
        sub: n>1 ? n+' times, '+dateY(d1)+' to '+dateY(ps[n-1][1].date) : d1===d2 ? 'Both on '+dateY(d1) : dateY(d1)+' and '+dateY(d2),
        why: (n>1 ? 'Two payments of the same amount on the same few days, '+n+' times. Fine if it is two of something (two policies, two tickets). ' : 'Two payments of the same amount within a few days. Fine if it was two of something. ')+'No refund of '+gbp(amt)+' has come back.'});
    });
    /* a regular payment: same shop, similar amount */
    const cl = [];
    l.slice().sort((a,b)=>a.amount-b.amount).forEach(t=>{ const c=cl[cl.length-1]; if (c && Math.abs(t.amount-c.base)<=Math.max(0.5,-c.base*0.03)) c.l.push(t); else cl.push({base:t.amount, l:[t]}); });
    cl.forEach(c=>{ if (c.l.length < 3 || -c.base < 5) return;
      const s = c.l.sort(byDate), days = [...new Set(s.map(t=>t.date))]; if (days.length < 3) return;
      const gaps = days.slice(1).map((d,i)=>gapD(days[i],d)), g = med(gaps), steady = gaps.filter(x=>Math.abs(x-g)<=Math.max(5,g*0.1)).length/gaps.length;
      const near = l.filter(t=>Math.abs(t.amount-c.base)<=-c.base*0.2).length, yearly = g>=330 && g<=400 && near<=c.l.length+1, monthly = g>=26 && g<=35 && steady>=0.7;
      days.slice(1).forEach((d,i)=>{ const p = days[i], x = gaps[i]; if (d < from) return;
        if ((yearly && x>=14 && x<=80) || (monthly && x>=4 && x<=12)){
          const both = s.filter(t=>t.date===p||t.date===d), amt = -both[both.length-1].amount;
          if (refunded(k, amt, d)) return;
          out.push({kind:'twice', key:'twice|'+k+'|'+d, date:d, amt, list:both,
            title: name(both[0])+' paid twice in one '+(yearly?'year':'month'),
            sub: dateY(p)+' and '+dateY(d)+', '+x+' days apart',
            why: 'This is usually paid once a '+(yearly?'year':'month')+'. Check the second one was meant, and was not taken twice for the same thing.'});
        } });
      /* a monthly payment that has stopped, with nothing at that shop or of that amount since */
      const last = days[days.length-1], since = gapD(last, X.last), lastAmt = s[s.length-1].amount;
      if (monthly && days.length>=4 && since > g*1.6+5 && since <= 150 && !l.some(t=>t.date>last)
          && !pay.some(t=>t.date>last && Math.abs(t.amount-lastAmt)<0.005)){
        out.push({kind:'stopped', key:'stopped|'+k+'|'+last, date:last, amt:-lastAmt, list:s.slice(-4),
          title: name(s[0])+' has stopped',
          sub: 'Paid every month, last on '+dateY(last),
          why: 'Nothing has gone to them since. Fine if you cancelled it. If not, the cover or account may have lapsed.'});
      }
    });
    /* a steady monthly bill that jumped */
    const perDay = {}; l.forEach(t=>perDay[t.date]=(perDay[t.date]||0)-t.amount);
    const ds = Object.keys(perDay).sort(); if (ds.length < 7) return;
    const tail = ds.slice(-7), tg = tail.slice(1).map((d,i)=>gapD(tail[i],d)), mg = med(tg);
    if (!(mg>=26 && mg<=35) || tg.some(x=>x<20||x>40)) return;
    const prev = tail.slice(0,6).map(d=>perDay[d]), now = perDay[tail[6]], m = med(prev), lastD = tail[6];
    if (lastD >= from && Math.max(...prev)/Math.min(...prev) <= 1.2 && now >= m*1.25 && now-m >= 3)
      out.push({kind:'jump', key:'jump|'+k+'|'+lastD, date:lastD, amt:now, list:l.filter(t=>tail.includes(t.date)),
        title: name(l[l.length-1])+' went up '+Math.round((now/m-1)*100)+'%',
        sub: gbp(now)+' on '+dateY(lastD)+', usually '+gbp(m),
        why: 'A steady monthly bill came out much higher. Check it is a price rise you expected, not a mistake.'});
  });
  out.sort((a,b)=>a.date<b.date?1:-1);
  CHK = {src:tx, list:out}; return out;
}
const isChecked = f => (D.checked||[]).includes(f.key);
const CHK_ICON = {dup:'&#x1F501;', twice:'&#x1F4C5;', stopped:'&#x23F8;&#xFE0F;', jump:'&#x1F4C8;'};

/* ---- bills and subscriptions: anything that comes out on a regular cycle ---- */
function recurring(){
  const X = txIndex(); if (!X.last) return [];
  const since = addDays(X.last, -400), g = {};
  (D.transactions||[]).forEach(t=>{ if (t.type==='spend' && t.date>=since && t.category!=='Mortgage') (g[t.merchant]||(g[t.merchant]=[])).push(t); });
  const med = a => { const s=a.slice().sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
  const out = [];
  Object.entries(g).forEach(([m, list])=>{
    list.sort((a,b)=>a.date<b.date?-1:1);
    const days = [...new Set(list.map(t=>t.date))]; if (days.length < 3) return;
    const gaps = days.slice(1).map((d,i)=>daysBetween(days[i],d)-1), gap = med(gaps);
    const cycle = gap>=6&&gap<=8 ? ['weekly',52/12] : gap>=26&&gap<=35 ? ['monthly',1] : gap>=85&&gap<=95 ? ['quarterly',1/3] : null;
    if (!cycle) return;
    const steady = gaps.filter(x=>Math.abs(x-gap)<=Math.max(4,gap*0.25)).length/gaps.length; if (steady < 0.7) return;
    const lastD = days[days.length-1]; if (daysBetween(lastD, X.last) > gap*1.8+3) return;   // stopped
    const amt = -med(list.slice(-3).map(t=>t.amount));
    const yearAgo = list.filter(t=>daysBetween(t.date, lastD) >= 330 && daysBetween(t.date, lastD) <= 400);
    const was = yearAgo.length ? -med(yearAgo.map(t=>t.amount)) : null;
    out.push({m, cat:list[list.length-1].category, cycle:cycle[0], amt, monthly: amt*cycle[1], next: addDays(lastD, Math.round(gap)), last:list[list.length-1],
      rise: was && amt-was>=1 && (amt-was)/was>=0.05 ? (amt-was)/was : null});
  });
  return out.sort((a,b)=>b.monthly-a.monthly);
}

function merchantSheet(m){ txListSheet(subName(m), (D.transactions||[]).filter(t=>t.merchant===m), 'Every payment'); }
function openGroup(g){
  const r = txRange(), sp = spendTx(r).filter(t=>catGroup(t.category)===g), cats = sumBy(sp,'category'), tot = sp.reduce((a,t)=>a-t.amount,0);
  showSheet(`<div class="grab"></div><h3 style="margin:0">${esc(g)}</h3><div class="hint" style="margin:2px 0 10px">${esc(r.label)} · ${gbp(tot)} in all</div>
    ${cats.map(([c,v])=>`<button class="stat-row" onclick="openCat(${jsA(c)})"><span class="k">${CAT_ICON[c]||''} ${esc(c)}</span><span class="v">${gbp(v)}&nbsp;›</span></button>`).join('') || '<div class="empty">Nothing in this period</div>'}`);
}
function txItem(t){
  return `<div class="item" style="--c:${t.amount>0?'var(--inc)':'var(--spd)'};cursor:pointer" onclick="editTx(${t.row})">
    <div class="dot" style="background:var(--bg);font-size:16px">${CAT_ICON[t.category]||'•'}</div>
    <div class="mid"><div class="t">${esc(t.merchant)}</div><div class="d">${t.pot?`<span class="pp" style="color:${COLOR[t.pot]}">${esc(t.pot)}${t.potAmt!=null&&Math.abs(t.potAmt-t.amount)>0.005?' '+gbp(Math.abs(t.potAmt)):''}</span>`:''}${isPayPal(t)?'<span class="pp">PayPal</span>':''}${dateY(t.date)} · ${esc(t.category)}</div></div>
    <div class="amt ${t.amount<0?'neg':'pos'}">${gbpS(t.amount)}</div></div>`;
}
function editTx(row){
  const t = D.transactions.find(x=>x.row===row); if(!t) return;
  const spendCats = (D.categories||[]).map(c=>c.name);
  if (t.type==='parents') return showSheet(`<div class="grab"></div><h3 style="margin:0 0 4px">${esc(t.merchant)}</h3>
    <div class="hint" style="margin:0 0 8px">${niceDate(t.date)} · <b class="${t.amount<0?'neg':'pos'}">${gbpS(t.amount)}</b> · the parents'</div>
    <button class="primary" onclick="run('setParents',[${row},false],'Marked as yours')">Not the parents', it's ours</button>
    <button class="secondary" onclick="closeSheet()">Cancel</button>`);
  const opts = t.amount>0 ? INCOME_CATS.concat(['Savings & ISA']) : spendCats.concat(['Own account transfers','Savings & ISA']);
  const same = D.transactions.filter(x=>x.merchant===t.merchant).length;
  showSheet(`<div class="grab"></div><h3 style="margin:0 0 4px">${esc(t.merchant)}</h3>
    <div class="hint" style="margin:0 0 8px">${niceDate(t.date)} · <b class="${t.amount<0?'neg':'pos'}">${gbpS(t.amount)}</b>${t.note&&!/parent|please check/i.test(t.note)?' · '+esc(t.note):''}</div>
    <label class="f" style="margin-top:4px">Category</label>
    <div class="chips wrap">${(()=>{ const n = {}, since = addDays(today(),-365); D.transactions.forEach(x=>{ if (x.date>=since && (x.amount<0)===(t.amount<0) && opts.includes(x.category)) n[x.category]=(n[x.category]||0)+1; });
      return Object.keys(n).sort((a,b)=>n[b]-n[a]).slice(0,8).concat(opts.includes(t.category)?[t.category]:[]).filter((c,i,a)=>a.indexOf(c)===i)
        .map(c=>`<button class="chip ${c===t.category?'on':''}" onclick="run('setCategory',[${row},${jsA(c)},!!($('#txAll')&&$('#txAll').checked)],${jsA(c===t.category?'No change':'Now '+c)})">${CAT_ICON[c]||''} ${esc(c)}</button>`).join(''); })()}</div>
    <select class="inp" id="txCat" onchange="run('setCategory',[${row},this.value,!!($('#txAll')&&$('#txAll').checked)],'Category updated')"><option value="" selected disabled>Something else…</option>${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select>
    ${same>1?`<label class="toggle"><input type="checkbox" id="txAll" checked> Also change the other ${same-1} payment${same>2?'s':''} to ${esc(t.merchant)}</label>`:''}
    <label class="f">${t.amount<0?'Paid from a pot':'Goes into a pot'}</label>
    <div class="two" style="align-items:center"><input class="inp" id="txPotAmt" inputmode="decimal" value="${Math.abs(t.potAmt??t.amount).toFixed(2)}" aria-label="How much"><span class="hint" style="margin:0">of ${gbp(Math.abs(t.amount))}. Change it if only part is theirs.</span></div>
    <div class="chips">${['',...D.pots.map(p=>p.name)].map(n=>`<button class="chip ${(t.pot||'')===n?'on':''}" ${n?`style="--c:${COLOR[n]}"`:''} onclick="run('setTxPot',[${row},'${n}',parseFloat($('#txPotAmt').value)||null],'${n?(t.amount<0?'Paid from '+n:'Added to '+n):'No pot'}')">${n||'None'}</button>`).join('')}</div>
    ${canP()?`<button class="secondary" onclick="run('setParents',[${row},true],'Marked as theirs')">It's the parents'</button>`:''}
    <button class="secondary" onclick="closeSheet()">Close</button>`);
}

/* ============ pot sheet ============ */
let S = {mode:'spend', person:'Tom', to:'Laura'};
function openPot(person, mode){
  S = {mode:mode||'spend', person:person||S.person||'Tom', to:null};
  S.to = PEOPLE.find(n=>n!==S.person);
  $('#sheet').innerHTML='';
  drawSheet(); showSheet();
}
function drawSheet(){
  const pot = D.pots.find(p=>p.name===S.person);
  const c = S.mode==='spend'?COLOR[S.person]:S.mode==='add'?'var(--nathan)':'var(--evy)';
  const amtVal = $('#amt')?$('#amt').value:'', descVal=$('#desc')?$('#desc').value:'';
  const who = (sel, key) => `<div class="chips">${PEOPLE.map(n=>`<button class="chip ${sel===n?'on':''}" style="--c:${COLOR[n]}" onclick="S.${key}='${n}';${key==='person'&&S.mode==='move'?"if(S.to==='"+n+"')S.to=PEOPLE.find(x=>x!=='"+n+"');":''}drawSheet()">${n}</button>`).join('')}</div>`;
  const recent = D.log.filter(e=>e.person===S.person).slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,3);
  $('#sheet').innerHTML = `<div class="grab"></div>
    <div class="pot-head" style="--c:${COLOR[S.person]}"><div><span class="k">${esc(S.person)}'s pot</span><b>${gbp(pot.balance)}</b></div>
      <button class="chip" onclick="closeSheet();histFilter='${S.person}';go('history')">History ›</button></div>
    ${recent.length?`<div class="pot-recent">${recent.map(e=>`<button class="stat-row" onclick="openEntry('${e.id}')"><span class="k">${esc(e.desc)} <small>${esc(niceDate(e.date))}</small></span><span class="v ${e.amount<0?'neg':'pos'}">${gbpS(e.amount)}</span></button>`).join('')}</div>`:''}
    <div class="seg">${['spend','add','move'].map(m=>`<button class="${S.mode===m?'on':''}" onclick="S.mode='${m}';drawSheet()">${{spend:'Spend',add:'Add',move:'Move'}[m]}</button>`).join('')}</div>
    ${S.mode==='move'?`<label class="f" style="margin-top:0">From</label>${who(S.person,'person')}<div class="arrow">↓</div><label class="f" style="margin-top:0">To</label>${who(S.to,'to')}`:
      `<label class="f" style="margin-top:0">${S.mode==='spend'?'Spend from':'Add to'}</label>${who(S.person,'person')}`}
    <div class="amount-wrap"><span>£</span><input id="amt" inputmode="decimal" enterkeyhint="next" placeholder="0.00" value="${esc(amtVal)}" oninput="afterHint()" onkeydown="if(event.key==='Enter'){event.preventDefault();$('#desc').focus()}"></div>
    <div class="after" id="after"></div>
    <div class="chips" style="justify-content:center">${[5,10,20,50].map(v=>`<button class="chip" onclick="$('#amt').value=${v};afterHint()">£${v}</button>`).join('')}</div>
    ${(()=>{ const seen = new Set(), l = S.mode==='move' ? [] : D.log.filter(e=>e.person===S.person && (S.mode==='spend' ? e.amount<0 : e.amount>0) && e.desc && !/top-up|opening/i.test(e.desc))
        .slice().sort((a,b)=>a.date<b.date?1:-1).filter(e=>{ const k = e.desc.toLowerCase()+'|'+Math.abs(e.amount); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0,6);
      return l.length ? `<label class="f">Again</label><div class="chips wrap">${l.map(e=>`<button class="chip" onclick="$('#amt').value=${Math.abs(e.amount)};$('#desc').value=${jsA(e.desc)};afterHint()">${esc(e.desc)} ${gbp(Math.abs(e.amount))}</button>`).join('')}</div>` : ''; })()}
    <label class="f">What for?</label>
    <input class="inp" id="desc" onkeydown="if(event.key==='Enter'){event.preventDefault();savePot()}" placeholder="${S.mode==='spend'?'e.g. Toys, clothes, day out':S.mode==='add'?'e.g. Birthday money':'Optional note'}" value="${esc(descVal)}">
    <div class="two"><div><label class="f">Date</label><input class="inp" id="edate" type="date" value="${today()}"></div><div></div></div>
    ${S.mode==='add'?`<div class="hint" style="margin-top:10px">Comes out of the Family pot: ${gbp(D.overview.familyPot)} → <b>${gbp(D.overview.familyPot-(parseFloat(amtVal)||0))}</b></div>`:''}
    ${S.mode==='spend'?`<label class="toggle"><input type="checkbox" id="fromBank" checked> Paid from our account (takes it off the bank balance too)</label>`:''}
    <button class="primary" style="--c:${c}" onclick="savePot()">${S.mode==='spend'?'Spend from '+S.person:S.mode==='add'?'Add to '+S.person:'Move to '+S.to}</button>
`;
  afterHint();
}
function afterHint(){
  const el=$('#after'); if(!el) return;
  const a=parseFloat($('#amt').value)||0, p=D.pots.find(x=>x.name===S.person);
  if(S.mode==='move'){ const q=D.pots.find(x=>x.name===S.to); el.innerHTML=`${S.person}: ${gbp(p.balance-a)} · ${S.to}: ${gbp(q.balance+a)}`; }
  else { const after = S.mode==='spend'?p.balance-a:p.balance+a; el.innerHTML = `${S.person}'s pot: ${gbp(p.balance)} → <b class="${after<0?'neg':''}">${gbp(after)}</b>`
    + (S.mode==='add'?`<br>Family pot: ${gbp(D.overview.familyPot)} → <b class="${D.overview.familyPot-a<0?'neg':''}">${gbp(D.overview.familyPot-a)}</b>`:''); }
}
function savePot(){
  const a=parseFloat($('#amt').value); if(!a||a<=0) return toast('Enter an amount');
  const desc=$('#desc').value.trim(), date=$('#edate').value||today();
  if(S.mode==='move') return runWithUndo('transfer',[{from:S.person,to:S.to,amount:a,desc,date}], `Moved ${gbp(a)} ${S.person} → ${S.to}`);
  const amount = S.mode==='spend'?-a:a;
  runWithUndo('addEntry',[{person:S.person,amount,desc,date,fromBank:S.mode==='spend'?($('#fromBank')?$('#fromBank').checked:true):false}], S.mode==='spend'?`Spent ${gbp(a)} from ${S.person}`:`Added ${gbp(a)} to ${S.person}`);
}
function runWithUndo(fn,args,msg){
  const id = run(fn,args,null)[0].id;
  toast(msg, ()=>run('deleteEntry',[id],'Undone'));
}
function removeEntry(id){
  const e=D.log.find(x=>x.id===id); if(!e) return;
  const extra = D.log.filter(x=>x.id===id).length>1 ? ' (both sides of this move)' : '';
  if(confirm(`Remove "${e.desc}" ${gbpS(e.amount)}${extra}?`)) run('deleteEntry',[id],'Entry removed');
}

function hRun(fn, args, msg, undo, opts){

/* ---- people: age, what they need a day, their usual portion ---- */
function hp(name){ return (H.people||[]).find(p=>p.name===name) || {name}; }
function ageYears(name){
  const p = hp(name);
  if (p.dob) return (dOf(today()) - dOf(p.dob)) / (365.25*864e5);
  const pot = D && D.pots && D.pots.find(x=>x.name===name), a = pot ? pot.age : p.age;
  return typeof a === 'number' ? a : null;
}
function latestBody(name, key, upto){ const b = H.body.filter(x=>x.person===name && x[key]!=null && (!upto || x.date<=upto)); return b.length ? b[b.length-1] : null; }
function kcalNeed(name){
  const p = hp(name), age = ageYears(name), sex = p.sex;
  if (p.target) return {kcal:p.target, how:'your own target'};
  if (age != null && age < 18){
    const t = H.ear[sex||'M'], k = age < 1 ? Math.round(t[1]*0.8) : t[Math.floor(age)];
    return {kcal:k, how:`average for a ${Math.floor(age)||'under 1'}-year-old ${sex==='F'?'girl':sex==='M'?'boy':'child'} (UK SACN)`};
  }
  const w = latestBody(name,'kg'), h = latestBody(name,'cm');
  if (sex && age != null && w && h){
    const bmr = 10*w.kg + 6.25*h.cm - 5*age + (sex==='M'?5:-161), act = p.activity || 1.375;
    return {kcal:Math.round(bmr*act/10)*10, how:'from weight, height, age and activity (Mifflin-St Jeor)'};

}
function usualPortion(name){ const a = ageYears(name); if (a == null || a >= 18) return 1;
  return Math.max(0.25, Math.min(1, Math.round(kcalNeed(name).kcal/2250*4)/4)); }
const FRAC = {0.25:'¼',0.5:'½',0.75:'¾',1:'1',1.25:'1¼',1.5:'1½',2:'2'};
const fmtPortion = p => (FRAC[Math.round(p*100)/100] || String(Math.round(p*100)/100)) + ' portion' + (p>1?'s':'');
/* a portion against that person's own usual one (a child's usual is smaller, set by age, and never shown) */
const relPortion = e => Math.round((e.portion||1) / (usualPortion(e.person)||1) * 100) / 100;
const portionWord = e => { const r = relPortion(e); return {0.5:'Small', 1:'Usual', 1.5:'Big', 2:'Double'}[r] || (FRAC[r] || r) + ' of usual'; };
const kcalF = n => Math.round(n).toLocaleString('en-GB') + ' kcal';
const kgF = n => n==null ? '–' : (Math.round(n*10)/10).toLocaleString('en-GB') + ' kg';
const stF = kg => { const lb = Math.round(kg/0.453592), st = Math.floor(lb/14); return st+' st '+(lb-st*14)+' lb'; };
const cmF = n => n==null ? '–' : (Math.round(n*10)/10).toLocaleString('en-GB') + ' cm';
function defaultSlot(){ const h = new Date().getHours()+new Date().getMinutes()/60; return h<10.5?'Breakfast':h<14.5?'Lunch':h>=16.5&&h<20.5?'Dinner':'Snack'; }

/* ---- BMI: adults by the usual bands, children by their WHO centile for age ---- */
let LMS_T = null;
function lmsAt(sex, months){
  if (!LMS_T) LMS_T = BMI_LMS.map(s=>s.split(';').map(r=>r.split(',').map(Number)));
  const t = LMS_T[sex==='F'?1:0], i = Math.floor(months), f = months-i;
  if (i < 0 || i >= t.length-1) return i === t.length-1 ? t[i] : null;
  return t[i].map((v,k)=>v+(t[i+1][k]-v)*f);
}
function normCdf(z){ const t=1/(1+0.2316419*Math.abs(z)), d=0.3989423*Math.exp(-z*z/2), p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>0?1-p:p; }
function bmiInfo(name, at){
  const w = latestBody(name,'kg',at), h = latestBody(name,'cm',at) || latestBody(name,'cm'); if (!w || !h) return null;
  const m = h.cm/100, bmi = w.kg/(m*m), p = hp(name), dob = p.dob, age = dob ? (dOf(w.date)-dOf(dob))/(365.25*864e5) : ageYears(name);
  if (age != null && age < 18){
    if (!p.sex) return {bmi, child:true, label:'Add sex in Settings for the centile'};
    const L = lmsAt(p.sex, age*12); if (!L) return {bmi, child:true, label:''};
    const z = L[0] ? (Math.pow(bmi/L[1],L[0])-1)/(L[0]*L[2]) : Math.log(bmi/L[1])/L[2], c = normCdf(z)*100;

    return {bmi, child:true, centile:c, cat, cls:cat==='Healthy weight'?'pos':'neg', baby: age<2,

  }

  return {bmi, cat, cls:cat==='Healthy weight'?'pos':'neg', label:cat, lo:18.5*m*m, hi:24.9*m*m};

/* ---- totals ---- */
function dayMap(name, from, to){
  const d = {};
  H.meals.forEach(e=>{ if (e.person!==name || e.date<from || e.date>to) return;
    const x = d[e.date] || (d[e.date] = {kcal:0, veg:0, treats:0, takeaway:0, slots:{}});
    x.kcal += e.kcal; x.veg += e.veg||0; x.slots[e.meal] = (x.slots[e.meal]||0) + e.kcal;
    if (e.group==='Snack') x.treats++; if (e.group==='Takeaway') x.takeaway++; });
  return d;
}
/* a day counts towards averages once two of its three main meals are in */
const fullDay = x => ['Breakfast','Lunch','Dinner'].filter(s=>x.slots[s]!=null).length >= 2;
function personStats(name, from, to){
  const d = dayMap(name, from, to), days = Object.keys(d).sort(), full = days.filter(k=>fullDay(d[k]));
  const n = Math.max(1, daysBetween(from, to)), avg = f => full.length ? full.reduce((a,k)=>a+f(d[k]),0)/full.length : 0;
  const bySlot = {}; ALL_SLOTS.forEach(s=>bySlot[s] = avg(x=>x.slots[s]||0));
  return {d, days, full, logged:days.length, n, kcal:avg(x=>x.kcal), veg:avg(x=>x.veg), bySlot,
    treatsWk: days.reduce((a,k)=>a+d[k].treats,0)/n*7, takeaways: days.reduce((a,k)=>a+d[k].takeaway,0),
    noBreakfast: full.filter(k=>d[k].slots.Breakfast==null).length};
}
function topFoods(filter, limit){
  const m = {};
  H.meals.forEach(e=>{ if (!filter(e)) return; const k = e.food.toLowerCase(), x = m[k] || (m[k] = {name:e.food, n:0, kcal:0, last:''});
    x.n++; x.kcal += e.kcal; if (e.date >= x.last){ x.last = e.date; x.one = (e.served||e.kcal)/(e.portion||1); x.group = e.group; x.veg = e.veg; x.slot = e.meal; } });
  return Object.values(m).sort((a,b)=>b.n-a.n || (a.last<b.last?1:-1)).slice(0, limit||10);
}

function eatingStats(n, from, to){

  if (Math.abs(a.length - b.length) > n) return false;

function wordFit(t, w){

  const n = {}; H.meals.forEach(e=>{ if (!AM.who.includes(e.person) || e.meal!=='Dinner') return; const k = e.food.toLowerCase(); MEATS.forEach(([m])=>{ if (k.includes(m.toLowerCase())) n[m] = (n[m]||0)+1; }); });
  return MEATS.map((p,i)=>[p,i]).sort((a,b)=>(n[b[0][0]]||0)-(n[a[0][0]]||0) || a[1]-b[1]).slice(0, 10).map(x=>x[0]);
}
function amMeat(name){ const x = MEATS.find(p=>p[0]===name); if (x) amAdd({name:x[0], kcal:x[1], group:'Meal', veg:0, src:'meat'}); }
const agoF = d => { if (!d) return ''; const n = daysBetween(d, today())-1; return n<=0 ? 'today' : n===1 ? 'yesterday' : n<7 ? n+' days ago' : n<60 ? Math.round(n/7)+' weeks ago' : Math.round(n/30.44)+' months ago'; };

  else { const y = list.filter(f=>f.src==='yesterday'), rc = list.filter(f=>f.src==='recent'), n = AMS.full ? 40 : 6; more = rc.length - n; list = y.concat(rc.slice(0, n)); }
  AMLIST = list;
  const sc = AM.who.length===1 ? eatScores(AM.who[0]) : {};
  const row = (f, i) => `<button class="item food" onclick="amPick(${i})"><div class="dot" style="background:var(--card-2);font-size:17px">${GROUP_ICON[f.group]||'🍽️'}</div>
    <div class="mid"><div class="t">${esc(f.name)}</div><div class="d">${f.src==='yesterday'?'Yesterday':f.src==='recent'?'Had '+agoF(f.last)+(f.times>1?` · ${f.times} times`:''):f.src==='usual'?`Had ${f.times} time${f.times>1?'s':''}`:'Typical meal'}${f.veg?' · '+f.veg+' fruit &amp; veg':''}${esc(likeTag(sc[f.name.toLowerCase()]))}</div></div>
    </button>`;
  const sect = (title, src) => { const l = AMLIST.map((f,i)=>[f,i]).filter(([f])=>f.src===src); return l.length ? `${title?`<label class="f">${title}</label>`:''}<div class="list">${l.map(([f,i])=>row(f,i)).join('')}</div>` : ''; };
  const inSlot = AM.slot && !AM.swap ? H.meals.filter(e=>e.date===HD && e.person===AM.who[0] && e.meal===AM.meal) : [];
  const dayName = HD===today() ? 'today' : HD===addDays(today(),-1) ? 'yesterday' : dOf(HD).toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'short'});
  const added = !AM.slot && !AM.swap && AM.added && AM.added.length;
  $('#sheet').innerHTML = `<div class="grab" id="addMealSheet"></div>
    ${added ? `<div class="am-added">&#x2713; Added ${esc(AM.added.join(', '))}</div>` : ''}
    ${AM.slot && !AM.swap ? `<h3 style="margin:0 0 2px">${esc(AM.who[0])}'s ${AM.meal.toLowerCase()}, ${esc(dayName)}</h3>
      ${inSlot.length ? `<label class="f">What ${esc(AM.who[0])} had</label><div class="list slot-list">${inSlot.map(e=>`<div class="item">
          <button class="mid plain" onclick="editMeal('${e.id}')"><div class="t">${esc(e.food)}${esc(eatTag(e))}</div><div class="d">${esc(portionWord(e))}${e.diary?' · Food diary':''} · tap to adjust</div>${e.note?`<div class="d note">&ldquo;${esc(e.note)}&rdquo;</div>`:''}</button>
          <button class="chip" onclick="slotChange('${e.id}')">Change</button>
          <button class="icon-btn" aria-label="Remove ${esc(e.food)}" onclick="slotRemove('${e.id}')">&times;</button></div>`).join('')}</div>
        <label class="f">Add something else</label>` : `<div class="hint" style="margin:0 0 4px">Type it, or tap one ${esc(AM.who[0])} has had.</div>`}`
    : AM.swap ? `<button class="back-link" onclick="drawEditMeal()">&lsaquo; Back</button><h3 style="margin:0 0 2px">Swap ${esc(AM.swap.name)}</h3><div class="hint" style="margin:0 0 6px">Tap the food they had instead, for ${esc(AM.who.join(', '))}.</div>`
    : EATERS.length < 2 ? '' : `<label class="f" style="margin-top:0">Who ate it</label>
    <div class="chips">${EATERS.map(n=>`<button class="chip ${AM.who.length===1&&AM.who[0]===n?'on':''}" style="--c:${COLOR[n]}" onclick="AM.who=['${n}'];drawAddMeal()">${n}</button>`).join('')}
      <button class="chip ${AM.who.length===EATERS.length?'on':''}" onclick="AM.who=EATERS.slice();drawAddMeal()">Both</button></div>`}
    ${AM.slot && !AM.swap ? '' : `<div class="seg four" style="margin-top:12px">${SLOTS.map(s=>`<button class="${AM.meal===s?'on':''}" onclick="AM.meal='${s}';drawAddMeal()"><span>${SLOT_ICON[s]}</span>${s}</button>`).join('')}</div>`}
    <input class="inp" id="amQ" placeholder="Type what they had" value="${esc(AM.q)}" autocomplete="off" oninput="AM.q=this.value;AM.est=null;AM.online=null;clearTimeout(window._aq);window._aq=setTimeout(()=>{drawAddMeal();const i=$('#amQ');i.focus();i.setSelectionRange(i.value.length,i.value.length)},150)" onkeydown="if(event.key==='Enter'){AM.q=this.value;amTyped()}">
    ${!AM.swap && (AM.meal==='Lunch' || AM.meal==='Dinner') ? `<button class="veg-switch ${amVegOn()?'on':''}" onclick="amVegT()" aria-pressed="${amVegOn()}"><span class="vs-box">${amVegOn()?'&#x2713;':''}</span><span>&#x1F966; <b>+ veg</b><small>${amVegOn()?'A portion of mixed veg goes in with it':'Tap to add a portion of mixed veg with it'}</small></span></button>` : ''}
    ${!q && !AM.swap && AM.meal==='Dinner' ? `<label class="f">Meat and veg</label><div class="chips wrap">${meatChips().map(([m])=>`<button class="chip" onclick="amMeat(${jsA(m)})">${esc(m)}</button>`).join('')}</div>` : ''}
    ${q && !AMLIST.some(f=>f.name.toLowerCase()===q.toLowerCase()) ? `<button class="primary am-typed" onclick="amTyped()">${AM.swap?'Use':'Add'} &ldquo;${esc(q.charAt(0).toUpperCase()+q.slice(1))}&rdquo;${amVegOn()&&!/veg|salad/i.test(q)?' + veg':''}</button>` : ''}
    ${q?`<label class="f">${AMLIST.length?'Or one we have had':''}</label>`:''}
    ${q?sect('','usual')+sect('','base'):''}
    <details class="am-opts" ${AM.optsOpen || AM.eaten<1 || AM.note ? 'open' : ''} ontoggle="AM.optsOpen=this.open">
      <summary><span>Portion, how much eaten, comment</span><b>${esc([{0.5:'Small',1:'Usual',1.5:'Big',2:'Double'}[AM.size], eatLabel(AM.eaten==null?1:AM.eaten)].join(' · '))}</b></summary>
      <div class="chips">${[[0.5,'Small'],[1,'Usual'],[1.5,'Big'],[2,'Double']].map(([v,l])=>`<button class="chip ${AM.size===v?'on':''}" onclick="AM.size=${v};drawAddMeal()">${l}</button>`).join('')}</div>
      <div class="hint" style="margin:2px 2px 6px">${AM.swap?'Usual keeps everyone\'s portion as it was.':'Usual is what they normally have.'}</div>
      ${eatenCtl(AM.eaten==null?1:AM.eaten, 'amEat')}
      <input class="inp" id="amNote" placeholder="Comment (optional)" value="${esc(AM.note||'')}" oninput="AM.note=this.value" autocomplete="off" style="margin:8px 0 4px">
    </details>
    ${sect('Worked out','estimate')}${sect('Found online','online')}
    ${q?'':sect('Same as '+(HD===today()?'yesterday':'the day before'),'yesterday')}
    ${q?'':`<div class="menu-h"><label class="f">Had before</label>
      <div class="mini-seg">${[[false,AM.meal],[true,'Any meal']].map(([v,l])=>`<button class="${AMS.all===v?'on':''}" onclick="AMS.all=${v};drawAddMeal()">${esc(l)}</button>`).join('')}</div></div>`}
    ${q?'':sect('','recent') || '<div class="hint" style="margin:4px 2px">Nothing yet. Whatever you add shows here next time.</div>'}
    ${q||(more<=0&&!AMS.full)?'':`<button class="link-btn" onclick="AMS.full=!AMS.full;drawAddMeal()">${AMS.full?'Show fewer':'Show more'}</button>`}
    ${AM.slot && !AM.swap && !inSlot.length ? `<button class="link-btn" style="margin-top:14px" onclick="slotSkip()">${esc(AM.who[0])} didn't have this meal (skipped)</button>` : ''}
    <button class="${added||(AM.slot&&inSlot.length)?'primary':'secondary'}" onclick="closeSheet()">${AM.swap?'Cancel':added||(AM.slot&&inSlot.length)?'Done':'Close'}</button>`;
}
function amWho(n){ AM.who = AM.who.includes(n) ? AM.who.filter(x=>x!==n) : EATERS.filter(x=>x===n||AM.who.includes(x)); drawAddMeal(); }
/* what was typed, added as it is (kcal behind the scenes is a typical one for that meal) */
function amTyped(){
  const q = AM.q.trim(); if (!q) return;
  const hit = amCandidates().find(f=>f.name.toLowerCase()===q.toLowerCase()); if (hit) return amAdd(hit);
  amAdd({name:q.charAt(0).toUpperCase()+q.slice(1), kcal:{Breakfast:350, Lunch:500, Dinner:650, Snack:200}[AM.meal] || 400, group:'Meal', veg:/salad|veg|fruit|apple|banana|orange|grapes/i.test(q)?1:0, src:'estimate'});
}
function amPick(i){ amAdd(AMLIST[i]); }
function amAdd(f){
  if (!AM.who.length) return toast('Pick who ate it');
  const ate = AM.eaten==null ? 1 : AM.eaten, note = (AM.note||'').trim();
  if (AM.swap){ const old = AM.swap.rows, list = old.map(x=>{ const m = f.person ? AM.size : AM.size===1 ? x.portion : amMult(H.meals.find(e=>e.id===x.id).person), sv = Math.round(f.kcal*m);
      return {id:x.id, date:AM.swap.date, meal:AM.meal, food:f.name, kcal:Math.round(sv*ate), served:sv, eaten:ate, note:note||x.note||'', portion:m, veg:f.veg||0, group:f.group||'Meal'}; });
    HD = AM.swap.date;
    return hRun('editMeals', [list], `Swapped for ${f.name}`, ()=>hRun('editMeals',[old],'Put back'));
  }
  const eaters = f.person ? [f.person] : AM.who, mult = n => f.person ? AM.size : amMult(n);
  const veg = amVegOn() && vegFits(f) && !H.meals.some(e=>e.date===HD && e.meal===AM.meal && eaters.includes(e.person) && e.food===VEG_FOOD);
  const list = eaters.map(n=>({date:HD, person:n, meal:AM.meal, food:f.name, kcal:Math.round(f.kcal*mult(n)*ate), served:Math.round(f.kcal*mult(n)), eaten:ate, note, portion:mult(n), veg:f.veg||0, group:f.group||'Meal'}))
    .concat(veg ? eaters.map(n=>vegRow(n, HD, AM.meal, mult(n), ate)) : []);
  const who = eaters.length===EATERS.length && EATERS.length>1 ? 'both' : eaters.join(' & '), label = f.name + (veg ? ' + veg' : '');
  const stay = {keep:true, redraw:drawAddMeal, mark:'addMealSheet'};
  AM.added = (AM.added||[]).concat(label); AM.q = ''; AM.est = null; AM.online = null;
  hRun('addMeals', [list, null], `${label} for ${who}${ate<1?' ('+eatLabel(ate).toLowerCase()+')':''}`, raw=>{ const i = AM.added.lastIndexOf(label); if (i > -1) AM.added.splice(i,1); return hRun('deleteMeal',[raw.batch],'Undone',null,stay); }, stay);
}

/* the meats for the dinner chips; kcal are one adult portion */
const MEATS = [['Chicken',200],['Chicken thighs',230],['Beef mince',250],['Steak',300],['Pork',250],['Sausages',280],['Bacon',130],['Ham',60],['Meatballs',300],['Chicken nuggets',280],
    ['Salmon',250],['White fish',150],['Fish fingers',200],['Tuna',110],['Prawns',90],['Eggs',150],['Turkey',150],['Lamb',300],['Quorn',110],['Tofu',150],['Lentils',150],['Cheese',120]];

/* ---- drinks: their own box, and each tap adds one, so a day of teas is three taps ---- */
const DRINK_BASE = [['Coffee with milk',25],['Black coffee',5],['Latte (medium)',190],['Flat white',110],['Cappuccino (medium)',130],['Oat latte (medium)',150],['Tea with milk',20],['Water',0],['Squash (no added sugar)',10],['Can of Pepsi',140],['Can of Pepsi Max',1],
  ['Can of Coke',140],['Can of Diet Coke',1],['Fruit juice (glass)',90,1],['Glass of milk',120],
  ['Hot chocolate',150],['Milkshake',350],['Smoothie',150,1],['Fruit Shoot',10],['Energy drink (can)',115],['Pint of beer',215],['Glass of wine',160]];
let DR = null, DRLIST = [], DRHAD = [];
function drinkMenu(n){
  const seen = new Set(), out = [], push = f => { const k = f.name.toLowerCase(); if (seen.has(k)) return; seen.add(k); out.push(f); };
  topFoods(e=>e.person===n && (e.meal==='Drinks' || e.group==='Drink'), 8).forEach(f=>push({name:f.name, kcal:Math.round(f.one), veg:f.veg||0}));
  H.foods.filter(f=>f.group==='Drink' && (!f.person || f.person===n)).forEach(push);
  DRINK_BASE.forEach(([name, kcal, veg])=>push({name, kcal, veg:veg||0}));
  (H.base||[]).filter(f=>f.group==='Drink').forEach(push);
  return out;
}
function openDrinks(n){ DR = {who:n, q:''}; drawDrinks(); showSheet(); }
function drawDrinks(){
  const n = DR.who, q = DR.q.trim(), dayName = HD===today() ? 'today' : HD===addDays(today(),-1) ? 'yesterday' : dOf(HD).toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'short'});
  const counts = {}; H.meals.filter(e=>e.date===HD && e.person===n && e.meal==='Drinks').forEach(e=>{ const c = counts[e.food] || (counts[e.food] = {name:e.food, n:0, kcal:0, one:e.kcal, veg:e.veg||0, ids:[]}); c.n++; c.kcal += e.kcal; c.ids.push(e.id); });
  DRHAD = Object.values(counts); DRLIST = drinkMenu(n).filter(f=>!q || f.name.toLowerCase().includes(q.toLowerCase()));
  const had = name => (counts[name] || {n:0}).n;
  $('#sheet').innerHTML = `<div class="grab" id="drinksSheet"></div>
    <h3 style="margin:0 0 2px">${esc(n)}'s drinks, ${esc(dayName)}</h3>
    <div class="hint" style="margin:0 0 6px">Tap a drink each time ${esc(n)} has one.</div>
    ${DRHAD.length ? `<label class="f">Had so far</label><div class="list slot-list">${DRHAD.map((c,i)=>`<div class="item">
        <div class="mid"><div class="t">${esc(c.name)} <span class="muted">&times;${c.n}</span></div></div>
        <button class="icon-btn" aria-label="One less ${esc(c.name)}" onclick="drLess(${i})">&minus;</button>
        <button class="icon-btn" aria-label="One more ${esc(c.name)}" onclick="drMore(${i})">+</button></div>`).join('')}</div>` : ''}
    <input class="inp" id="drQ" placeholder="Find a drink, or type a new one" value="${esc(DR.q)}" autocomplete="off" style="margin-top:10px"
      oninput="DR.q=this.value;clearTimeout(window._dq);window._dq=setTimeout(()=>{drawDrinks();const i=$('#drQ');i.focus();i.setSelectionRange(i.value.length,i.value.length)},200)">
    ${q && !DRLIST.some(f=>f.name.toLowerCase()===q.toLowerCase()) ? `<button class="primary" onclick="drCustom()">Add &ldquo;${esc(q.charAt(0).toUpperCase()+q.slice(1))}&rdquo;</button>` : ''}
    <div class="drink-grid">${DRLIST.map((f,i)=>`<button class="drink ${had(f.name)?'on':''}" onclick="drAdd(${i})"><span class="t">${esc(f.name)}</span>${had(f.name)?'<span class="d">&times;'+had(f.name)+'</span>':''}</button>`).join('')}</div>
    ${!DRLIST.length && !q ? '<div class="empty">No drinks yet.</div>' : ''}
    <button class="primary" onclick="closeSheet()">Done</button>`;
}
function addDrink(name, kcal, veg){
  hRun('addMeals', [[{date:HD, person:DR.who, meal:'Drinks', food:name, kcal:Math.round(kcal), portion:1, veg:veg||0, group:'Drink'}], null],
    `${name} for ${DR.who}`, raw=>hRun('deleteMeal',[raw.batch],'Undone',null,{keep:true, redraw:drawDrinks}), {keep:true, redraw:drawDrinks});
}
function drAdd(i){ const f = DRLIST[i]; if (f) addDrink(f.name, f.kcal, f.veg); }
function drMore(i){ const c = DRHAD[i]; if (c) addDrink(c.name, c.one, c.veg); }
function drLess(i){ const c = DRHAD[i]; if (c) hRun('deleteMeal', [c.ids[c.ids.length-1]], 'One less ' + c.name, null, {keep:true, redraw:drawDrinks}); }
function drCustom(){ const q = DR.q.trim(); if (!q) return; DR.q = ''; addDrink(q.charAt(0).toUpperCase()+q.slice(1), 50, 0); }

/* ---- changing an entry: a draft in EM, one Save, and Undo puts the old values back ---- */
let EM = null;
function mealMates(e){   // everyone else who had the same thing, added together (same batch, same day, same meal)
  const b = e.id.indexOf('.') > -1 ? e.id.slice(0, e.id.indexOf('.')) : null;
  return b ? H.meals.filter(x=>x.id!==e.id && x.id.indexOf(b+'.')===0 && x.date===e.date && x.meal===e.meal && x.person!==e.person && x.food===e.food) : [];
}
function editMeal(id){
  const e = H.meals.find(x=>x.id===id); if (!e) return;
  const mates = mealMates(e);
  EM = {id, person:e.person, food:e.food, date:e.date, meal:e.meal, portion:e.portion||1, served:Math.round(e.served), eaten:e.eaten==null?1:e.eaten, note:(e.note||'').replace(ATE_RE, '$1').trim(), veg:e.veg||0, group:e.group||'Meal',
    mates:mates.map(x=>x.id), all:mates.length>0, diary:e.diary};
  EM.parts = partsFromNote(mealParts(e.food, EM.served), e.note, EM.eaten);
  drawEditMeal(); showSheet();
}
const PART_LV = [[1,'All','all the'],[0.75,'Most','most of the'],[0.5,'Half','half the'],[0.25,'A bit','a bit of the'],[0,'None','none of the']];
const ATE_RE = /(^|\.\s*)Ate (all|most|half|a bit|none)[^.]*\.?\s*$/;
function mealParts(food, served){
  const l = food.split(/\s*(?:\+|,|&|\band\b|\bwith\b)\s*/i).map(n=>n.trim()).filter(Boolean);
  return l.length < 2 ? [] : l.map(name=>({name, s:1/l.length, f:1}));
}
function partsFromNote(parts, note, eaten){
  parts.forEach(x=>{ const m = (note||'').toLowerCase().match(new RegExp('(all the|most of the|half the|a bit of the|none of the) ' + x.name.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![a-z])'));
    x.f = m ? PART_LV.find(l=>l[2]===m[1])[0] : eaten; });
  return parts;
}
const partsNote = parts => parts.every(x=>x.f===1) ? '' : 'Ate ' + parts.map(x=>PART_LV.find(l=>l[0]===x.f)[2] + ' ' + x.name.toLowerCase()).join(', ') + '.';
function emPart(i, v){ EM.parts[i].f = v; EM.eaten = Math.round(EM.parts.reduce((a,x)=>a+x.s*x.f,0)*100)/100; drawEditMeal(); }
function emPortion(p){ EM.served = Math.round((EM.served||0)/(EM.portion||1)*p); EM.portion = p; drawEditMeal(); }

      : eatenCtl(EM.eaten, 'emEat')}
    <label class="f">Comment</label>
    <input class="inp" id="emNote" value="${esc(EM.note)}" placeholder="e.g. only ate the chips" oninput="EM.note=this.value" autocomplete="off">
    <label class="f">Fruit &amp; veg portions</label>

      <b id="emVeg">${EM.veg}</b>

/* kg a day over the last 4 months, least squares, from 3 or more weigh-ins */
function weightTrend(n){
  const W = H.body.filter(b=>b.person===n && b.kg!=null && b.date>=addDays(today(),-120)); if (W.length < 3) return null;
  const t0 = dOf(W[0].date), xs = W.map(b=>(dOf(b.date)-t0)/864e5), mx = xs.reduce((a,x)=>a+x,0)/xs.length, my = W.reduce((a,b)=>a+b.kg,0)/W.length;
  const den = xs.reduce((a,x)=>a+(x-mx)*(x-mx),0); return den ? xs.reduce((a,x,i)=>a+(x-mx)*(W[i].kg-my),0)/den : null;
}

}

/* ---- takeaway days from the bank. A card payment posts the day after, so the meal was the day before
   (147 of 152 takeaway payments checked); PayPal rows carry their own day. ---- */
const normPlace = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const niceName = s => String(s||'').toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());
const jsA = v => esc(JSON.stringify(v));
function bankTakeaways(from, to){
  if (!D || !D.transactions) return [];
  return D.transactions.filter(t=>t.category==='Eating out & takeaway' && t.type==='spend' && t.amount <= -10)
    .map(t=>({date: /^PayPal/.test(t.note||'') ? t.date : addDays(t.date,-1), merchant:t.merchant, amount:-t.amount}))
    .filter(t=>t.date>=from && t.date<=to);
}
function placeMatch(f, merchant){ const a = normPlace(f.place), b = normPlace(merchant); return !!a && !!b && (b.includes(a) || a.includes(b)); }
function recentPlaces(){
  const c = {}; bankTakeaways(addDays(today(),-540), today()).forEach(t=>{ const k = niceName(t.merchant); c[k] = (c[k]||0)+1; });
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>x[0]);
}
const orderPortion = (f, n) => f.person ? 1 : usualPortion(n);
const orderKcal = (f, n) => Math.round(f.kcal*orderPortion(f, n));
function takeawayCard(d){
  const pays = bankTakeaways(d, d); if (!pays.length) return '';
  const had = H.meals.filter(e=>e.date===d && e.group==='Takeaway');
  return pays.map(p=>{
    const place = niceName(p.merchant), todo = EATERS.filter(n=>!had.some(e=>e.person===n));
    const picks = todo.map(n=>{ const o = lastOrder(n, p.merchant, d); return o ? [n, o] : null; }).filter(Boolean);
    return `<div class="due take" style="--due:var(--laura)"><b>&#x1F35F; Takeaway day: ${esc(place)} <span class="muted" style="font-weight:500">${gbp(p.amount)}</span></b>
      <span class="hint" style="margin:0">From the bank statement${had.length?'. Logged: '+esc(had.map(e=>e.person+', '+e.food).join(' · ')):''}.</span>
      ${picks.map(pk=>`<button class="secondary take-add" onclick="addOrders('${d}',${jsA([pk])})"><span>Add ${esc(pk[0])}'s last order: <b>${esc(pk[1].food)}</b></span></button>`).join('')}
      ${picks.length>1?`<button class="primary" onclick="addOrders('${d}',${jsA(picks)})">Add both</button>`:''}
      ${todo.length?`<button class="secondary" onclick="HD='${d}';openAddMeal(null,'Dinner')">Pick what we had</button>`:''}
    </div>`; }).join('');
}
/* what n had the last time we paid that place, else an order saved for it before */
function lastOrder(n, merchant, d){
  const k = normPlace(merchant), days = new Set(bankTakeaways(addDays(d,-730), addDays(d,-1)).filter(p=>normPlace(p.merchant).slice(0,10)===k.slice(0,10)).map(p=>p.date));
  const l = H.meals.filter(e=>e.person===n && e.group==='Takeaway' && days.has(e.date)).sort((a,b)=>a.date<b.date?1:-1), e = l[0];
  if (e){ const same = l.filter(x=>x.date===e.date && x.meal===e.meal); return {food:same.map(x=>x.food).join(', '), rows:same.map(x=>({food:x.food, kcal:Math.round(x.served||x.kcal), portion:x.portion||1, veg:x.veg||0, meal:x.meal}))}; }
  const f = H.foods.find(f=>placeMatch(f, merchant) && f.person===n) || H.foods.find(f=>placeMatch(f, merchant) && !f.person);
  return f ? {food:f.name, rows:[{food:f.name, kcal:orderKcal(f,n), portion:orderPortion(f,n), veg:f.veg||0, meal:f.slot||'Dinner'}]} : null;
}
function addOrders(d, pairs){   // pairs = [[person, lastOrder()]]
  const list = [].concat(...pairs.map(([n,o])=>o.rows.map(r=>({date:d, person:n, meal:r.meal, food:r.food, kcal:r.kcal, served:r.kcal, portion:r.portion, veg:r.veg, group:'Takeaway'}))));
  hRun('addMeals', [list, null], list.length>1 ? 'Added for both' : `Added ${list[0].person}'s ${list[0].food}`, raw=>hRun('deleteMeal',[raw.batch],'Undone'));
}

const P_KEY = 'ganymede-plans-v1';

function pExpand(raw){
  return {me:raw.me||'', syncedAt:raw.syncedAt, cal:raw.cal||null,
    items:(raw.items||[]).map(r=>({id:r[0], text:r[1], done:!!r[2], by:r[3], at:r[4], doneBy:r[5], doneAt:r[6]})),
    marks:(raw.marks||[]).map(r=>({id:r[0], date:r[1], what:r[2], note:r[3], by:r[4]})),
    events:raw.events ? raw.events.map(r=>({id:r[0], title:r[1], start:r[2], end:r[3], allDay:!!r[4], loc:r[5], note:r[6], cid:r[7], rec:!!r[8], calId:r[9]||'', calName:r[10]||'', color:r[11]||'', ro:!!r[12]})) : null};
}
function pSave(raw){ PRAW = raw; if (DEMO) return; try{ localStorage.setItem(P_KEY, JSON.stringify(raw)); }catch(e){} }
function takeP(raw){ if (!raw || !Array.isArray(raw.items)) return; if (raw.events === undefined && PRAW){ raw.events = PRAW.events; raw.cal = PRAW.cal; } pSave(raw); }
let pFresh = false;   // the refresh button: skip the server's 2-minute calendar copy
function pLoad(){ return pLoading || (pLoading = pLoadRun().finally(()=>{ pLoading = null; setSync(false); drawSync(); })); }
async function pLoadRun(){
  if (!PRAW && !DEMO){ try{ const c = JSON.parse(localStorage.getItem(P_KEY)); if (c && Array.isArray(c.items)) PRAW = c; }catch(e){} }
  if (!P && PRAW) showP();
  if (!canSend()){ if (!P && MODE==='plans') $('#app').innerHTML = masterHTML() + noData('pLoad()'); return; }
  setSync(true);
  const o = pFresh ? {fresh:true} : undefined; pFresh = false;
  try{ takeP(await inOrder('getPlans', o)); showP(); }
  catch(e){ if (e.auth) signIn(true);
    if (!P && MODE==='plans') $('#app').innerHTML = masterHTML() + (e.retry ? noData('pLoad()') : `<div class="loading">Couldn't load: ${esc(e.message||e)}<br><br><button class="secondary" onclick="pLoad()">Try again</button></div>`); }
}

  const p = pExpand(PRAW);
  OUTBOX.forEach(o=>{ if (o.k==='p' && PLOCAL[o.fn]) try{ PLOCAL[o.fn](p, ...o.args); }catch(e){} });
  return p;
}

  if (!PRAW) return;

const evEnd = e => { if (e.time) { const [h,m] = e.time.split(':').map(Number), t = h*60 + m + (Number(e.mins)||60), d = addDays(e.date, Math.floor(t/1440)), r = t % 1440;

const PLOCAL = {
  addNote(p, n){ if (!String(n.text||'').trim()) throw new Error('Type a note'); if (!p.items.some(x=>x.id===n.id)) p.items.push({id:n.id, text:String(n.text).trim(), done:false, by:p.me, at:nowStamp(), doneBy:'', doneAt:''}); },
  setNoteDone(p, id, on){ const x = p.items.find(x=>x.id===id); if (x){ x.done = !!on; x.doneBy = on ? p.me : ''; x.doneAt = on ? nowStamp() : ''; } },
  editNote(p, id, text){ if (!String(text||'').trim()) throw new Error('Type a note'); const x = p.items.find(x=>x.id===id); if (x) x.text = String(text).trim(); },
  deleteNote(p, id){ p.items = p.items.filter(x=>x.id!==id); },
  clearDone(p, ids){ p.items = p.items.filter(x=>!(x.done && ids.includes(x.id))); },

  deleteMark(p, id){ p.marks = p.marks.filter(x=>x.id!==id); },
  addEvent(p, e){ if (!String(e.title||'').trim()) throw new Error('Give it a name'); if (!e.date) throw new Error('Pick a date');
    if (p.events && !p.events.some(x=>x.cid===e.cid)) p.events.push(...evLocal(p, e, e.cid, '')); },
  updateEvent(p, k, e, scope){ if (!String(e.title||'').trim()) throw new Error('Give it a name'); if (!e.date) throw new Error('Pick a date');
    if (!p.events) return; const x = p.events.find(y=>evIs(y, k)); if (!x) return; if (x.ro) throw new Error('Change it in Google Calendar');
    if (!x.rec || scope==='one'){ const rows = evLocal(p, Object.assign({}, e, {rrule:x.rec ? '' : e.rrule||'', cal:x.rec ? x.calId : e.cal}), x.cid, x.id);
      if (x.rec) rows.forEach(r=>r.rec = true); p.events.splice(p.events.indexOf(x), 1, ...rows); return; }

function pRun(fn, args, msg, undo, keep){

    try{ PLOCAL[fn](p, ...args); }catch(e){ toast('\u26a0 ' + (e.message||e)); return false; }
    P = p; }
  if (!keep) closeSheet();
  outPush('p', fn, args, '');
  requestAnimationFrame(()=>{ if (MODE==='plans'){ const y = scrollY; render(); scrollTo(0,y); } });

}

const dayLabel = d => { const n = dayN(d) - dayN(today());
  if (n===0) return 'Today'; if (n===1) return 'Tomorrow'; if (n===-1) return 'Yesterday';
  const x = dOf(d), wd = x.toLocaleDateString('en-GB',{weekday:'short'});
  return n > 1 && n < 7 ? wd : wd + ' ' + x.getDate() + ' ' + shortMonth(d.slice(0,7)); };
const hhmm = s => { const [h,m] = s.slice(11,16).split(':').map(Number); return (h%12||12) + (m ? ':' + String(m).padStart(2,'0') : '') + (h<12?'am':'pm'); };
const evWhen = e => e.allDay ? (dayN(e.end)-dayN(e.start) > 1 ? 'All day, until ' + dayLabel(addDays(e.end,-1)) : 'All day') : hhmm(e.start) + ' to ' + (e.end.slice(0,10)===e.start.slice(0,10) ? hhmm(e.end) : dayLabel(e.end.slice(0,10)) + ' ' + hhmm(e.end));
/* still to come or happening now */
const evLive = e => e.allDay ? e.end > today() : e.end >= nowStamp();
const evDay = e => { const s = e.start.slice(0,10); return s < today() ? today() : s; };
function upcoming(days){
  if (!P.events) return [];
  const until = addDays(today(), days);
  return P.events.filter(e=>evLive(e) && e.start.slice(0,10) < until).sort((a,b)=>evDay(a)<evDay(b)?-1:evDay(a)>evDay(b)?1:(a.allDay===b.allDay ? (a.start<b.start?-1:1) : a.allDay?-1:1));

/* ---- marked days: runs of days close together are one time (a period of 5 days is one) ---- */
function markStats(){
  const by = {};
  P.marks.forEach(m=>{ if (m.what!==IRON && !CHORE_NAMES.has(m.what)) (by[m.what] = by[m.what] || []).push(m); });
  return Object.entries(by).map(([what, list])=>{
    list.sort((a,b)=>a.date<b.date?-1:1);
    const runs = []; list.forEach(m=>{ const r = runs[runs.length-1]; if (r && dayN(m.date) - dayN(r.last) <= 2){ r.last = m.date; r.n++; } else runs.push({start:m.date, last:m.date, n:1}); });
    const gaps = runs.slice(-7).map((r,i,a)=>i ? dayN(r.start)-dayN(a[i-1].start) : null).filter(x=>x!=null);
    const gap = gaps.length ? Math.round(gaps.reduce((a,x)=>a+x,0)/gaps.length) : null;
    const len = runs.some(r=>r.n>1) ? Math.round(runs.slice(-6).reduce((a,r)=>a+dayN(r.last)-dayN(r.start)+1,0)/Math.min(6,runs.length)) : null;
    const last = runs[runs.length-1], next = gap && runs.length >= 2 ? addDays(last.start, gap) : null;
    return {what, list, runs, gap, len, last, next, since:dayN(today())-dayN(list[list.length-1].date)};
  }).sort((a,b)=>a.list[a.list.length-1].date<b.list[b.list.length-1].date?1:-1);
}

function dots(s){
  const have = new Set(s.list.map(m=>m.date)), start = addDays(today(), -55);
  let h = ''; for (let i = 0; i < 56; i++){ const d = addDays(start, i); h += `<i class="${have.has(d)?'on':''} ${d===today()?'now':''} ${s.next===d?'next':''}"></i>`; }
  return `<div class="dots">${h}</div>`;
}
function markNow(){
  const what = ($('#tkW').value || TK.what).trim(), date = $('#tkD').value || today(), note = $('#tkN').value.trim();
  if (!what) return toast('Pick or type what happened');
  const m = {id:newId(), what, date, note};
  TK.what = what;
  pRun('addMark', [m], `Marked ${what}, ${dayLabel(date).toLowerCase()}`, ()=>pRun('deleteMark', [m.id], 'Taken off'));
}
function markToday(what){ const m = {id:newId(), what, date:today(), note:''};
  pRun('addMark', [m], `Marked ${what}, today`, ()=>pRun('deleteMark', [m.id], 'Taken off')); }
function openKind(what){
  const s = markStats().find(x=>x.what===what); if (!s) return;
  showSheet(`<h3>${esc(what)}</h3>
    <div class="hint" style="margin-top:0">${s.runs.length} time${s.runs.length>1?'s':''}${s.gap ? `, about every ${s.gap} days` : ''}${s.len ? `, lasting about ${s.len} days` : ''}.${s.next ? ` Next expected ${esc(niceDate(s.next))}.` : ''}</div>
    <button class="primary" onclick="pRun('addMark', [{id:newId(), what:${jsA(what)}, date:today(), note:''}], 'Marked today')">Mark today</button>
    <div class="card list" style="margin-top:14px">${s.list.slice().reverse().slice(0, 60).map(m=>`<div class="item"><div class="mid"><div class="t">${esc(niceDate(m.date))} ${esc(m.date.slice(0,4))}</div><div class="d">${esc(dayLabel(m.date))}${m.note ? ' &middot; ' + esc(m.note) : ''}${m.by ? ' &middot; ' + esc(m.by) : ''}</div></div>
      <button class="del" aria-label="Remove" onclick="pRun('deleteMark', ['${m.id}'], 'Removed', ()=>pRun('addMark', [${jsA({id:newId(), what:m.what, date:m.date, note:m.note})}], 'Put back', null, true), true); openKind(${jsA(what)})">&times;</button></div>`).join('')}</div>`);
}


/* ============ ui plumbing ============ */
function showSheet(html){ if (!sheetShown()){ SHEET_STACK = []; sheetKey = ''; } if(html) $('#sheet').innerHTML=html; $('#scrim').classList.add('show'); $('#sheet').classList.add('show'); guard(); }
function closeSheet(){ $('#scrim').classList.remove('show'); $('#sheet').classList.remove('show'); SHEET_STACK = []; sheetKey = ''; }
$('#scrim').onclick = closeSheet;
/* ============ going back, from anywhere ============
   Screens: every move is remembered in BACK; the arrow in the bottom bar, the phone's back button or gesture, and a swipe
   in from the left edge all step back. Pop-ups: a bar that stays at the top with Back (the pop-up before, if any) and a
   close button, and a swipe down closes. */
const SH = document.getElementById('sheet');
let BACK = [], SHEET_STACK = [], sheetKey = '', sheetRestoring = false, guardOn = false;
const sheetShown = () => SH.classList.contains('show');
const canBack = () => sheetShown() || BACK.length > 0;
function navPush(){ BACK.push({mode:MODE, view, hview, pview, HD, HM}); if (BACK.length > 40) BACK.shift(); guard(); }
function goBack(){
  if (sheetShown()){ SHEET_STACK.length ? sheetBack() : closeSheet(); return true; }
  const s = BACK.pop(); if (!s) return false;
  MODE = s.mode; try{ localStorage.setItem('ganymede-mode', MODE); }catch(e){}
  view = s.view; hview = s.hview; pview = s.pview || pview; HD = s.HD; HM = s.HM;
  if (MODE==='money' && !D){ setNav(); $('#app').innerHTML = masterHTML()+'<div class="loading">Loading your pots&hellip;</div>'; return true; }
  render(); if (MODE==='money'){ if (view==='spending') drawCharts(); if (view==='settings') settingsPreview(); }
  return true;
}
/* the phone's back: one spare history entry while there is somewhere to go back to */
const GHIST = (typeof google !== 'undefined' && google.script && google.script.history) ? google.script.history : null;
function guard(){ if (guardOn) return; guardOn = true; try{ GHIST ? GHIST.push({back:1}) : history.pushState({back:1}, ''); }catch(e){} }
function onPhoneBack(){ guardOn = false; if (goBack() && canBack()) guard(); }
try{ GHIST ? GHIST.setChangeHandler(onPhoneBack) : window.addEventListener('popstate', onPhoneBack); }catch(e){}

/* pop-ups: the bar goes back in after every redraw; a new pop-up opened from one is stacked so Back returns to it */
const sheetKeyOf = () => { const h = SH.querySelector('h3') || SH.querySelector('label.f'); return h ? h.textContent.trim().slice(0, 80) : ''; };
function sheetBarHTML(){
  return `<div class="sheet-bar" id="sheetBar"><button class="sb-back ${SHEET_STACK.length?'':'off'}" onclick="sheetBack()" aria-label="Back">&lsaquo; Back</button>
    <div class="grab"></div><button class="sb-x" onclick="closeSheet()" aria-label="Close">&times;</button></div>`;
}
let sheetHTML = '';
new MutationObserver(()=>{
  if (SH.firstElementChild && SH.firstElementChild.id === 'sheetBar') return;
  const k = sheetKeyOf(), html = SH.innerHTML;
  if (sheetRestoring) sheetRestoring = false;
  else if (sheetShown() && sheetKey && k && k !== sheetKey){
    const top = SHEET_STACK[SHEET_STACK.length-1];
    if (top && top.key === k) SHEET_STACK.pop(); else SHEET_STACK.push({key:sheetKey, html:sheetHTML});
  }
  if (k) sheetKey = k;
  sheetHTML = html;
  SH.insertAdjacentHTML('afterbegin', sheetBarHTML());
}).observe(SH, {childList:true});
function sheetBack(){
  const prev = SHEET_STACK.pop(); if (!prev) return closeSheet();
  sheetRestoring = true; sheetKey = prev.key; SH.innerHTML = prev.html; SH.scrollTop = 0;
}
/* swipe a pop-up down to close it (from the bar, or anywhere once it is scrolled to the top) */
let sY0 = null, sDY = 0;
SH.addEventListener('touchstart', e=>{ sY0 = (e.target.closest('.sheet-bar') || SH.scrollTop <= 0) ? e.touches[0].clientY : null; sDY = 0; }, {passive:true});
SH.addEventListener('touchmove', e=>{ if (sY0 == null) return; sDY = e.touches[0].clientY - sY0;
  if (sDY > 0 && SH.scrollTop <= 0){ SH.style.transition = 'none'; SH.style.transform = `translateY(${sDY}px)`; }
  else if (sDY < 0){ sY0 = null; SH.style.transition = ''; SH.style.transform = ''; } }, {passive:true});
SH.addEventListener('touchend', ()=>{ if (sY0 == null) return; SH.style.transition = ''; SH.style.transform = ''; if (sDY > 90) closeSheet(); sY0 = null; }, {passive:true});
/* swipe in from the left edge: back a screen */
let eX0 = null, eY0 = 0;
document.addEventListener('touchstart', e=>{ const t = e.touches[0]; eX0 = t.clientX < 28 && !sheetShown() ? t.clientX : null; eY0 = t.clientY; }, {passive:true});
document.addEventListener('touchend', e=>{ if (eX0 == null) return; const t = e.changedTouches[0]; if (t.clientX - eX0 > 80 && Math.abs(t.clientY - eY0) < 60) goBack(); eX0 = null; }, {passive:true});


let toastT;
function toast(msg, undo){
  $('#toastMsg').textContent=msg; const u=$('#toastUndo');
  u.classList.toggle('hidden',!undo); u.onclick=()=>{ $('#toast').classList.remove('show'); undo&&undo(); };
  $('#toast').classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>$('#toast').classList.remove('show'), undo?6000:3000);
}
function go(v){ if (v!==view || MODE!=='money') navPush(); if (MODE!=='money'){ MODE='money'; try{ localStorage.setItem('ganymede-mode','money'); }catch(e){} } if (!D) { view=v; return; }   // still loading: open this screen once the data arrives
  if (v==='history' || v==='topups'){ POTSUB=v; v='pots'; }
  if (v==='parents' && !canP()) v='home'; view=v; render(); if(v==='settings') settingsPreview(); if(v==='spending') drawCharts(); }
document.querySelector('nav').onclick = e => { const b = e.target.closest('button'); if (b && b.classList.contains('nav-back')) return goBack(); if (b) MODE==='health' ? hgo(b.dataset.view) : MODE==='plans' ? pgo(b.dataset.view) : go(b.dataset.view); };
document.addEventListener('visibilitychange',()=>{ if (!document.hidden) syncNow(); });

// Any error shows up on screen instead of failing silently
window.addEventListener('error', e => toast('\u26a0 ' + (e.message || 'Something went wrong')));
window.addEventListener('unhandledrejection', e => toast('\u26a0 ' + ((e.reason && e.reason.message) || e.reason || 'Something went wrong')));
if (MODE!=='money'){ setNav(); render(); }
flush(); load(); hLoad(); pLoad();   // both sides are fetched, so both work offline
/* once the first screen is up, build the other screens once in idle time, so the first tap on each is quick */
(function warm(){ const idle = window.requestIdleCallback || (f=>setTimeout(f,200));
  const off = html => { const d = document.createElement('div'); d.setAttribute('aria-hidden','true');
    d.style.cssText = 'position:absolute;left:-9999px;top:0;width:'+innerWidth+'px;visibility:hidden;pointer-events:none';
    d.innerHTML = html; document.body.appendChild(d); d.offsetHeight; d.remove(); };
  const jobs = [()=>D&&off(vSpending()), ()=>D&&off(vPayments()), ()=>D&&off(vHistory()), ()=>D&&off(vTopups()), ()=>H&&off(hStats()), ()=>H&&off(hMonth()), ()=>H&&off(hFoods())];
  let n = 0; const next = () => idle(dl=>{ if (!D || !H) { if (n++ < 60) return setTimeout(next, 1000); }
    while (jobs.length && (!dl || dl.timeRemaining() > 8)) try{ jobs.shift()(); }catch(e){}
    if (jobs.length) next(); });
  setTimeout(next, 1500); })();
if (REMOTE && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
