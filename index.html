<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<title>Ganymede</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Ganymede">
<meta name="robots" content="noindex, nofollow">

<style>
:root{
  --fs-small:13px;   /* the smallest text anywhere in the app */
  --r:14px; --r-sm:10px;   /* corner radius: cards, then controls */
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --font-num:"Space Grotesk",var(--font);
  --tom:#E67E22; --tom-t:#FDEBD0;
  --laura:#C0392B; --laura-t:#F8D7D3;
  --nathan:#27AE60; --nathan-t:#D4EFDF;
  --evy:#2E86C1; --evy-t:#D6EAF8;
  --family:#6A4CF5; --family-2:#7C5CFF;
  --bg:#F2F2EF; --card:#FFFFFF; --card-2:#F7F7F4; --text:#0E0E11; --muted:#62626C; --line:#E2E2DD;
  --hero:#0E0E13; --glow:rgba(124,92,255,.55);
  --pos:#1E8449; --neg:#C0392B; --shadow:none;
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme:dark; --bg:#08080A; --card:#121216; --card-2:#18181D; --text:#F3F3F5; --muted:#8E8E9A; --line:#24242B;
    --family:#7C5CFF; --family-2:#9B85FF; --hero:#101016; --glow:rgba(124,92,255,.45);
    --tom-t:#3A2A1A; --laura-t:#3A1F1C; --nathan-t:#1A3325; --evy-t:#1A2C3A; --pos:#58D68D; --neg:#F1948A; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,[onclick]{touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 14px}
header h1{font:700 22px/1.1 var(--font-num);margin:0;letter-spacing:-.5px}
.sync{font-size:var(--fs-small);color:var(--muted);margin-top:3px}
.sync .linkish{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer}
.icon-btn{border:1px solid var(--line);background:var(--card);width:38px;height:38px;border-radius:var(--r-sm);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:18px;height:18px}
.spin svg{animation:spin 1s linear infinite}
button.stat-row{font:inherit;color:inherit;padding-left:0;padding-right:0}
button.stat-row:active{background:var(--card-2)}
.stat-row.colhead{font-size:var(--fs-small);color:var(--muted);border-bottom:0;padding-bottom:0}
button.item.tap{width:100%;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.item .chev,.chev{color:var(--muted);font-size:18px;margin-left:2px}
button.tile{position:relative;border:1px solid var(--line);font:inherit;color:inherit;text-align:left;cursor:pointer}
.tchev{position:absolute;top:8px;right:10px;color:var(--muted);font-size:17px;line-height:1}
.hero-more{font-size:var(--fs-small);opacity:.75;margin-top:8px}
.hero.slim{padding:14px 18px}.hero.slim .big{font-size:32px;margin:4px 0 0}.hero.slim::after{top:14px;width:56px;height:56px}.hero.slim .breakdown{margin-top:10px}
.pay-top{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 2px;margin:0 -2px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}.sec-h h2{flex:1}
.sec-h .link{border:0;background:none;font:inherit;font-weight:600;font-size:var(--fs-small);color:var(--family-2);cursor:pointer;padding:18px 2px 0;white-space:nowrap}
.io-row{display:grid;grid-template-columns:1fr 1.15fr 1.15fr 1.15fr 12px;gap:6px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:right;padding:11px 0;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:600}
.io-row .k{text-align:left;font-weight:700}.io-row .k small{display:block;font-weight:500;color:var(--muted);font-size:var(--fs-small)}
.io-row.io-h{cursor:default;font-size:var(--fs-small);color:var(--muted);padding:0 0 4px;font-weight:600}
button.io-row:active{background:var(--card-2)}
.gov[role=button]{cursor:pointer}
.pot-head{display:flex;justify-content:space-between;align-items:center;border-left:3px solid var(--c);padding:2px 0 2px 10px;margin-bottom:6px}
.pot-head .k{display:block;font-size:var(--fs-small);color:var(--muted)}.pot-head b{font:700 22px var(--font-num)}
.pot-recent{margin-bottom:12px}
#work{position:fixed;top:0;left:0;right:0;height:3px;z-index:70;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none}
#work.on{opacity:1}
#work::before{content:"";position:absolute;top:0;bottom:0;width:35%;background:var(--family-2);animation:workbar 1.1s ease-in-out infinite}
@keyframes workbar{from{left:-35%}to{left:100%}}
#workPill{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.92);display:flex;align-items:center;gap:10px;background:#0E0E13;color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 18px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transition:opacity .15s,transform .15s;z-index:72;pointer-events:none}
#workPill.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#workPill::before{content:"";width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
#workVeil{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:71;opacity:0;transition:opacity .15s;pointer-events:none}
#workVeil.on{opacity:1;pointer-events:auto}
button:active{opacity:.7}
button.working{position:relative;opacity:.75}
button.working::after{content:"";position:absolute;right:10px;top:50%;width:13px;height:13px;margin-top:-7px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

.hero{position:relative;overflow:hidden;border-radius:var(--r);padding:20px;color:#fff;background:var(--hero);border:1px solid rgba(255,255,255,.08);cursor:pointer}
.hero::before{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.hero::after{content:"";position:absolute;right:14px;top:50px;width:84px;height:84px;border-radius:50%;box-shadow:inset -16px 10px 0 0 rgba(190,175,255,.42);transform:rotate(-18deg);pointer-events:none}
.hero>*{position:relative}
.hero .label{color:rgba(255,255,255,.62);font-size:var(--fs-small);font-weight:600;text-transform:uppercase;letter-spacing:.14em}
.hero .big{font:700 44px/1.05 var(--font-num);letter-spacing:-1.5px;margin:8px 0 14px}
.hero .row{display:flex;gap:22px;flex-wrap:wrap;font-size:var(--fs-small);color:rgba(255,255,255,.62)}
.hero .row b{display:block;font:600 17px var(--font-num);color:#fff;margin-top:2px}
.hero .breakdown{margin-top:16px;border-top:1px solid rgba(255,255,255,.14);padding-top:10px;display:none;font-size:14px}
.hero.open .breakdown{display:block}
.hero .breakdown div{display:flex;justify-content:space-between;padding:4px 0}

h2::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;box-shadow:inset -3px 1px 0 0 var(--family-2);margin-right:-2px}
h2{display:flex;align-items:center;gap:10px;font-size:var(--fs-small);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:26px 0 10px;font-weight:700}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pot{background:var(--card);border-radius:var(--r);padding:14px 14px 14px 17px;border:1px solid var(--line);cursor:pointer;position:relative;overflow:hidden;text-align:left;width:100%}
.pot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.pot:active{transform:scale(.98)}
.pot .name{display:flex;align-items:center;gap:8px;font-weight:600}
.avatar{width:26px;height:26px;border-radius:8px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.pot .bal{font:700 26px/1.1 var(--font-num);margin:12px 0 4px;letter-spacing:-.8px}
.pot .sub{font-size:var(--fs-small);color:var(--muted)}
.pot .bar{height:3px;background:var(--line);border-radius:3px;margin-top:12px;overflow:hidden}
.pot .bar i{display:block;height:100%;background:var(--c);border-radius:3px}

.card{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.stat-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.stat-row:last-child{border-bottom:0}
.stat-row .k{color:var(--muted)}
.stat-row .v{font-weight:600;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}


.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.item .dot{width:34px;height:34px;border-radius:var(--r-sm);background:var(--c);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.item .mid{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{font-size:var(--fs-small);color:var(--muted)}
.item .amt{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.item .del{border:0;background:transparent;color:var(--muted);padding:6px;cursor:pointer;border-radius:8px}
.item .del:hover{background:var(--line)}
.item .edit-i{color:var(--muted);font-size:15px;margin-left:-4px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.save-bar{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));margin:0 -18px;padding:2px 18px calc(12px + env(safe-area-inset-bottom));background:var(--card);z-index:1}
.save-bar .primary{margin-top:10px}
.back-link{border:0;background:none;color:var(--muted);font:inherit;font-size:var(--fs-small);padding:4px 0 8px;cursor:pointer}
.part{display:grid;grid-template-columns:1fr 84px auto;gap:6px;margin-top:6px;align-items:center}
.ff-total{padding:8px 2px;font-size:18px}.ff-total .muted{font-size:var(--fs-small)}
.opt{text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted)}
.link-btn{display:block;width:100%;border:1px dashed var(--line);background:none;color:var(--text);font:inherit;font-weight:600;padding:12px;border-radius:var(--r-sm);margin:10px 0 0;cursor:pointer}
.take-add{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left}
.due.take .secondary,.due.take .primary{margin-top:8px}
.stepper{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.stepper b{text-align:center;font-size:20px}
.slot-row{margin-top:14px}
.slot-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin:0 2px 6px}
.slot-both{border:0;background:none;color:var(--family-2);font:inherit;font-weight:600;font-size:var(--fs-small);padding:4px 0;cursor:pointer}
.slot-cells{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:78px;text-align:left;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:var(--r-sm);padding:9px 11px;cursor:pointer;min-width:0}
.slot .who{display:flex;justify-content:space-between;width:100%;font-size:var(--fs-small);color:var(--muted);font-weight:600}
.slot .f{font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:100%}
.slot .k{margin-top:auto;font-size:var(--fs-small);color:var(--muted);font-variant-numeric:tabular-nums}
.slot.free{border-style:dashed;border-left-style:solid;background:transparent}
.slot.free .add{margin:auto 0;color:var(--muted);font-weight:600}
.slot-list .item{gap:8px}
.eaten{margin:4px 0 2px}
.build-btn{display:flex;align-items:center;gap:12px;width:100%;margin:12px 0 2px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card-2);font:inherit;color:var(--text);text-align:left;cursor:pointer}
.build-btn>span:first-child{font-size:22px}.build-btn>span:nth-child(2){flex:1}.build-btn small{display:block;color:var(--muted);font-size:var(--fs-small)}
.menu-h{display:flex;align-items:flex-end;gap:8px;margin-top:4px}.menu-h label.f{flex:1}
.mini-seg{display:flex;background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px;margin-bottom:6px}
.mini-seg button{border:0;background:none;font:inherit;font-size:var(--fs-small);font-weight:600;color:var(--muted);padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.mini-seg button.on{background:var(--text);color:var(--bg)}
.am-added{background:var(--card-2);border-radius:var(--r-sm);padding:8px 12px;margin:0 0 10px;font-size:var(--fs-small);font-weight:600}
.build-sum{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding-top:10px}.build-sum b{line-height:1.3}.build-sum span{white-space:nowrap;color:var(--muted);font-size:var(--fs-small)}
.build-save{display:flex;gap:8px;align-items:center;font-size:var(--fs-small);color:var(--muted);margin-top:6px}
.quick-drink{border:1px dashed var(--line);background:none;font:inherit;font-size:var(--fs-small);font-weight:600;color:var(--text);border-radius:var(--r-sm);padding:7px 8px;margin-top:6px;cursor:pointer;width:100%;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-wrap{display:flex;flex-direction:column;min-width:0}.slot-wrap .slot{flex:1}
.am-opts{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;margin:10px 0 4px}
.am-opts summary{display:flex;justify-content:space-between;gap:8px;cursor:pointer;font-size:var(--fs-small);color:var(--muted);font-weight:600;list-style:none}
.am-opts summary::-webkit-details-marker{display:none}
.am-opts summary b{color:var(--text)}
.am-opts[open] summary{margin-bottom:8px}
.win-tap{display:flex;gap:inherit;align-items:flex-start;width:100%;border:0;background:none;font:inherit;color:inherit;text-align:left;padding:0;cursor:pointer}.win-tap .chev{margin-left:auto}
.month-chip{display:inline-block;margin-top:4px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--family-2)!important;font-weight:600}
.page-save{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));z-index:5;padding:6px 0;background:linear-gradient(transparent,var(--bg) 30%)}
.pot.sel{background:color-mix(in srgb,var(--c) 14%,var(--card))}
.eaten-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;margin:6px 2px 2px}
.eaten-h b{color:var(--family-2)}
.eat-range{width:100%;accent-color:var(--family-2);height:32px;margin:0}
.eatbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--card-2);margin:8px 0 6px}
.eatbar i{display:block;height:100%}
.eat-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:var(--fs-small);color:var(--muted);margin-bottom:6px}
.eat-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.slot.left{background:var(--laura-t)}
.d.note{font-style:italic}
.daynotes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.daynote{display:flex;flex-direction:column;gap:3px;text-align:left;font:inherit;font-size:var(--fs-small);color:var(--text);background:var(--card);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:var(--r-sm);padding:9px 11px;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.daynote .who{font-weight:600;color:var(--muted)}
.drink-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.drink{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;min-width:0}
.drink .t{font-weight:600;line-height:1.25}.drink .d{font-size:var(--fs-small);color:var(--muted)}
.drink.on{border-color:var(--family-2);box-shadow:inset 0 0 0 1px var(--family-2)}
.slot-list .plain{border:0;background:none;font:inherit;color:inherit;text-align:left;padding:0;cursor:pointer;flex:1;min-width:0}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.empty::before{content:"";display:block;width:26px;height:26px;margin:0 auto 10px;border-radius:50%;box-shadow:inset -7px 4px 0 0 var(--family-2);opacity:.7}
.month-h{font-size:var(--fs-small);font-weight:700;color:var(--muted);margin:18px 0 0;text-transform:uppercase;letter-spacing:.14em}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:7px 13px;font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--c,var(--text));border-color:var(--c,var(--text));color:var(--c-ink,var(--bg))}
.chip[style*="--c"].on{--c-ink:#fff}

nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:20;pointer-events:none}
nav .in{pointer-events:auto;display:flex;max-width:496px;width:100%;justify-content:space-around;padding:6px;border-radius:18px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:var(--fs-small);font-weight:600;color:var(--muted);padding:6px 8px;cursor:pointer;border-radius:12px;flex:1}
nav button svg{width:21px;height:21px}
nav button.on{color:var(--text);background:var(--card-2)}
nav button.on svg{color:var(--family-2)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,5,10,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;z-index:40;max-height:92vh;overflow:auto}
.sheet{visibility:hidden}.sheet.show{transform:none;visibility:visible}
.grab{width:36px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet>.grab,.sheet>div>.grab:not(.sheet-bar .grab){display:none}
.sheet-bar{position:sticky;top:-10px;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:-10px -18px 8px;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.sheet-bar .grab{margin:0}
.sb-back,.sb-x{border:0;background:none;color:var(--text);font:inherit;font-weight:600;cursor:pointer;padding:8px 10px;border-radius:10px}
.sb-back{justify-self:start}.sb-back.off{visibility:hidden}
.sb-x{justify-self:end;font-size:26px;line-height:1;padding:4px 12px;color:var(--muted)}
.sb-back:active,.sb-x:active{background:var(--card-2)}
nav .nav-back{flex:0 0 46px;color:var(--text);padding-left:2px;padding-right:2px}
nav .nav-back .nb-l{font-size:11px}
nav .nav-back svg{width:22px;height:22px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:3px;margin-bottom:16px}
.seg button{border:0;background:none;padding:9px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--text);color:var(--bg)}

<script>
/* ============ config ============ */
const PEOPLE = ['Tom','Laura','Nathan','Evy'];
const COLOR = {Tom:'var(--tom)',Laura:'var(--laura)',Nathan:'var(--nathan)',Evy:'var(--evy)'};
const TINT = {Tom:'var(--tom-t)',Laura:'var(--laura-t)',Nathan:'var(--nathan-t)',Evy:'var(--evy-t)'};
const GAS = !!(window.google && google.script && google.script.run);   // opened from the /exec link
/* REMOTE = the copy on ganymede.tompoon.com: it works offline and reaches the same server code through the Apps Script API */
const REMOTE = !GAS && (location.hostname.endsWith('tompoon.com') || new URLSearchParams(location.search).has('remote'));
const DEMO = !GAS && !REMOTE;
const GAPI = {client:'257581565054-jsnt1rb7sbuhslgi7o7m51kdrmtq3cgn.apps.googleusercontent.com', deploy:'AKfycbzD81kBCMZpe50KLmmNKpWIh8zu6Bqa-JjBeuLztvl-I8XPPQDa0J1aR_gjxpKrNJhnEA',
  scope:'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/script.external_request openid email'};

/* ============ helpers ============ */
const gbp = n => (n<0?'-':'') + '£' + Math.abs(Number(n)||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const gbpS = n => (n>0?'+':'') + gbp(n);
const pct = n => (Number(n)*100).toLocaleString('en-GB',{maximumFractionDigits:2}) + '%';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const thisMonth = () => today().slice(0,7);
const monthName = m => { if(!m) return ''; const [y,mo]=m.split('-').map(Number); return new Date(y,mo-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}); };
const niceDate = d => { if(!d) return ''; const [y,m,dd]=d.split('-').map(Number); return new Date(y,m-1,dd).toLocaleDateString('en-GB',{day:'numeric',month:'short'}); };
const $ = s => document.querySelector(s);

/* ============ backend ============ */
function api(fn, ...args){
  if (DEMO) return new Promise((res,rej)=>setTimeout(()=>{ if (window.DEMO_OFFLINE) return rej(netErr('Offline')); try{ res(JSON.parse(JSON.stringify(Mock[fn](...args)))) }catch(e){ rej(e) } }, 250));
  if (REMOTE) return remoteRun(fn, args);
  return new Promise((res,rej)=> google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(tagErr(e)))[fn](...args));

/* e.retry = the sheet could not be reached (no signal, signed out, Google busy): try again later, the change is kept */
function netErr(m){ const e = new Error(m); e.retry = true; return e; }
function tagErr(e){ const m = String(e && e.message || e); if (!navigator.onLine || /network|connection|HTTP 0|timed? ?out|Failed to fetch|lock/i.test(m)){ e = e instanceof Error ? e : new Error(m); e.retry = true; } return e; }
async function remoteRun(fn, args){
  if (!navigator.onLine) throw netErr('Offline');
  if (!authed()){ const e = netErr('Not signed in'); e.auth = true; throw e; }
  args = args.slice(); while (args.length && args[args.length-1] === undefined) args.pop();
  let r;
  try{ r = await fetch('https://script.googleapis.com/v1/scripts/' + GAPI.deploy + ':run', {method:'POST',
    headers:{Authorization:'Bearer ' + AUTH.token, 'Content-Type':'application/json'},
    body:JSON.stringify({function:fn, parameters:args.map(a=>a===undefined?null:a)})}); }
  catch(e){ throw netErr('No connection'); }
  const j = await r.json().catch(()=>({}));
  if (r.status === 401){ AUTH.exp = 0; authSave(); const e = netErr('Signed out'); e.auth = true; throw e; }
  // only an error thrown by our own code drops a change; anything else (setup, quota, Google down) keeps it for later
  const d = j.error && (j.error.details||[]).find(x=>x.errorMessage);
  if (d) throw tagErr(new Error(String(d.errorMessage).replace(/^Exception: /,'')));
  if (!r.ok || j.error) throw netErr((j.error && j.error.message) || ('Error ' + r.status));
  return j.response ? j.response.result : null;

/* reads wait behind any saves already on their way, so a reply never undoes a newer change */
function inOrder(fn, ...args){ const p = apiQ.then(()=>api(fn, ...args)); apiQ = p.catch(()=>{}); return p; }

/* ---- Google sign-in for REMOTE: a token in the page, renewed by a quick redirect when it runs out ---- */
const AUTH_KEY = 'ganymede-auth';
let AUTH = (()=>{ try{ return JSON.parse(localStorage.getItem(AUTH_KEY)) || {}; }catch(e){ return {}; } })();
function authSave(){ try{ localStorage.setItem(AUTH_KEY, JSON.stringify(AUTH)); }catch(e){} }
const authed = () => !REMOTE || (!!AUTH.token && AUTH.exp > Date.now() + 60000);
(function takeToken(){
  if (!REMOTE || location.hash.length < 2) return;
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('access_token')){ AUTH.token = h.get('access_token'); AUTH.exp = Date.now() + (Number(h.get('expires_in'))||3600)*1000; AUTH.err = ''; authSave();
    fetch('https://www.googleapis.com/oauth2/v3/userinfo', {headers:{Authorization:'Bearer ' + AUTH.token}}).then(r=>r.json()).then(u=>{ if (u.email){ AUTH.email = u.email; authSave(); } }).catch(()=>{}); }
  else if (h.get('error')){ AUTH.err = h.get('error'); authSave(); }
  else return;
  history.replaceState(null, '', location.pathname + location.search);

function signIn(quiet){
  if (!REMOTE) return false;
  if (quiet){
    if (authed() || !navigator.onLine || !AUTH.email || sheetShown()) return false;
    if (AUTH.tried && Date.now() - AUTH.tried < (AUTH.err ? 30 : 2) * 60000) return false;   // never loop

/* ============ offline: every change is saved on the phone at once and waits in an outbox, in order,
   until the sheet can take it. Each one is an action ("add this spend"), not a copy of the data, so
   changes made on two phones while offline both arrive. What is shown = the sheet's last copy with
   the outbox played over it. ============ */
const OUT_KEY = 'ganymede-outbox-v1';
let OUTBOX = DEMO ? [] : (()=>{ try{ return JSON.parse(localStorage.getItem(OUT_KEY)) || []; }catch(e){ return []; } })();
let syncErr = '', flushing = null, retryT = null;

async function flushRun(){
  const did = {m:false, h:false};
  while (OUTBOX.length && canSend()){

    if (OUTBOX.length > 1 && !noBatch){
      const sent = OUTBOX.slice(0, 20); let res, stop = false;
      try{ res = await queued('runBatch', [sent.map(o=>({fn:o.fn, args:o.args}))], false); syncErr = ''; }
      catch(e){
        if (e.retry){ syncErr = e.auth ? '' : (e.message || ''); if (e.auth) signIn(true); clearTimeout(retryT); retryT = setTimeout(syncNow, 30000); break; }
        noBatch = true; continue;
      }
      for (const r of res.out){
        const o = OUTBOX[0];
        if (r.retry){ syncErr = r.err || ''; clearTimeout(retryT); retryT = setTimeout(syncNow, 30000); stop = true; break; }
        OUTBOX.shift(); did[o.k] = true;
        if (!r.ok){ toast('\u26a0 ' + r.err + '. That change was not saved.'); continue; }
        if (o.k === 'm' && r.changed) takeChanged(r.changed);
        if (o.fn === 'importStatements') IMPORTED.push(r.summary || {});
        if (o.msg) toast(o.msg);

    if (fromTx) raw.txRows.forEach((r,i)=>{ if (r[9]===id){ r = rowW(raw, i); r[7]=''; r[8]=null; r[9]=''; } }); },
  setTxPot(raw, row, person, amount, nid, key){ const r = txFind(raw, row, key); if (r[3]==='parents') return;
    if (r[9]) MLOCAL.deleteEntry(raw, r[9]);
    r[7]=''; r[8]=null; r[9]='';
    if (person){ const a = r2(amount==null ? r[4] : Math.sign(r[4])*Math.abs(amount)), id = 'tx-'+nid;
      r[7]=person; r[8]=a; r[9]=id; raw.log.push({row:0, date:r[0], person, desc:r[1], amount:a, id}); potBump(raw, person, a); } },
  setCategory(raw, row, category, applyAll, key){ const t0 = txFind(raw, row, key);
    raw.txRows.forEach((r,i)=>{ if (r===t0 || (applyAll && r[1]===t0[1])){ if (r!==t0) r = rowW(raw, i); r[2]=category; r[3]=txType(category, r[4]); } }); },
  setParents(raw, row, on, key){ const r = txFind(raw, row, key);
    if (on){ r[2] = r[4]<0 ? 'Parents: bills paid' : 'Parents: money in'; r[3] = 'parents'; } else if (r[3]==='parents'){ r[2] = r[4]<0 ? 'Misc' : 'Gifts & other income'; r[3] = r[4]<0 ? 'spend' : 'income'; } },
  setChecked(raw, key, on){ raw.checked = (raw.checked||[]).filter(x=>x!==key); if (on) raw.checked.push(key); },
  setGoal(raw, person, goal, target){ raw.goals = raw.goals||{}; if (!goal || !(target>0)) delete raw.goals[person]; else raw.goals[person] = {goal, target:Number(target)}; },
  saveSettings(raw, v){ if (v.adultPct!==undefined) raw.adultPct = Number(v.adultPct);
    Object.keys(v.ages||{}).forEach(n=>{ const p = raw.pots.find(x=>x.name===n), a = v.ages[n]; if (p) p.age = a==='Adult'||a==='' ? 'Adult' : Number(a); }); },
  setBankBalances(raw, b){ const p = raw.parent; if (!p || p.current==null) return; const cur = Number(b.current), sav = Number(b.savings||0);
    bankBump(raw, r2(cur + sav - p.current - (p.savingsAcc||0))); p.current = cur; p.savingsAcc = sav; }
};
/* ids made on the phone (so a resend is not added twice) and the payment's date, amount and shop (so a
   change lands on the right payment even if rows have moved by the time it reaches the sheet) */
function prepM(fn, a){
  a = a.slice();
  if ((fn==='addEntry' || fn==='transfer') && a[0] && !a[0].id) a[0] = {...a[0], id:newId()};
  if (fn==='setTxPot'){ while (a.length < 5) a.push(null); a[3] = a[3] || newId(); a[4] = txKey(a[0]); }
  if (fn==='setCategory'){ a[2] = !!a[2]; a[3] = txKey(a[0]); }
  if (fn==='setParents') a[2] = txKey(a[0]);
  return a;
}
/* every change: shown at once, then sent when there is signal. Returns the args as sent (with their ids). */
function run(fn, args, msg, undo){
  args = prepM(fn, args || []);
  closeSheet();
  outPush('m', fn, args, MLOCAL[fn] ? '' : msg);
  showM();
  if (MLOCAL[fn]){ if (msg) toast(msg, undo); }
  else toast(canSend() ? 'Working on it\u2026' : 'Saved on this phone. It runs when there is signal.');
  return args;
}

/* Good news first: the best few things going right, scored so the biggest win leads */
function winsCard(){
  const tx = D.transactions||[]; if (!tx.length) return '';
  const W = [], cm = currentMonth(), full = lastFullMonths(24), X = txIndex();
  const mon = m => monthName(m).split(' ')[0];
  if (full.length){
    const lm = full[full.length-1], f = monthFlows(lm);
    if (f.profit > 0) W.push([60+Math.min(30,f.profit/100), '&#x1F4B7;', `We kept <b>${gbp(f.profit)}</b> from ${esc(mon(lm))}`]);
    let n = 0; for (let i=full.length-1; i>=0 && monthFlows(full[i]).profit>0; i--) n++;
    if (n >= 3) W.push([55+n*3, '&#x1F525;', `<b>${n} months in a row</b> in profit`]);
  }
  if (cm){
    const upto = cm.complete?null:cm.day, a = monthFlows(cm.m,upto).out;
    const best = [[shiftMonth(cm.m,-1),'last month'],[shiftMonth(cm.m,-12),'last year']].map(([m,l])=>({l, b:monthFlows(m,upto).out}))
      .filter(x=>x.b>0 && a<x.b*0.95 && x.b-a>=50).sort((x,y)=>(y.b-a)/y.b-(x.b-a)/x.b)[0];
    if (best) W.push([50+Math.min(25,(best.b-a)/best.b*100), '&#x1F44F;', `Spending in ${esc(mon(cm.m))}${upto?' so far':''} is <b>${Math.round((best.b-a)/best.b*100)}% lower</b> than ${upto?'the same point ':''}${best.l}`]);
    const ms = lastFullMonths(12);
    if (ms.length>=3 && (cm.complete || cm.day>=15)){
      const typ = {}, now = {}, frac = cm.complete ? 1 : cm.day/cm.days;
      tx.forEach(t=>{ if (!famSpend(t)) return; const m=t.date.slice(0,7); if (ms.includes(m)) typ[t.category]=(typ[t.category]||0)-t.amount/ms.length; else if (m===cm.m) now[t.category]=(now[t.category]||0)-t.amount; });
      const low = Object.entries(typ).filter(([c,v])=>v>=100 && c!=='Mortgage').map(([c,v])=>({c, exp:v*frac, v:now[c]||0}))
        .filter(x=>x.v<x.exp*0.7).sort((x,y)=>(y.exp-y.v)-(x.exp-x.v))[0];
      if (low) W.push([40, CAT_ICON[low.c]||'&#x2705;', `${esc(low.c)} is <b>${Math.round((1-low.v/low.exp)*100)}% below</b> a typical month`]);
    }
  }
  if (canP() && X.bal.length){   // only Tom's view knows the parents' share of the bank
    const h = heldAt(), b1 = X.bal[X.bal.length-1], b0 = X.bal.filter(b=>b.x<=addDays(b1.x,-365)).pop();
    if (b0){ const d = (b1.v+b1.s-h(b1.x))-(b0.v+b0.s-h(b0.x)); if (d>500) W.push([70+Math.min(20,d/1000), '&#x1F4C8;', `Our money is up <b>${gbp(d)}</b> on a year ago`]); }
  }
  D.pots.forEach(p=>{ const gl = goalLine(p); if (!gl) return;
    if (gl.pc>=100) W.push([85, '&#x1F389;', `${esc(p.name)} reached the goal: <b>${esc(gl.g.goal)}</b>`]);
    else if (gl.pc>=50) W.push([35+gl.pc/5, '&#x1F3AF;', `${esc(p.name)} is <b>${Math.round(gl.pc)}%</b> of the way to ${esc(gl.g.goal)}`]); });
  const p = projection();
  const lead = [];   // always first: last year's profit, then where the last 3 months are heading
  if (p && p.year>0) lead.push([0, '&#x1F4B0;', `<b>${gbpS(p.year)}</b> profit in the last 12 months`]);
  if (p && p.perMoRun>0) lead.push([0, '&#x1F680;', `On course for <b>${gbpS(p.perMoRun*12)}</b> over the next 12 months at the current rate`]);
  const kids = D.pots.filter(q=>q.name==='Nathan'||q.name==='Evy').reduce((a,q)=>a+Math.max(0,q.balance),0);
  if (kids>0) W.push([30, '&#x1F331;', `<b>${gbp(kids)}</b> put by for Nathan and Evy`]);
  const mort = tx.filter(t=>t.category==='Mortgage').map(t=>t.date).sort().pop();
  if (mort && daysBetween(mort,today())>45){ const mo = Math.floor(daysBetween(mort,today())/30.44), y = Math.floor(mo/12), r = mo%12;
    W.push([25, '&#x1F3E0;', `Mortgage-free for <b>${y?y+' year'+(y>1?'s':''):''}${y&&r?' and ':''}${r?r+' month'+(r>1?'s':''):''}</b>`]); }
  if (p && p.monthsCovered>=6) W.push([20, '&#x1F6E1;&#xFE0F;', `Savings would cover <b>${Math.floor(p.monthsCovered)} months</b> of spending`]);
  const top = lead.concat(W.sort((a,b)=>b[0]-a[0])).slice(0,3);
  if (!top.length) top.push([0, '&#x2728;', 'Every payment is tracked. Keep going.']);
  const hr = new Date().getHours(), greet = hr<12 ? 'Good morning' : hr<18 ? 'Good afternoon' : 'Good evening';
  return `<div class="wins"><div class="wins-h">${greet}<span>Here's what's going well</span></div>
    <ul>${top.map(w=>`<li><span class="wi">${w[1]}</span><span>${w[2]}</span></li>`).join('')}</ul></div>`;
}

/* Monthly nudge: from the 5th, ask for the next Santander export until the statement reaches the last few days
   of the month before (a quiet day or two at the end of a month should not keep it showing) */
function statementDue(){
  const tx = D.transactions||[]; if(!tx.length) return '';
  const last = tx.reduce((a,t)=>t.balance!=null&&t.date>a?t.date:a,''); if (!last) return '';
  const age = Math.floor((dOf(today())-dOf(last))/864e5);
  const prevEnd = dOf(today().slice(0,7)+'-01'); if (+today().slice(8) < 5) prevEnd.setMonth(prevEnd.getMonth()-1);
  prevEnd.setDate(prevEnd.getDate()-4);
  if (last > iso(prevEnd)) return '';
  // each export stops at 600 transactions, so ask for 4 months at a time; windows share a day, which the import removes
  const f = x => dOf(x).toLocaleDateString('en-GB'), wins = [];
  for (let a = last; a < today(); ){ const e = dOf(a); e.setMonth(e.getMonth()+4); const b = iso(e) < today() ? iso(e) : today(); wins.push([a,b]); a = b; }
  return `<div class="due"><b>Time for a new bank statement</b>
    <span class="hint" style="margin:0">The latest transaction is from ${dateY(last)}, ${age} days ago.</span>
    <ol><li>Santander online banking → View transactions → Download transactions</li>
      <li>Microsoft Excel (XLS), ${wins.length>1?wins.length+' exports:':'from'} ${wins.map(([a,b])=>`<b>${f(a)}</b> to <b>${f(b)}</b>`).join(', then ')}</li>
      <li>${canP()?'Upload it here: the app adds it, sorts it and pays the top-ups':'Ask Tom to upload it'}</li></ol>
    ${canP()?`<button class="primary" style="--c:var(--tom)" onclick="pickStatements()">Upload statement</button>`:''}</div>`;
}

  D.contrib.forEach(c=>PEOPLE.forEach((n,i)=>{ if(c.pots[i]) items.push({date:c.month+'-01',person:n,desc:'Monthly top-up',amount:c.pots[i],kind:'contrib'}); }));
  return items.sort((a,b)=> a.date===b.date ? (b.row||0)-(a.row||0) : (a.date<b.date?1:-1));
}

/* ---- pot top-ups come from each month's profit for the four of us, not from salary ---- */
function monthProfit(m){
  const r = {from:m+'-01', to:monthEnd(m)}, tx = D.transactions||[];
  const inc = total(tx.filter(t=>t.type==='income' && inRange(t,r)), 1);
  const out = total(tx.filter(t=>t.type==='spend' && inRange(t,r)), -1);
  return {inc, out, profit: inc-out};
}
function vTopups(){
  const X = txIndex(), cur = X.months[X.months.length-1];
  const now = cur ? monthProfit(cur) : {inc:0,out:0,profit:0}, would = Math.max(0, now.profit);
  const rows = D.contrib.slice().sort((a,b)=>a.month<b.month?1:-1);
  const owner = canP();
  return `
  <div class="card">
    <div class="split-total"><span>${cur?monthName(cur)+' so far':'This month'}</span><b class="${now.profit<0?'neg':''}">${gbpS(now.profit)}</b></div>
    <div class="stat-row" style="margin-top:6px"><span class="k">Money in</span><span class="v pos">${gbp(now.inc)}</span></div>

    <div class="hint">${now.profit<0?'A month that spends more than comes in tops up nothing. ':''}Paid once next month's transactions start coming in, so the whole month counts.</div>
    ${owner?`<button class="primary" onclick="run('applyProfitTopUps',[],'Top-ups updated from profit')">Update top-ups from profit</button><div class="hint">Uploading a statement does this by itself. Only needed after editing the sheet by hand.</div>`:''}
  </div>
  <h2>Past months</h2>
  <div class="card list">${rows.map(c=>{ const p = monthProfit(c.month), paid = c.pots.reduce((a,b)=>a+b,0), base = Math.max(0, Math.round(p.profit*100)/100);
    const stale = Math.abs((c.total||0) - base) > 0.005 && c.month < cur;
    return `<button class="item tap" style="--c:var(--family-2)" onclick="SP.period='${c.month}';go('spending')"><div class="dot">£</div>
      <div class="mid"><div class="t">${monthName(c.month)}</div><div class="d">Left over ${gbpS(p.profit)}${stale?' · not yet worked out from it':c.month>=cur?' · month still going':''}</div></div>
      <div class="amt pos">${gbpS(paid)}</div><span class="chev">›</span></button>`; }).join('') || '<div class="empty">No top-ups yet.</div>'}</div>
  <div class="hint">Left over (profit) is money in minus money spent. Each pot gets its % of it. Tap a month to see it.</div>`;
}

  'Tom salary':'💼','Laura salary':'💼','Freelance work':'💻','Unity Asset Store':'🎮','Epic Games (Fab)':'🎮','Sketchfab':'🎨','Cubebrush':'🎨','TurboSquid':'🎨','Yahaha':'🎮','Maternity pay (DWP)':'🏛️','Child Benefit':'🏛️','Tax refund (HMRC)':'🏛️','Tax-Free Childcare refund':'🏛️','Work expenses repaid':'🧾','Interest & cashback':'📈','Selling (Vinted)':'🏷️','Refunds':'↩️','Gifts & other income':'🎁'};
let SP = { period:'12m', q:'', allCats:false };
const BIG_ONE_OFF = 1000;   // only "On course for" (projection().perMoRun) leaves out single spends this big, and holidays
const subName = m => { const x=m.toLowerCase(); return x.includes('netflix')?'Netflix':x.includes('disney')?'Disney+':x.includes('google one')?'Google One':x.includes('google play')?'Google Play':x.includes('nordvpn')?'NordVPN':x.includes('bluelight')?'Blue Light Card':x.includes('steam')?'Steam':x.includes('openai')?'ChatGPT':x.includes('claude')?'Claude':x.includes('square enix')?'Square Enix':x.includes('blizzard')?'Blizzard':m; };

/* ---- dates ---- */
const dOf = s => { const [y,m,dd]=s.split('-').map(Number); return new Date(y,m-1,dd); };
const iso = x => x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const addDays = (s,n) => { const x=dOf(s); x.setDate(x.getDate()+n); return iso(x); };
const DAYN = new Map(), dayN = s => { let v = DAYN.get(s); if (v === undefined){ const [y,m,d] = s.split('-'); v = Math.round(Date.UTC(+y, m-1, +d)/864e5); DAYN.set(s, v); } return v; };
const daysBetween = (a,b) => dayN(b)-dayN(a)+1;
const monthEnd = m => { const x=dOf(m+'-01'); x.setMonth(x.getMonth()+1); x.setDate(0); return iso(x); };
const shortMonth = m => new Date(+m.slice(0,4),+m.slice(5)-1,1).toLocaleDateString('en-GB',{month:'short'}).slice(0,3);
const dateY = s => { if(!s) return ''; return dOf(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); };
const clampD = (s,lo,hi) => s<lo?lo:s>hi?hi:s;

/* ---- one pass over the transactions, redone only when they change ---- */
let TXC = null;
function txIndex(){
  const tx = D.transactions||[];
  if (TXC && TXC.src===tx) return TXC;
  const dates = tx.map(t=>t.date).sort();
  const bal = [];   // per day, in date order: v = current account at close, s = moved into Savings & ISA so far
  let sav = 0;
  tx.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.row-b.row).forEach(t=>{
    if (t.category==='Savings & ISA') sav = Math.max(0, sav - t.amount);
    if (t.balance==null) return;
    if (bal.length && bal[bal.length-1].x===t.date){ bal[bal.length-1].v=t.balance; bal[bal.length-1].s=sav; } else bal.push({x:t.date,v:t.balance,s:sav});
  });
  const months = [...new Set(dates.map(d=>d.slice(0,7)))].sort();
  const years = [...new Set(months.map(m=>m.slice(0,4)))].sort();
  const bankLast = bal.length ? bal[bal.length-1].x : dates[dates.length-1];   // PayPal rows can run ahead of the statement
  return TXC = { src:tx, first:dates[0], last:bankLast, bal, months, years };
}
function monthsList(){ return txIndex().months; }

/* ---- the selected period ---- */
function rangeFor(p){
  const X = txIndex(); if(!X.first) return null;
  let from=X.first, to=X.last, label, kind='all';
  if (p==='12m'){ const x=dOf(X.last.slice(0,7)+'-01'); x.setMonth(x.getMonth()-11); from=clampD(iso(x),X.first,X.last); label='Last 12 months ('+shortMonth(from.slice(0,7))+' '+from.slice(0,4)+' to '+shortMonth(X.last.slice(0,7))+' '+X.last.slice(0,4)+')'; kind='12m'; }
  else if (/^\d{4}$/.test(p)){ from=clampD(p+'-01-01',X.first,X.last); to=clampD(p+'-12-31',X.first,X.last); kind='year';
    label = p + (from>p+'-01-01'?' (from '+niceDate(from)+')':to<p+'-12-31'?' (to '+niceDate(to)+')':''); }
  else if (/^\d{4}-\d{2}$/.test(p)){ from=clampD(p+'-01',X.first,X.last); to=clampD(monthEnd(p),X.first,X.last); kind='month';
    label = monthName(p)+(to<monthEnd(p)?' (so far)':''); }
  else label = 'Since '+dateY(X.first);
  const days = Math.max(1, daysBetween(from,to));
  return {p,from,to,days,label,kind,months:days/30.44,weeks:days/7,single:kind==='month'};
}
function txRange(){ return rangeFor(SP.period) || null; }
/* the same length of time just before, for "vs before" figures */
function prevRange(r){
  const X = txIndex();
  if (r.kind==='all') return null;
  let from, to;
  if (r.kind==='month'){ const x=dOf(r.p+'-01'); x.setMonth(x.getMonth()-1); const m=iso(x).slice(0,7); from=m+'-01'; to=monthEnd(m); }
  else if (r.kind==='year'){ const y=String(+r.p-1); from=y+'-01-01'; to=y+'-12-31'; }
  else { to=addDays(r.from,-1); from=addDays(to,-(r.days-1)); }
  if (from < X.first) return null;
  const days = daysBetween(from,to);
  return {from,to,days,months:days/30.44,weeks:days/7,single:r.single,
    label: r.kind==='year'?String(+r.p-1): r.kind==='month'?shortMonth(from.slice(0,7)):'year before'};
}
function inRange(t,r){ return t.date>=r.from && t.date<=r.to; }
const isSpend = t => t.type==='spend';
const isIncome = t => t.type==='income';
function spendTx(r){ return (D.transactions||[]).filter(t=>isSpend(t) && inRange(t,r)); }
function incomeTx(r){ return (D.transactions||[]).filter(t=>isIncome(t) && inRange(t,r)); }
/* money held for Grandma & Grandad at the end of a day, from the Parent Savings ledger */
function heldAt(){
  const L = (D.parent && D.parent.ledger || []).slice().sort((a,b)=>a[0]<b[0]?-1:1), cum = []; let run = 0;
  L.forEach(([d,v])=>{ run += v; if (cum.length && cum[cum.length-1][0]===d) cum[cum.length-1][1]=run; else cum.push([d,run]); });
  return x => { let lo=0, hi=cum.length-1, ans=0; while(lo<=hi){ const m=(lo+hi)>>1; if(cum[m][0]<=x){ ans=cum[m][1]; lo=m+1; } else hi=m-1; } return ans; };
}
const total = (list, sign) => list.reduce((a,t)=>a+sign*t.amount,0);
function sumBy(list,key){ const m={}; list.forEach(t=>{ m[t[key]]=(m[t[key]]||0)+Math.abs(t.amount); }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
function catGroup(c){ const x=(D.categories||[]).find(k=>k.name===c); return x?x.group:(c==='Mortgage'?'Essentials':'Lifestyle'); }
const per = (v,r,unit) => r.single && unit==='mo' ? v : v/(unit==='wk'?r.weeks:r.months);
/* "▲ 12% vs 2025"; up is good for money in, bad for spending */
function delta(now, before, upIsGood, vsLabel){
  if (before==null || !isFinite(before) || Math.abs(before)<1) return '';
  const ch = (now-before)/Math.abs(before)*100; if (Math.abs(ch)<0.5) return `<span class="s">Same as ${esc(vsLabel)}</span>`;
  const good = (ch>0)===upIsGood, size = ch>=200 ? Math.round(now/before)+'×' : Math.abs(Math.round(ch))+'%';
  return `<span class="s ${good?'pos':'neg'}">${ch>0?'▲':'▼'} ${size} <span style="color:var(--muted)">vs ${esc(vsLabel)}</span></span>`;
}

/* ---- Payments: every bank and PayPal payment, newest first, searchable ---- */
let PAY = {q:'', kind:'all', n:100};
function payList(){
  const q = PAY.q.trim().toLowerCase(), words = q.split(/\s+/).filter(Boolean), num = q.replace(/[\u00a3,]/g,'');
  return (D.transactions||[]).filter(t=>{
    if (!canP() && t.type==='parents') return false;
    if (PAY.kind==='out' && !(t.amount<0)) return false;
    if (PAY.kind==='in' && !(t.amount>0)) return false;
    if (!words.length) return true;
    if (/^\d+(\.\d*)?$/.test(num) && Math.abs(t.amount).toFixed(2).indexOf(num)===0) return true;
    const hay = (t.merchant+' '+t.category+' '+(t.note||'')+' '+(t.pot||'')).toLowerCase();
    return words.every(w=>hay.includes(w));
  }).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.row-a.row);
}
function recentPayments(){
  const l = (D.transactions||[]).filter(t=>canP() || t.type!=='parents').slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.row-a.row).slice(0,30);
  if (!l.length) return '';
  return `<div class="sec-h"><h2>Recent payments</h2><button class="link" onclick="PAY.q='';PAY.kind='all';PAY.n=100;go('payments')">View all &rsaquo;</button></div>

/* Parents tab: the whole bank balance with their share underneath */
function drawParentChart(){
  const el = document.getElementById('parentChart'); if (!el) return;
  const X = txIndex(), h = heldAt(); if (!X.bal.length) return;
  const wk = {}; X.bal.forEach(p=>{ wk[Math.floor(dOf(p.x)/6048e5)] = p; });
  const pts = Object.values(wk).map(p=>{ const held = h(p.x); return {x:p.x, v:held, s:p.v+(p.s||0)-held}; });
  lineChart(el, pts, {color:'var(--bal)', color2:'var(--sav)', label1:"Grandma & Grandad's", label2:'whole bank'});
}

/* in / spent / left over, one row per year; each year as its average month */
function yearRows(){
  const X = txIndex();
  return X.years.map(y=>{ const r=rangeFor(y), inc=total(incomeTx(r),1), out=total(spendTx(r),-1);
    return {y, r, inc, out, incMo:inc/r.months, outMo:out/r.months, part:r.days<360}; });
}
function yearTable(){
  const rows = yearRows(), k = v => gbp(v).replace(/\.\d\d$/,'');
  return `<h2>Year by year</h2>
  <div class="card" style="padding:8px 12px"><table class="ytab"><thead><tr><th>Year</th><th>In /mo</th><th>Spent /mo</th><th>Saved</th></tr></thead><tbody>
  ${rows.slice().reverse().map(x=>`<tr onclick="SP.period='${x.y}';go('spending')"><td><b>${x.y}</b>${x.part?'<span class="part">part</span>':''}</td><td>${k(x.incMo)}</td><td>${k(x.outMo)}</td>
    <td class="${x.inc-x.out<0?'neg':'pos'}">${x.inc?Math.round((x.inc-x.out)/x.inc*100):0}%</td></tr>`).join('')}
  </tbody></table><div class="hint" style="margin:6px 2px 4px">Saved = money in minus spent, as a share of money in. Tap a year to open it.</div></div>`;
}

function drawCharts(){
  const el = document.getElementById('monthChart'); if(!el) return;
  const on = document.querySelector('#periodChips .chip.on'), row = on && on.parentNode;
  if (on) row.scrollLeft = Math.max(0, on.offsetLeft - row.offsetLeft - 16);   // keep the selected period in view
  const r = txRange(), X = txIndex();
  let data;
  if (r.kind==='all'){
    data = yearRows().map(x=>({label:x.y, a:x.incMo, b:x.outMo, key:x.y,
      title:x.y+(x.part?' ('+niceDate(x.r.from)+' to '+niceDate(x.r.to)+')':''), foot:'Average month · totals '+gbp(x.inc)+' in, '+gbp(x.out)+' spent'}));
  } else {
    let ms = X.months.filter(m=>m>=r.from.slice(0,7) && m<=r.to.slice(0,7));
    if (r.kind==='month') { const i=X.months.indexOf(r.p); ms = X.months.slice(Math.max(0,i-11), i+1); }
    data = ms.map(m=>{ const mr={from:m+'-01',to:monthEnd(m)};
      return {label:shortMonth(m), key:m, title:monthName(m), a:total(incomeTx(mr),1), b:total(spendTx(mr),-1)}; });
  }
  if (r.kind==='month') drawDayChart(r.p);
  barChart(el, data, {pair:true, hi:r.kind==='month'?data.findIndex(d=>d.key===r.p):-1,
    pick:k=>{ SP.period=k; go('spending'); }});
  const t = document.getElementById('monthTable');
  if (t) t.innerHTML = `<table class="ytab"><thead><tr><th></th><th>In</th><th>Spent</th><th>Left</th></tr></thead><tbody>${data.map(d=>`<tr><td>${esc(d.title)}</td><td>${gbp(d.a)}</td><td>${gbp(d.b)}</td><td class="${d.a-d.b<0?'neg':''}">${gbp(d.a-d.b)}</td></tr>`).join('')}</tbody></table>`;
  const bc = document.getElementById('balChart');
  if (bc){
    let pts = X.bal.filter(b=>b.x>=r.from && b.x<=r.to);
    const before = X.bal.filter(b=>b.x<r.from).pop(); if (before) pts.unshift({...before, x:r.from});
    if (pts.length>400){ const wk={}; pts.forEach(p=>{ wk[Math.floor(dOf(p.x)/6048e5)]=p; }); pts=Object.values(wk); }   // weekly for long ranges
    const h = heldAt(); pts = pts.map(p=>({x:p.x, v:p.v+(p.s||0)-h(p.x)})); lineChart(bc, pts, {color:'var(--bal)'});
  }
}

/* columns from one baseline; pair = in/spent side by side. opts.hi highlights one; opts.pick(key) on tap */
function barChart(el, data, opts){
  opts = opts||{};
  const pair = !!opts.pair, W=340, H=170, L=38, B=22, T=8, n=data.length||1;
  const max = Math.max(...data.map(d=>Math.max(d.a||0,d.b||0)),opts.line||0,1);
  const step = niceStep(max), top = Math.ceil(max/step)*step;
  const y = v => T+(H-T-B)*(1-v/top);
  const bw = (W-L)/n, gap = 2, barW = pair ? Math.max(3,Math.min(14,(bw-6)/2)) : Math.max(3,Math.min(22,bw-6));
  const every = opts.every || Math.ceil(n/12);   // at most ~12 x labels
  const money = opts.axis || (v => v>=1000 ? '£'+(v/1000).toLocaleString('en-GB',{maximumFractionDigits:1})+'k' : '£'+v), fmt = opts.fmt || gbp;
  let g='';
  for(let v=0; v<=top; v+=step) g+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end" font-size="12.5" fill="var(--muted)">${money(v)}</text>`;
  const bar = (x,v,c,dim) => { const h=y(0)-y(v), rr=Math.min(4,barW/2,h); if(h<=0) return '';
    return `<path d="M${x},${y(0)} V${y(v)+rr} Q${x},${y(v)} ${x+rr},${y(v)} H${x+barW-rr} Q${x+barW},${y(v)} ${x+barW},${y(v)+rr} V${y(0)} Z" fill="${c}"${dim?' opacity=".35"':''}/>`; };
  data.forEach((d,i)=>{
    const cx = L + bw*i + bw/2, dim = opts.hi>=0 && i!==opts.hi;
    if(pair){ g+=bar(cx-barW-gap/2, d.a||0, 'var(--inc)', dim); g+=bar(cx+gap/2, d.b||0, 'var(--spd)', dim); }
    else g+=bar(cx-barW/2, d.a||0, opts.color||'var(--catbar)', dim);
    if (i%every===0 || i===opts.hi) g+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="12.5" fill="${i===opts.hi?'var(--text)':'var(--muted)'}"${i===opts.hi?' font-weight="700"':''}>${esc(d.label)}</text>`;
    g+=`<rect x="${L+bw*i}" y="0" width="${bw}" height="${H}" fill="transparent" data-i="${i}" style="cursor:pointer"/>`;
  });
  if (opts.line) g+=`<line x1="${L}" x2="${W}" y1="${y(opts.line)}" y2="${y(opts.line)}" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".55" pointer-events="none"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">${g}</svg><div class="tip"></div>`;
  const tip = el.querySelector('.tip');
  const show = e => { const i=e.target.dataset.i; if(i===undefined) return; const d=data[i]; const bb=el.getBoundingClientRect(), rb=e.target.getBoundingClientRect();
    tip.innerHTML = `<b>${esc(d.title||d.label)}</b><br>` + (pair?`In <b>${gbp(d.a)}</b> · Spent <b>${gbp(d.b)}</b><br>Left ${gbp(d.a-d.b)}`:`<b>${fmt(d.a)}</b>`) + (d.foot?`<br><span style="opacity:.75">${esc(d.foot)}</span>`:'');
    const left = Math.min(Math.max(rb.left-bb.left+rb.width/2, 90), bb.width-90);
    tip.style.left=left+'px'; tip.style.top=(y(Math.max(d.a||0,d.b||0))/H*bb.height)+'px'; tip.style.opacity=1; };
  el.querySelectorAll('rect').forEach(rc=>{ rc.addEventListener('mouseenter',show);
    rc.addEventListener('click',e=>{ const d=data[e.target.dataset.i]; if(opts.pick && d && d.key) opts.pick(d.key); else show(e); }); });   // one tap opens that month
  el.addEventListener('mouseleave',()=>{ tip.style.opacity=0; tip.dataset.i=''; });
}

/* balance over time: 2px lines, 10% wash, crosshair + readout that snaps to the nearest day.
   With opts.color2, a second line sits above at v + s (Savings & ISA on top of the current account). */
function lineChart(el, pts, opts){
  if (pts.length<2){ el.innerHTML=''; return; }
  const two = !!opts.color2 && pts.some(p=>p.s>0), top = p => p.v + (two ? (p.s||0) : 0);
  const W=340, H=150, L=40, B=20, T=10, R=6;
  const t0=dOf(pts[0].x).getTime(), t1=dOf(pts[pts.length-1].x).getTime(), span=Math.max(1,t1-t0);
  let lo=Math.min(0,...pts.map(p=>p.v)), hi=Math.max(...pts.map(top),1);
  if (opts.zero===false){ lo=Math.min(...pts.map(p=>p.v)); hi=Math.max(...pts.map(p=>p.v)); const pad=Math.max((hi-lo)*0.15,1); lo-=pad; hi+=pad; }
  const step=niceStep(hi-lo), yMin=Math.floor(lo/step)*step, yMax=Math.ceil(hi/step)*step;
  const x = p => L+(W-L-R)*(dOf(p.x).getTime()-t0)/span, y = v => T+(H-T-B)*(1-(v-yMin)/(yMax-yMin||1));
  const money = opts.axis || (v => Math.abs(v)>=1000 ? (v<0?'-':'')+'£'+(Math.abs(v)/1000).toLocaleString('en-GB',{maximumFractionDigits:1})+'k' : '£'+v), fmt = opts.fmt || gbp;
  let g='';
  for(let v=yMin; v<=yMax+1e-6; v+=step) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end" font-size="12.5" fill="var(--muted)">${money(v)}</text>`;
  const years = span > 400*864e5;   // long range: label years, else months
  const seen = new Set(); let lastX = -1e9;
  pts.forEach(p=>{ const k = years ? p.x.slice(0,4) : p.x.slice(0,7); if(seen.has(k)) return; seen.add(k);
    const lab = years ? k : shortMonth(k), xx = x({x:years?k+'-01-01':k+'-01'});   // label sits on the 1st of its month / year
    if (xx < L+10 || xx > W-R-10 || xx-lastX < 27) return; lastX = xx;
    g+=`<text x="${xx}" y="${H-5}" text-anchor="middle" font-size="12.5" fill="var(--muted)">${esc(lab)}</text>`; });
  const path = f => pts.map((p,i)=>(i?'L':'M')+x(p).toFixed(1)+','+y(f(p)).toFixed(1)).join('');

/* ============ insights: comparisons, projections, pace, bills, trends, goals ============ */
const famIncome = t => t.type==='income';

/* money in / spent / profit for the four of us between two dates (inclusive) */
function flows(from, to){
  let inc=0, out=0; (D.transactions||[]).forEach(t=>{ if (t.date<from || t.date>to) return; if (famIncome(t)) inc+=t.amount; else if (famSpend(t)) out-=t.amount; });

const shiftMonth = (m,k) => { const x=dOf(m+'-01'); x.setMonth(x.getMonth()+k); return iso(x).slice(0,7); };
const dayOf = s => +s.slice(8,10);
/* the month being imported: the newest month in the data, and how far into it the data goes */
function currentMonth(){ const X=txIndex(); if(!X.last) return null; const m=X.last.slice(0,7); return {m, day:dayOf(X.last), days:dayOf(monthEnd(m)), complete: X.last===monthEnd(m)}; }
/* a month, or the same days of it if the month is still coming in, so comparisons are like for like */

/* ---- comparisons: this month against last month and the same month last year ---- */
function compareCard(m){
  const cm = currentMonth(); if (!cm) return '';
  const partial = m===cm.m && !cm.complete, upto = partial ? cm.day : null;
  const a = monthFlows(m, upto), b = monthFlows(shiftMonth(m,-1), upto), c = monthFlows(shiftMonth(m,-12), upto);
  const hasC = c.inc || c.out;
  const pc = (now, was, upGood) => { if (!was) return '<td class="muted">–</td>'; const ch=(now-was)/Math.abs(was)*100; const good=(ch>0)===upGood;
    return `<td class="${Math.abs(ch)<1?'':good?'pos':'neg'}">${Math.abs(ch)<1?'same':(ch>0?'▲ ':'▼ ')+Math.abs(Math.round(ch))+'%'}</td>`; };
  const diff = (now, was) => { const dd = now-was; return `<td class="${Math.abs(dd)<1?'':dd>0?'pos':'neg'}">${Math.abs(dd)<1?'same':gbpS(Math.round(dd)).replace('.00','')}</td>`; };
  const row = (k, now, bb, cc, f) => `<tr onclick="SP.period='${m}';go('spending')" style="cursor:pointer"><td>${k}</td><td>${gbp(now)}</td>${f(now,bb)}${hasC?f(now,cc):''}</tr>`;
  return `<h2>Compared with</h2>

    ${partial ? '' : row('Money in', a.inc, b.inc, c.inc, (x,y)=>pc(x,y,true))}

  </tbody></table><div class="hint" style="margin:6px 2px 4px">${partial ? `Spending up to day ${cm.day} of each month, like for like. Money in and profit compare once the month is complete, since paydays fall on different days.` : 'Profit shows the change in pounds.'}</div></div>`;
}

/* ---- projections: the last 12 complete months, carried on ---- */
function projection(){
  const ms = lastFullMonths(12); if (ms.length < 3) return null;

  const perMo = f.profit/n, spendMo = f.out/n, incMo = f.inc/n;
  // the current rate: the last 6 complete months, leaving out holidays and one-offs, so one trip does not swing it
  const last6 = lastFullMonths(6), from6 = last6[0]+'-01', to6 = monthEnd(last6[last6.length-1]);
  const oneOff = t => famSpend(t) && t.date>=from6 && t.date<=to6 && t.category!=='Mortgage' && (t.category==='Holidays & travel' || -t.amount>=BIG_ONE_OFF);
  const perMoRun = (flows(from6, to6).profit + (D.transactions||[]).filter(oneOff).reduce((a,t)=>a-t.amount,0)) / last6.length;
  const potPct = D.pots.reduce((a,p)=>a+p.pct,0), topUpsYr = D.pots.reduce((a,p)=>a+Math.max(0,perMo)*p.pct*12,0);

    savingsIn12: (o.ourSavings||0) + perMo*12, familyIn12: (o.familyPot||0) + perMo*12 - topUpsYr, monthsCovered: spendMo>0 ? (o.ourSavings||0)/spendMo : 0};
}

  return `<h2>If the next year matches the last</h2>
  <div class="card">
    <div class="split-total"><span>Profit in the last ${p.n} complete months</span><b class="${p.year<0?'neg':'pos'}">${gbpS(p.year)}</b></div>
    <div class="hint" style="margin:2px 0 8px">${gbpS(p.perMo)} a month on average (${Math.round(p.rate*100)}% of money in). The last ${p.runN} months ran ${tWord} that, at ${gbpS(p.perMoRun)} a month, leaving out holidays and one-offs of £1,000 or more.</div>
    <div class="stat-row"><span class="k">Our savings would be</span><span class="v">${gbp(p.savingsIn12)}</span></div>
    <div class="stat-row"><span class="k">Into the pots</span><span class="v pos">+${gbp(p.topUpsYr)}</span></div>
    <div class="stat-row"><span class="k">Family pot would be</span><span class="v">${gbp(p.familyIn12)}</span></div>
    <div class="stat-row"><span class="k">Savings would cover</span><span class="v">${p.monthsCovered.toFixed(1)} months of spending</span></div>
    <div class="hint">The same again for another 12 months. It does not know about holidays or big one-offs to come.</div>
  </div>`;
}

/* ---- pace: categories running well above a typical month ---- */
function paceAlerts(){
  const cm = currentMonth(); if (!cm) return [];
  const ms = lastFullMonths(12); if (ms.length < 3) return [];
  const typical = {}; (D.transactions||[]).forEach(t=>{ if (famSpend(t) && ms.includes(t.date.slice(0,7))) typical[t.category]=(typical[t.category]||0)-t.amount; });
  Object.keys(typical).forEach(k=>typical[k]/=ms.length);
  const now = {}; (D.transactions||[]).forEach(t=>{ if (famSpend(t) && t.date.slice(0,7)===cm.m) now[t.category]=(now[t.category]||0)-t.amount; });
  const frac = cm.complete ? 1 : cm.day/cm.days;
  return Object.entries(now).map(([c,v])=>{ const exp=(typical[c]||0)*frac; return {c, v, exp, ch: exp? (v-exp)/exp : null}; })
    .filter(a=> a.exp>0 ? (a.v>a.exp*1.4 && a.v-a.exp>30) : a.v>100).sort((a,b)=>(b.v-b.exp)-(a.v-a.exp)).slice(0,4);

function paceCard(){

/* ---- worth checking: payments that might be a billing error ---- */
const normM = m => String(m||'').toUpperCase().split(/[^A-Z0-9]+/).filter(w=>w && !/^(COM|WWW|LTD|UK|GB|CO)$/.test(w)).sort().join(' ');
let CHK = null;
function checks(){
  const tx = D.transactions||[], X = txIndex(); if (!X.last) return [];
  if (CHK && CHK.src===tx) return CHK.list;
  const gapD = (a,b) => daysBetween(a,b)-1, from = addDays(X.last, -1100), out = [];
  const med = a => { const s=a.slice().sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
  const byDate = (a,b) => a.date<b.date?-1:a.date>b.date?1:a.row-b.row;
  const pay = tx.filter(t=>(t.type==='spend'||t.type==='parents') && t.amount<0 && !/^(Cash|Mortgage)$/.test(t.category));
  const by = {}; pay.forEach(t=>{ const k=normM(t.merchant); if (k) (by[k]||(by[k]=[])).push(t); });
  const refunded = (k, amt, d) => tx.some(r=>r.amount>0 && Math.abs(r.amount-amt)<0.005 && normM(r.merchant)===k && r.date>=d && gapD(d,r.date)<=75);
  const name = t => subName(t.merchant);
  Object.entries(by).forEach(([k, l])=>{
    l.sort(byDate);

    const used = new Set(), pairs = {};
    for (let i=0;i<l.length;i++){ if (used.has(l[i])) continue;
      for (let j=i+1;j<l.length && gapD(l[i].date,l[j].date)<=3;j++){
        const a=l[i], b=l[j]; if (used.has(b) || -a.amount<20 || Math.abs(a.amount-b.amount)>=0.005) continue;
        if (!refunded(k, -a.amount, b.date)) { used.add(a); used.add(b); (pairs[-a.amount]||(pairs[-a.amount]=[])).push([a,b]); }
        break; } }
    Object.entries(pairs).forEach(([amt, ps])=>{ amt = Number(amt); if (ps[ps.length-1][1].date < from) return;
      const d1 = ps[0][0].date, d2 = ps[0][1].date, n = ps.length;
      out.push({kind:'dup', key:'dup|'+k+'|'+amt.toFixed(2)+'|'+d1, date:ps[n-1][1].date, amt, list:ps.flat(),
        title: name(ps[0][0])+' took '+gbp(amt)+' twice',
        sub: n>1 ? n+' times, '+dateY(d1)+' to '+dateY(ps[n-1][1].date) : d1===d2 ? 'Both on '+dateY(d1) : dateY(d1)+' and '+dateY(d2),
        why: (n>1 ? 'Two payments of the same amount on the same few days, '+n+' times. Fine if it is two of something (two policies, two tickets). ' : 'Two payments of the same amount within a few days. Fine if it was two of something. ')+'No refund of '+gbp(amt)+' has come back.'});
    });

    cl.forEach(c=>{ if (c.l.length < 3 || -c.base < 5) return;
      const s = c.l.sort(byDate), days = [...new Set(s.map(t=>t.date))]; if (days.length < 3) return;
      const gaps = days.slice(1).map((d,i)=>gapD(days[i],d)), g = med(gaps), steady = gaps.filter(x=>Math.abs(x-g)<=Math.max(5,g*0.1)).length/gaps.length;
      const near = l.filter(t=>Math.abs(t.amount-c.base)<=-c.base*0.2).length, yearly = g>=330 && g<=400 && near<=c.l.length+1, monthly = g>=26 && g<=35 && steady>=0.7;
      days.slice(1).forEach((d,i)=>{ const p = days[i], x = gaps[i]; if (d < from) return;

          if (refunded(k, amt, d)) return;
          out.push({kind:'twice', key:'twice|'+k+'|'+d, date:d, amt, list:both,
            title: name(both[0])+' paid twice in one '+(yearly?'year':'month'),
            sub: dateY(p)+' and '+dateY(d)+', '+x+' days apart',

/* ---- bills and subscriptions: anything that comes out on a regular cycle ---- */
function recurring(){
  const X = txIndex(); if (!X.last) return [];
  const since = addDays(X.last, -400), g = {};
  (D.transactions||[]).forEach(t=>{ if (t.type==='spend' && t.date>=since && t.category!=='Mortgage') (g[t.merchant]||(g[t.merchant]=[])).push(t); });
  const med = a => { const s=a.slice().sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
  const out = [];
  Object.entries(g).forEach(([m, list])=>{
    list.sort((a,b)=>a.date<b.date?-1:1);
    const days = [...new Set(list.map(t=>t.date))]; if (days.length < 3) return;
    const gaps = days.slice(1).map((d,i)=>daysBetween(days[i],d)-1), gap = med(gaps);
    const cycle = gap>=6&&gap<=8 ? ['weekly',52/12] : gap>=26&&gap<=35 ? ['monthly',1] : gap>=85&&gap<=95 ? ['quarterly',1/3] : null;
    if (!cycle) return;
    const steady = gaps.filter(x=>Math.abs(x-gap)<=Math.max(4,gap*0.25)).length/gaps.length; if (steady < 0.7) return;
    const lastD = days[days.length-1]; if (daysBetween(lastD, X.last) > gap*1.8+3) return;   // stopped
    const amt = -med(list.slice(-3).map(t=>t.amount));
    const yearAgo = list.filter(t=>daysBetween(t.date, lastD) >= 330 && daysBetween(t.date, lastD) <= 400);
    const was = yearAgo.length ? -med(yearAgo.map(t=>t.amount)) : null;
    out.push({m, cat:list[list.length-1].category, cycle:cycle[0], amt, monthly: amt*cycle[1], next: addDays(lastD, Math.round(gap)), last:list[list.length-1],
      rise: was && amt-was>=1 && (amt-was)/was>=0.05 ? (amt-was)/was : null});
  });
  return out.sort((a,b)=>b.monthly-a.monthly);
}
function billsCard(){
  const r = recurring(); if (!r.length) return '';

}

/* ---- category trends: each category's average month, year by year ---- */
function trendsCard(){
  const X = txIndex(); if (X.years.length < 2) return '';
  const yr = X.years.map(y=>({y, r:rangeFor(y)})), by = {};
  (D.transactions||[]).forEach(t=>{ if (!famSpend(t)) return; const y=t.date.slice(0,4); (by[t.category]||(by[t.category]={}))[y]=((by[t.category]||{})[y]||0)-t.amount; });
  const cats = Object.entries(by).filter(([c])=>c!=='Misc').map(([c,v])=>[c, Object.values(v).reduce((a,x)=>a+x,0)]).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]);
  const mini = vals => { const mx=Math.max(...vals,1), w=6, gap=8; return `<svg class="mini-bars" viewBox="0 0 ${vals.length*(w+gap)} 28" preserveAspectRatio="none" aria-hidden="true">${vals.map((v,i)=>{ const h=Math.max(1,v/mx*26); return `<rect x="${i*(w+gap)}" y="${28-h}" width="${w}" height="${h}" rx="2" fill="${i===vals.length-1?'var(--catbar)':'color-mix(in srgb,var(--catbar) 40%,transparent)'}"/>`; }).join('')}</svg>`; };
  return `<h2>Category trends</h2><div class="card">${cats.map(c=>{ const vals=yr.map(({y,r})=>(by[c][y]||0)/r.months), first=vals.find((v,i)=>v>0 && yr[i].r.days>=360)||vals.find(v=>v>0)||0, lastV=vals[vals.length-1];
    const ch = first ? (lastV-first)/first : null;
    return `<button class="trend" onclick="openCat('${esc(c)}')"><span class="k">${CAT_ICON[c]||''} ${esc(c)}</span>${mini(vals)}<span class="v">${gbp(lastV).replace(/\.\d\d$/,'')}/mo${ch!=null&&Math.abs(ch)>=0.05?` <small class="${ch>0?'neg':'pos'}">${ch>0?'▲':'▼'} ${ch>=2?Math.round(lastV/first)+'×':Math.abs(Math.round(ch*100))+'%'}</small>`:''}</span></button>`; }).join('')}
    <div class="hint">Average month in each year, ${esc(X.years[0])} to ${esc(X.years[X.years.length-1])}; the change is against the first full year.</div></div>`;
}

/* ---- the month you tapped: day by day ---- */
function drawDayChart(m){
  const el = document.getElementById('dayChart'); if (!el) return;
  const days = dayOf(monthEnd(m)), per = Array(days).fill(0);
  (D.transactions||[]).forEach(t=>{ if (famSpend(t) && t.date.slice(0,7)===m) per[dayOf(t.date)-1]-=t.amount; });
  barChart(el, per.map((v,i)=>({label: String(i+1), title: dOf(m+'-'+String(i+1).padStart(2,'0')).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}), a:v})), {every:7});   // days 1, 8, 15, 22, 29
}

/* ---- pot goals ---- */
function potRate(name){   // average monthly change over the last 3 months: top-ups, adds and spends
  const i = PEOPLE.indexOf(name), cutoff = shiftMonth(thisMonth(), -3);
  const top = D.contrib.filter(c=>c.month>=cutoff).reduce((a,c)=>a+(c.pots[i]||0),0);
  const log = D.log.filter(e=>e.person===name && e.date.slice(0,7)>=cutoff).reduce((a,e)=>a+e.amount,0);
  return (top+log)/3;
}
function goalLine(p){
  const g = (D.goals||{})[p.name]; if (!g) return null;
  const left = g.target - p.balance, rate = potRate(p.name);
  const eta = left<=0 ? 'reached 🎉' : rate>0 ? '~'+Math.ceil(left/rate)+' month'+(Math.ceil(left/rate)>1?'s':'')+' to go' : 'no progress lately';
  return {g, pc: Math.max(0,Math.min(100,p.balance/g.target*100)), eta};
}
function goalEditor(){
  const g = (D.goals||{})[S.person] || {goal:'', target:''};
  return `<details class="goal-edit"${g.goal?'':''}><summary>${g.goal?`Goal: ${esc(g.goal)} · ${gbp(g.target)}`:'Set a goal for '+esc(S.person)}</summary>
    <div class="two"><div><label class="f">Saving for</label><input class="inp" id="goalName" placeholder="e.g. New bike" value="${esc(g.goal)}"></div>
    <div><label class="f">Target</label><input class="inp" id="goalTarget" inputmode="decimal" placeholder="150" value="${g.target||''}"></div></div>
    <div class="two"><button class="secondary" onclick="run('setGoal',[S.person,$('#goalName').value.trim(),parseFloat($('#goalTarget').value)||0],'Goal saved')">Save goal</button>
    ${g.goal?`<button class="secondary" onclick="run('setGoal',[S.person,'',0],'Goal removed')">Remove</button>`:'<span></span>'}</div></details>`;
}

/* ---- statement upload (Tom only) ---- */
function readStatementFile(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsText(f,'windows-1252'); }); }
function pickStatements(){
  const i = document.createElement('input'); i.type='file'; i.multiple=true; i.accept='.xls,.htm,.html,application/vnd.ms-excel,text/html';

    <div class="seg">${['spend','add','move'].map(m=>`<button class="${S.mode===m?'on':''}" onclick="S.mode='${m}';drawSheet()">${{spend:'Spend',add:'Add',move:'Move'}[m]}</button>`).join('')}</div>

  else { const after = S.mode==='spend'?p.balance-a:p.balance+a; el.innerHTML = `${S.person}'s pot: ${gbp(p.balance)} → <b class="${after<0?'neg':''}">${gbp(after)}</b>`
    + (S.mode==='add'?`<br>Family pot: ${gbp(D.overview.familyPot)} → <b class="${D.overview.familyPot-a<0?'neg':''}">${gbp(D.overview.familyPot-a)}</b>`:''); }

function savePot(){

function runWithUndo(fn,args,msg){
  const id = run(fn,args,null)[0].id;

function removeEntry(id){
  const e=D.log.find(x=>x.id===id); if(!e) return;

function hRun(fn, args, msg, undo, opts){

  if (H && HLOCAL[fn]){ const h = structuredClone(H);
    try{ HLOCAL[fn](h, ...args); }catch(e){ toast('\u26a0 ' + (e.message||e)); return Promise.resolve(null); }
    H = h; }

/* ---- people: age, what they need a day, their usual portion ---- */
function hp(name){ return (H.people||[]).find(p=>p.name===name) || {name}; }
function ageYears(name){
  const p = hp(name);
  if (p.dob) return (dOf(today()) - dOf(p.dob)) / (365.25*864e5);
  const pot = D && D.pots && D.pots.find(x=>x.name===name), a = pot ? pot.age : p.age;
  return typeof a === 'number' ? a : null;
}
function latestBody(name, key, upto){ const b = H.body.filter(x=>x.person===name && x[key]!=null && (!upto || x.date<=upto)); return b.length ? b[b.length-1] : null; }
function kcalNeed(name){
  const p = hp(name), age = ageYears(name), sex = p.sex;
  if (p.target) return {kcal:p.target, how:'your own target'};
  if (age != null && age < 18){
    const t = H.ear[sex||'M'], k = age < 1 ? Math.round(t[1]*0.8) : t[Math.floor(age)];
    return {kcal:k, how:`average for a ${Math.floor(age)||'under 1'}-year-old ${sex==='F'?'girl':sex==='M'?'boy':'child'} (UK SACN)`};
  }
  const w = latestBody(name,'kg'), h = latestBody(name,'cm');

    return {kcal:Math.round(bmr*act/10)*10, how:'from weight, height, age and activity (Mifflin-St Jeor)'};

  return Math.max(0.25, Math.min(1, Math.round(kcalNeed(name).kcal/2250*4)/4)); }
const FRAC = {0.25:'¼',0.5:'½',0.75:'¾',1:'1',1.25:'1¼',1.5:'1½',2:'2'};
const fmtPortion = p => (FRAC[Math.round(p*100)/100] || String(Math.round(p*100)/100)) + ' portion' + (p>1?'s':'');
const kcalF = n => Math.round(n).toLocaleString('en-GB') + ' kcal';

const stF = kg => { const lb = Math.round(kg/0.453592), st = Math.floor(lb/14); return st+' st '+(lb-st*14)+' lb'; };

/* ---- BMI: adults by the usual bands, children by their WHO centile for age ---- */
let LMS_T = null;
function lmsAt(sex, months){
  if (!LMS_T) LMS_T = BMI_LMS.map(s=>s.split(';').map(r=>r.split(',').map(Number)));
  const t = LMS_T[sex==='F'?1:0], i = Math.floor(months), f = months-i;

function dayMap(name, from, to){

    const x = d[e.date] || (d[e.date] = {kcal:0, veg:0, treats:0, takeaway:0, slots:{}});
