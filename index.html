/* ---- how someone is eating: all, most, some or none of what was offered, missed meals, what they like and leave ---- */
function eatingStats(n, from, to){
  const rows = H.meals.filter(e=>e.person===n && e.date>=from && e.date<=to && SLOTS.includes(e.meal)), days = [...new Set(rows.map(e=>e.date))].sort();
  const skipped = rows.filter(e=>e.food==='Skipped'), offered = rows.filter(e=>e.food!=='Skipped'), band = {all:0, most:0, some:0, none:0};
  offered.forEach(e=>{ const x = e.eaten; if (x >= 0.9) band.all++; else if (x >= 0.5) band.most++; else if (x > 0.05) band.some++; else band.none++; });
  const missBy = {}; ['Breakfast','Lunch','Dinner'].forEach(sl=>{ missBy[sl] = days.filter(d=>{ const l = rows.filter(e=>e.date===d && e.meal===sl); return l.length > 0 && l.every(e=>e.food==='Skipped' || e.eaten <= 0.05); }).length; });
  const sc = {}; offered.forEach(e=>{ const k = e.food.toLowerCase(), x = sc[k] || (sc[k] = {name:e.food, n:0, sum:0}); x.n++; x.sum += e.eaten; });
  const fl = Object.values(sc).map(x=>({...x, avg:x.sum/x.n}));
  const need = kcalNeed(n).kcal, dm = dayMap(n, from, to), full = days.filter(d=>dm[d] && fullDay(dm[d])), dayK = full.map(d=>dm[d].kcal);   // only days with two main meals written down
  return {rows, days, full, skipped, offered, band, missBy, need,
    likes: fl.filter(x=>x.n>=2 && x.avg>=0.8).sort((a,b)=>b.n-a.n || b.avg-a.avg),
    leaves: fl.filter(x=>x.n>=2 && x.avg<0.5).sort((a,b)=>a.avg-b.avg || b.n-a.n),
    avg: offered.length ? offered.reduce((a,e)=>a+e.eaten,0)/offered.length : null,
    lowDays: dayK.filter(k=>k < need*0.7).length,
    comments: H.meals.filter(e=>e.person===n && e.date>=from && e.date<=to && e.note).map(e=>({date:e.date, what:e.meal+': '+e.food, note:e.note}))
      .concat((H.notes||[]).filter(x=>x.person===n && x.date>=from && x.date<=to).map(x=>({date:x.date, what:'The day', note:x.note}))).sort((a,b)=>a.date<b.date?1:-1)};
}
function eatingCard(n, from, to){
  const s = eatingStats(n, from, to); if (!s.rows.length) return '';
  const len = daysBetween(from, to), p = eatingStats(n, addDays(from, -len), addDays(from, -1)), tot = Math.max(1, s.offered.length);
  const seg = (k, c, l) => s.band[k] ? `<i style="width:${s.band[k]/tot*100}%;background:${c}" title="${l}"></i>` : '';
  const trend = s.avg!=null && p.avg!=null ? (s.avg - p.avg >= 0.05 ? ' <span class="pos">up from '+Math.round(p.avg*100)+'%</span>' : p.avg - s.avg >= 0.05 ? ' <span class="neg">down from '+Math.round(p.avg*100)+'%</span>' : '') : '';
  return `<h2>How ${esc(n)} is eating</h2>
  <div class="card">
    <div class="stat-row"><span class="k">Eats of what is offered, on average</span><span class="v">${s.avg==null?'&ndash;':Math.round(s.avg*100)+'%'}${trend}</span></div>
    <div class="eatbar">${seg('all','var(--nathan)','All')}${seg('most','#8BC34A','Most')}${seg('some','#F0B429','A little')}${seg('none','var(--laura)','None')}</div>
    <div class="eat-legend"><span><i style="background:var(--nathan)"></i>All ${s.band.all}</span><span><i style="background:#8BC34A"></i>Most ${s.band.most}</span><span><i style="background:#F0B429"></i>A little ${s.band.some}</span><span><i style="background:var(--laura)"></i>None ${s.band.none}</span></div>
    <button class="stat-row" onclick="foodsSheet('Skipped meals', e=>e.person==='${n}' && e.food==='Skipped' && e.date>='${from}' && e.date<='${to}')"><span class="k">Meals skipped</span><span class="v">${s.skipped.length}&nbsp;›</span></button>
    ${['Breakfast','Lunch','Dinner'].map(sl=>`<button class="stat-row" onclick="missedSheet('${n}','${sl}','${from}','${to}')"><span class="k">${SLOT_ICON[sl]} ${sl} missed or refused</span><span class="v">${s.missBy[sl]} of ${s.days.length} days&nbsp;›</span></button>`).join('')}
    <div class="stat-row"><span class="k">Full days under 70% of the daily guide</span><span class="v">${s.lowDays} of ${s.full.length}</span></div>
    ${s.likes.length?`<label class="f">Eats well</label><div class="chips wrap">${s.likes.slice(0,12).map(x=>`<button class="chip on" style="--c:var(--nathan)" onclick="foodDetail(${jsA(x.name)},'${n}')">${esc(x.name)}</button>`).join('')}</div>
      <div class="hint">Build meals around these, and put one on the plate next to anything new.</div>`:''}
    ${s.leaves.length?`<label class="f">Often leaves</label><div class="chips wrap">${s.leaves.slice(0,12).map(x=>`<button class="chip" onclick="foodDetail(${jsA(x.name)},'${n}')">${esc(x.name)} <span class="muted">${Math.round(x.avg*100)}%</span></button>`).join('')}</div>`:''}
    ${s.comments.length?`<label class="f">Comments</label>${s.comments.slice(0,8).map(c=>`<button class="stat-row" onclick="openDay('${c.date}')"><span class="k">${esc(dOf(c.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'}))} &middot; ${esc(c.what)}</span><span class="v" style="font-weight:500;text-align:right">${esc(c.note)}&nbsp;›</span></button>`).join('')}`:''}
    <button class="secondary" onclick="copyEatingSummary('${n}','${from}','${to}')">Copy a summary for the GP</button>
    <div class="hint">A record for you and the GP. Keep mealtimes calm and low pressure, and keep talk of calories and weight away from ${esc(n)}.</div>
  </div>`;
}
function eatingSummaryText(n, from, to){
  const s = eatingStats(n, from, to), d = x => dOf(x).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const L = [`${n}: eating from ${d(from)} to ${d(to)}`, `Days with meals written down: ${s.days.length}`,
    `Of ${s.offered.length} foods offered: ate all ${s.band.all}, most ${s.band.most}, a little ${s.band.some}, none ${s.band.none}.` + (s.avg!=null ? ` On average ${Math.round(s.avg*100)}% eaten.` : ''),
    `Meals skipped: ${s.skipped.length}. Missed or refused: breakfast ${s.missBy.Breakfast}, lunch ${s.missBy.Lunch}, dinner ${s.missBy.Dinner} (of ${s.days.length} days).`,
    `Full days (two main meals written down) under 70% of the daily guide (${s.need} kcal): ${s.lowDays} of ${s.full.length}.`];
  if (s.likes.length) L.push('Eats well: ' + s.likes.slice(0,12).map(x=>x.name).join(', ') + '.');
  if (s.leaves.length) L.push('Often leaves: ' + s.leaves.slice(0,12).map(x=>x.name+' ('+Math.round(x.avg*100)+'%)').join(', ') + '.');
  const w = H.body.filter(b=>b.person===n && b.kg!=null), h = H.body.filter(b=>b.person===n && b.cm!=null);
  if (w.length) L.push('Weights: ' + w.slice(-4).map(b=>d(b.date)+' '+b.kg+' kg').join(', ') + '.');
  if (h.length) L.push('Height: ' + h[h.length-1].cm + ' cm on ' + d(h[h.length-1].date) + '.');
  if (s.comments.length){ L.push('', 'Comments:'); s.comments.slice(0,20).forEach(c=>L.push('- ' + d(c.date) + ', ' + c.what + ': ' + c.note)); }
  return L.join('\n');
}
async function copyEatingSummary(n, from, to){
  const t = eatingSummaryText(n, from, to);
  try{ await navigator.clipboard.writeText(t); toast('Summary copied. Paste it into a message or email.'); }
  catch(e){ showSheet(`<div class="grab"></div><h3 style="margin:0 0 6px">Summary for the GP</h3><div class="hint">Select all and copy.</div>
    <textarea class="inp" style="height:320px;font-size:13px" readonly>${esc(t)}</textarea><button class="secondary" onclick="closeSheet()">Close</button>`); }
}
/* a gentle heads-up when meals are being left or skipped, with the foods they do eat */
function eatingWatch(){
  const t = today(), from = addDays(t, -2);
  return EATERS.map(n=>{ const s = eatingStats(n, from, t), missed = s.skipped.length + s.band.none, a = ageYears(n), low = a != null && a < 18 && s.lowDays >= 2;
    if (!(missed >= 3 || low)) return '';
    const likes = eatingStats(n, addDays(t, -60), t).likes.slice(0,4).map(x=>x.name);
    return `<div class="due" style="--due:${COLOR[n]}"><b>${missed >= 3 ? `${esc(n)} has left or skipped ${missed} meals in the last 3 days` : `${esc(n)} ate under 70% of the daily guide on ${s.lowDays} of the last 3 days`}</b>
      <span class="hint" style="margin:0">${likes.length?'Foods '+esc(n)+' usually eats: '+esc(likes.join(', '))+'. ':''}If it keeps happening, or ${esc(n)} is losing weight, speak to your GP.</span>
      <button class="secondary" onclick="HS.who='${n}';hgo('stats')">See how ${esc(n)} is eating</button></div>`; }).join('');
}
/* ---- drill-downs: one food, a set of meals, a list of days; each row opens its day ---- */
function openDay(d){ closeSheet(); HD = d; hgo('today'); }
function mealRowsHTML(rows){
  return rows.map(e=>`<button class="stat-row" onclick="openDay('${e.date}')"><span class="k">${esc(dOf(e.date).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}))} · ${esc(e.meal)} · ${esc(e.person)}${e.note?`<br><small>&ldquo;${esc(e.note)}&rdquo;</small>`:''}</span>
    <span class="v">${e.food==='Skipped'?'skipped':esc(e.food)+(e.eaten<0.995?' · '+Math.round(e.eaten*100)+'%':'')}&nbsp;›</span></button>`).join('');
}
function foodDetail(name, person){
  const k = name.toLowerCase(), rows = H.meals.filter(e=>e.food.toLowerCase()===k && (!person || e.person===person)).sort((a,b)=>a.date<b.date?1:-1);
  const byP = EATERS.map(n=>{ const l = rows.filter(e=>e.person===n); return l.length ? `<div class="stat-row"><span class="k"><span class="mini" style="--c:${COLOR[n]}"></span> ${n}</span><span class="v">${l.length}× · eats ${Math.round(l.reduce((a,e)=>a+e.eaten,0)/l.length*100)}% on average</span></div>` : ''; }).join('');
  const i = H.foods.findIndex(f=>f.name.toLowerCase()===k);
  showSheet(`<div class="grab"></div><h3 style="margin:0">${esc(name)}</h3><div class="hint" style="margin:2px 0 10px">${rows.length} time${rows.length===1?'':'s'}${person?' for '+esc(person):''}. Tap a day to open it.</div>
    ${byP}<label class="f">When</label>${mealRowsHTML(rows.slice(0,60))}
    ${i>-1 ? `<button class="secondary" onclick="openFoodForm({i:${i}})">Change this saved meal</button>` : `<button class="secondary" onclick="openFoodForm({name:${jsA(name)}, kcal:${rows[0]?Math.round((rows[0].served||rows[0].kcal)/(rows[0].portion||1)):0}})">Save as one of our meals</button>`}`);
}
function foodsSheet(title, filter){
  const rows = H.meals.filter(filter).sort((a,b)=>a.date<b.date?1:-1);
  showSheet(`<div class="grab"></div><h3 style="margin:0">${esc(title)}</h3><div class="hint" style="margin:2px 0 10px">${rows.length} in this period. Tap one to open that day.</div>${mealRowsHTML(rows.slice(0,100)) || '<div class="empty">None in this period</div>'}`);
}
function missedSheet(n, sl, from, to){
  const days = [...new Set(H.meals.filter(e=>e.person===n && e.date>=from && e.date<=to && SLOTS.includes(e.meal)).map(e=>e.date))].sort().reverse()
    .filter(d=>{ const l = H.meals.filter(e=>e.person===n && e.date===d && e.meal===sl); return l.length && l.every(e=>e.food==='Skipped' || e.eaten<=0.05); });
  foodsSheet(`${n}: ${sl.toLowerCase()} missed or refused`, e=>e.person===n && e.meal===sl && days.includes(e.date));
}
/* ---- a note about someone's day ---- */
function dayNoteHTML(){
  return `<div class="daynotes">${EATERS.map(n=>{ const x = (H.notes||[]).find(v=>v.date===HD && v.person===n);
    return `<button class="daynote" style="--c:${COLOR[n]}" onclick="openDayNote('${n}')"><span class="who">&#x1F4DD; ${n}'s day</span><span class="${x?'':'muted'}">${x?esc(x.note):'Add a comment'}</span></button>`; }).join('')}</div>`;
}
function openDayNote(n){
  const x = (H.notes||[]).find(v=>v.date===HD && v.person===n);
  showSheet(`<div class="grab"></div><h3 style="margin:0 0 6px">${esc(n)}'s day, ${esc(dateY(HD))}</h3>
    <div class="hint">How it went: moods, what they asked for, anything they would not eat.</div>
    <textarea class="inp" id="dnT" style="height:130px" placeholder="e.g. Tired after school, only wanted toast">${esc(x?x.note:'')}</textarea>
    <div class="save-bar"><button class="primary" onclick="hRun('saveDayNote',[HD,'${n}',$('#dnT').value],'Comment saved')">Save</button></div>
    ${x?`<button class="secondary" style="color:var(--neg)" onclick="hRun('saveDayNote',[HD,'${n}',''],'Comment removed')">Remove</button>`:''}
    <button class="secondary" onclick="closeSheet()">Close</button>`);
}
function slotSkip(){
  const n = AM.who[0];
  hRun('addMeals', [[{date:HD, person:n, meal:AM.meal, food:'Skipped', kcal:0, served:0, eaten:0, portion:1, veg:0, group:'Meal', note:(AM.note||'').trim()}], null], `${n} skipped ${AM.meal.toLowerCase()}`, raw=>hRun('deleteMeal',[raw.batch],'Undone'));
}

/* ---- the month: a calendar with the takeaway days marked, then what we ate day by day ---- */
let HM = today().slice(0,7);
function monthDays(m){ const [y, mo] = m.split('-').map(Number), n = new Date(y, mo, 0).getDate(); return Array.from({length:n}, (_,i)=>m + '-' + String(i+1).padStart(2,'0')); }
function takeInfo(d){ const logged = H.meals.filter(e=>e.date===d && e.group==='Takeaway'), bank = bankTakeaways(d, d); return {logged, bank, on: logged.length > 0 || bank.length > 0}; }
function mealLine(day, sl){   // "Roast dinner" when both had it, otherwise "Laura: X · Nathan: Y"
  const by = EATERS.map(n=>[n, day.filter(e=>e.meal===sl && e.person===n).map(e=>e.food+eatTag(e)).join(', ')]).filter(x=>x[1]);
  if (!by.length) return '';
  return by.length===EATERS.length && by.every(x=>x[1]===by[0][1]) ? by[0][1] : by.map(([n,f])=>n + ': ' + f).join(' · ');
}
function hMonth(){
  const days = monthDays(HM), t = today(), lead = (dOf(days[0]).getDay()+6)%7, info = {};
  days.forEach(d=>{ info[d] = takeInfo(d); });
  const cells = Array(lead).fill('<span></span>').concat(days.map(d=>{ const ti = info[d], ate = H.meals.some(e=>e.date===d && SLOTS.includes(e.meal));
    return `<button class="cal-d ${ti.on?'take':''} ${d===t?'now':''}" ${d>t?'disabled':''} onclick="HD='${d}';hgo('today')" aria-label="${dOf(d).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}${ti.on?', takeaway day':''}">
      <b>${+d.slice(8)}</b><span>${ti.on?'&#x1F35F;':ate?'&#x2022;':''}</span></button>`; })).join('');
  const takeDays = days.filter(d=>info[d].on).length, spent = bankTakeaways(days[0], days[days.length-1]).reduce((a,x)=>a+x.amount,0);
  const list = days.filter(d=>d<=t).reverse().map(d=>{ const day = H.meals.filter(e=>e.date===d), ti = info[d]; if (!day.some(e=>SLOTS.includes(e.meal)) && !ti.on) return '';
    const lines = ['Breakfast','Lunch','Dinner','Snack'].map(sl=>{ const x = mealLine(day, sl); return x ? `<div class="cal-m"><span>${SLOT_ICON[sl]} ${sl}</span><span>${esc(x)}</span></div>` : ''; }).join('');
    const where = ti.bank.map(b=>esc(niceName(b.merchant)) + ' ' + gbp(b.amount)).join(', ') || esc([...new Set(ti.logged.map(e=>e.food))].join(', '));
    return `<button class="cal-row ${ti.on?'take':''}" onclick="HD='${d}';hgo('today')"><div class="cal-rh"><b>${dOf(d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</b>${ti.on?`<span class="tag">&#x1F35F; ${where}</span>`:''}</div>
      ${lines || '<div class="cal-m"><span></span><span class="muted">Only the bank payment. Tap to add what you had.</span></div>'}</button>`; }).join('');
  return `<div class="daybar"><button class="icon-btn" onclick="HM=shiftMonth(HM,-1);render()" aria-label="Month before">&lsaquo;</button>
      <div><b>${dOf(HM+'-01').toLocaleDateString('en-GB',{month:'long', year:'numeric'})}</b><span>${takeDays} takeaway or eating-out day${takeDays===1?'':'s'}</span></div>
      <button class="icon-btn" onclick="HM=shiftMonth(HM,1);render()" ${HM>=t.slice(0,7)?'disabled':''} aria-label="Month after">&rsaquo;</button></div>
    <div class="card cal"><div class="cal-w">${['M','T','W','T','F','S','S'].map(x=>`<span>${x}</span>`).join('')}</div><div class="cal-g">${cells}</div>
      <div class="hint">&#x1F35F; takeaway or eating out, logged or on the bank statement &middot; &#x2022; meals logged. Tap a day to open it.</div></div>
    ${spent ? `<div class="hint" style="margin:0 2px 4px">Spent on eating out and takeaways: <b>${gbp(spent)}</b>, from the bank statement.</div>` : ''}
    <h2>What we ate</h2>${list || '<div class="card empty">Nothing logged this month.</div>'}`;
}

/* one row per meal, one box per person: what they had, or an empty box to fill */
function slotGrid(day){
  return ALL_SLOTS.map(sl=>{
    const had = n => day.filter(e=>e.person===n && e.meal===sl), empty = EATERS.filter(n=>!had(n).length), drinks = sl==='Drinks';
    const cells = EATERS.map(n=>{ const box = slotBox(n, sl, had(n), drinks);
      if (!drinks){ const g = had(n).length ? null : quickMeal(n, sl);
        return g ? `<div class="slot-wrap">${box}<button class="quick-drink" onclick="quickMealAdd('${n}','${sl}')">+ ${esc(g.label)}</button></div>` : box; }
      const q = quickDrink(n);
      return q ? `<div class="slot-wrap">${box}<button class="quick-drink" onclick="quickAdd('${n}')">+ ${COFFEE.test(q.name)?'&#x2615;':'&#x1F964;'} ${esc(q.name)}</button></div>` : box; }).join('');
    return `<div class="slot-row"><div class="slot-h"><span>${SLOT_ICON[sl]} ${sl}</span>
        ${!drinks && empty.length===EATERS.length && EATERS.length>1 ? `<button class="slot-both" onclick="openAddMeal(null,'${sl}')">+ Same for both</button>` : ''}</div>
      <div class="slot-cells">${cells}</div></div>`; }).join('');
}
function slotBox(n, sl, l, drinks){ const k = l.reduce((a,e)=>a+e.kcal,0);
  const names = drinks ? Object.entries(l.reduce((m,e)=>(m[e.food]=(m[e.food]||0)+1, m), {})).map(([f,c])=>f+(c>1?' \u00d7'+c:'')) : l.map(e=>e.food+eatTag(e));
  return l.length
    ? `<button class="slot on ${!drinks && l.every(e=>e.food==='Skipped' || e.eaten<=0.05) ? 'left' : ''}" style="--c:${COLOR[n]}" onclick="${drinks?`openDrinks('${n}')`:`openSlot('${n}','${sl}')`}"><span class="who">${n}<span class="edit-i" aria-hidden="true">${drinks?'+':'&#x270E;'}</span></span>
        ${drinks ? `<span class="f">${esc(names.join(', '))}</span>` : names.map(f=>`<span class="f">${esc(f)}</span>`).join('')}<span class="k">${kcalF(k)}</span></button>`
    : `<button class="slot free" style="--c:${COLOR[n]}" onclick="${drinks?`openDrinks('${n}')`:`openSlot('${n}','${sl}')`}"><span class="who">${n}</span><span class="add">+ Add${drinks?' a drink':''}</span></button>`;
}
/* one tap for the drink they have most: a coffee for an adult unless something else is their usual */
const COFFEE = /coffee|latte|cappuccino|flat white|americano|espresso|mocha/i;
function quickDrink(n){
  const t = topFoods(e=>e.person===n && e.meal==='Drinks' && e.date>=addDays(today(),-60), 5), adult = (ageYears(n)??99) >= 16;
  const pick = (adult && t.find(f=>COFFEE.test(f.name))) || t[0];
  if (pick) return {name:pick.name, kcal:Math.round(pick.one), veg:pick.veg||0};
  return adult ? {name:'Coffee with milk', kcal:25, veg:0} : null;
}
/* the meal to offer in one tap: what they had for it the day before, else what they have most for it lately */
function quickMeal(n, sl){
  const prev = addDays(HD, -1), y = H.meals.filter(e=>e.person===n && e.meal===sl && e.date===prev && e.food!=='Skipped');
  if (y.length) return {label:'Same as yesterday: ' + y.map(e=>e.food).join(', '), rows:y.map(e=>({food:e.food, one:(e.served||e.kcal)/(e.portion||1), portion:e.portion||1, veg:e.veg||0, group:e.group||'Meal'}))};
  const t = topFoods(e=>e.person===n && e.meal===sl && e.food!=='Skipped' && e.date>=addDays(HD,-30) && e.date<HD, 1)[0];
  if (!t || t.n < 2) return null;
  return {label:'Usual: ' + t.name, rows:[{food:t.name, one:t.one, portion:usualPortion(n), veg:t.veg||0, group:t.group||'Meal'}]};
}
function quickMealAdd(n, sl){ const g = quickMeal(n, sl); if (!g) return;
  const list = g.rows.map(r=>({date:HD, person:n, meal:sl, food:r.food, kcal:Math.round(r.one*r.portion), served:Math.round(r.one*r.portion), eaten:1, note:'', portion:r.portion, veg:r.veg, group:r.group}));
  hRun('addMeals', [list, null], `${g.rows.map(r=>r.food).join(', ')} for ${n}`, raw=>hRun('deleteMeal',[raw.batch],'Undone')); }
function quickAdd(n){ const q = quickDrink(n); if (!q) return;
  hRun('addMeals', [[{date:HD, person:n, meal:'Drinks', food:q.name, kcal:q.kcal, portion:1, veg:q.veg, group:'Drink'}], null], `${q.name} for ${n}`, raw=>hRun('deleteMeal',[raw.batch],'Undone')); }
function openSlot(n, sl){ openAddMeal(n, sl); AM.slot = true; drawAddMeal(); }
function slotRemove(id){
  const e = H.meals.find(x=>x.id===id); if (!e) return;
  const back = e.diary ? null : [{date:e.date, person:e.person, meal:e.meal, food:e.food, kcal:e.kcal, portion:e.portion, veg:e.veg, group:e.group, eaten:e.eaten, note:e.note, served:e.served}];
  hRun('deleteMeal', [id], 'Removed ' + e.food, back ? ()=>hRun('addMeals',[back,null],'Put back') : null);
}

/* the Health side's good news: streaks, fruit and veg, fewer takeaways, weight going the right way, kids growing */
function healthWins(){
  if (!H.meals.length && !H.body.length) return '';
  const W = [], t = today(), logged = new Set(H.meals.map(e=>e.date));
  let n = 0; for (let d = logged.has(t) ? t : addDays(t,-1); logged.has(d); d = addDays(d,-1)) n++;
  if (n >= 3) W.push([60+n, '&#x1F525;', `<b>${n} days in a row</b> of meals logged`, `HM=today().slice(0,7);hgo('month')`]);
  const wk = (a,b) => EATERS.map(p=>personStats(p, a, b)), now = wk(addDays(t,-6), t), before = wk(addDays(t,-13), addDays(t,-7));
  const fv = l => { const f = l.filter(s=>s.full.length); return f.length ? f.reduce((a,s)=>a+s.veg,0)/f.length : 0; }, fv1 = fv(now), fv0 = fv(before);
  if (fv1 && fv0 && fv1 >= fv0*1.1) W.push([50, '&#x1F955;', `Fruit and veg is <b>up to ${fv1.toFixed(1)} a day</b> from ${fv0.toFixed(1)} the week before`, `HS.who='All';hgo('stats')`]);
  const best = EATERS.map((p,i)=>[p, now[i]]).filter(([,s])=>s.full.length>=3).sort((a,b)=>b[1].veg-a[1].veg)[0];
  if (best && best[1].veg >= 3) W.push([40+best[1].veg, '&#x1F31F;', `${esc(best[0])} is the fruit and veg champion this week: <b>${best[1].veg.toFixed(1)} a day</b>`, `HS.who='${best[0]}';hgo('stats')`]);
  const take = (a,b) => new Set(H.meals.filter(e=>e.group==='Takeaway' && e.date>=a && e.date<=b).map(e=>e.date)).size, k1 = take(addDays(t,-27),t), k0 = take(addDays(t,-55),addDays(t,-28));
  if (k0 && k1 < k0) W.push([45, '&#x1F957;', `<b>${k0-k1} fewer takeaway${k0-k1>1?'s':''}</b> than the 4 weeks before`, `HM=today().slice(0,7);hgo('month')`]);
  PEOPLE.forEach(p=>{ const a = ageYears(p), B = H.body.filter(b=>b.person===p);
    if (a != null && a < 18){ const h = B.filter(b=>b.cm!=null), h1 = h[h.length-1], h0 = h1 && h.filter(b=>b.date<=addDays(h1.date,-150))[0];
      if (h0 && h1.cm-h0.cm >= 1) W.push([35, '&#x1F4CF;', `${esc(p)} has grown <b>${(h1.cm-h0.cm).toFixed(1)} cm</b> since ${esc(dOf(h0.date).toLocaleDateString('en-GB',{month:'long'}))}`, `BW='${p}';hgo('body')`]); return; }
    const w = B.filter(b=>b.kg!=null), w1 = w[w.length-1], w0 = w1 && w.filter(b=>b.date<=addDays(w1.date,-60))[0], g = hp(p).goal, bi = bmiInfo(p);
    if (!w0) return; const d = w1.kg - w0.kg, want = g ? Math.sign(g - w0.kg) : bi && bi.hi && w0.kg > bi.hi ? -1 : bi && bi.lo && w0.kg < bi.lo ? 1 : 0;
    if (want && Math.sign(d) === want && Math.abs(d) >= 1) W.push([55+Math.abs(d)*3, '&#x1F4AA;', `${esc(p)} is <b>${d<0?'down':'up'} ${Math.abs(d).toFixed(1)} kg</b> since ${esc(dOf(w0.date).toLocaleDateString('en-GB',{month:'long'}))}${g?', heading for '+kgF(g):''}`, `BW='${p}';hgo('body')`]); });
  const top = W.sort((a,b)=>b[0]-a[0]).slice(0,3); if (!top.length) return '';
  return `<div class="wins"><div class="wins-h">Going well<span>From your meals and weigh-ins</span></div><ul>${top.map(w=>`<li>${w[3]?`<button class="win-tap" onclick="${w[3]}">`:''}<span class="wi">${w[1]}</span><span>${w[2]}</span>${w[3]?'<span class="chev">›</span></button>':''}</li>`).join('')}</ul></div>`;
}

function amCandidates(){

  const times = f => H.meals.filter(e=>e.food.toLowerCase()===f.name.toLowerCase()).length;
  const sc = AM.who.length===1 ? eatScores(AM.who[0]) : {}, liked = f => { const x = sc[f.name.toLowerCase()]; return x && x.n>=2 ? (x.avg>=0.8 ? 1 : x.avg<0.5 ? -1 : 0) : 0; };
  const mine = H.foods.filter(f=>!f.person || AM.who.includes(f.person)).map(f=>[f, times(f)]).sort((a,b)=>liked(b[0])-liked(a[0]) || b[1]-a[1]);
  if (!q){   // the menu is one list, this meal's foods or everything, most recently had or A to Z
    const last = {}; H.meals.forEach(e=>{ if (AM.who.includes(e.person)){ const k = e.food.toLowerCase(); if (!last[k] || e.date>last[k]) last[k] = e.date; } });

    l.sort(AMS.sort==='az' ? (a,b)=>a[0].name.localeCompare(b[0].name) : (a,b)=>(last[b[0].name.toLowerCase()]||'').localeCompare(last[a[0].name.toLowerCase()]||'') || b[1]-a[1] || a[0].name.localeCompare(b[0].name));
    l.forEach(([f,n])=>push({...f, times:n, last:last[f.name.toLowerCase()]}, 'saved'));
    return out;
  }
  mine.forEach(([f,n])=>push({...f, times:n}, 'saved'));

}

  const last = {}; H.meals.forEach(e=>{ if (AM.who.includes(e.person) && e.food.indexOf(' + ')>-1 && (!last[e.food] || e.date>last[e.food])) last[e.food] = e.date; });
  return Object.keys(last).filter(n=>n.split(' + ').every(buildPart)).sort((a,b)=>last[b].localeCompare(last[a])).slice(0,6);
}
function bFood(){ const order = Object.keys(BUILD), l = AM.build.parts.slice().sort((a,b)=>order.indexOf(a.g)-order.indexOf(b.g));
  return {name:l.map(p=>p.name).join(' + '), kcal:l.reduce((a,p)=>a+p.kcal,0), veg:Math.min(5,l.reduce((a,p)=>a+p.veg,0)), group:'Meal', src:AM.build.save?'custom':'built'}; }
function drawBuilder(){

        <label class="build-save"><input type="checkbox" ${B.save?'checked':''} onchange="AM.build.save=this.checked"> Save it on our menu too</label>` : '<div class="hint" style="margin:10px 2px 0">Nothing picked yet.</div>'}
      <button class="primary" ${B.parts.length?'':'disabled'} onclick="amAdd(bFood())">Add ${AM.who.length===EATERS.length&&EATERS.length>1?'for both':'it'}</button></div>`;

/* ---- drinks: their own box, and each tap adds one, so a day of teas is three taps ---- */
const DRINK_BASE = [['Coffee with milk',25],['Black coffee',5],['Latte (medium)',190],['Flat white',110],['Cappuccino (medium)',130],['Oat latte (medium)',150],['Tea with milk',20],['Water',0],['Squash (no added sugar)',10],['Can of Pepsi',140],['Can of Pepsi Max',1],
  ['Can of Coke',140],['Can of Diet Coke',1],['Fruit juice (glass)',90,1],['Glass of milk',120],
  ['Hot chocolate',150],['Milkshake',350],['Smoothie',150,1],['Fruit Shoot',10],['Energy drink (can)',115],['Pint of beer',215],['Glass of wine',160]];
let DR = null, DRLIST = [], DRHAD = [];
function drinkMenu(n){
  const seen = new Set(), out = [], push = f => { const k = f.name.toLowerCase(); if (seen.has(k)) return; seen.add(k); out.push(f); };
  topFoods(e=>e.person===n && (e.meal==='Drinks' || e.group==='Drink'), 8).forEach(f=>push({name:f.name, kcal:Math.round(f.one), veg:f.veg||0}));
  H.foods.filter(f=>f.group==='Drink' && (!f.person || f.person===n)).forEach(push);
  DRINK_BASE.forEach(([name, kcal, veg])=>push({name, kcal, veg:veg||0}));
  (H.base||[]).filter(f=>f.group==='Drink').forEach(push);
  return out;
}
function openDrinks(n){ DR = {who:n, q:''}; drawDrinks(); showSheet(); }
function drawDrinks(){
  const n = DR.who, q = DR.q.trim(), dayName = HD===today() ? 'today' : HD===addDays(today(),-1) ? 'yesterday' : dOf(HD).toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'short'});
  const counts = {}; H.meals.filter(e=>e.date===HD && e.person===n && e.meal==='Drinks').forEach(e=>{ const c = counts[e.food] || (counts[e.food] = {name:e.food, n:0, kcal:0, one:e.kcal, veg:e.veg||0, ids:[]}); c.n++; c.kcal += e.kcal; c.ids.push(e.id); });
  DRHAD = Object.values(counts); DRLIST = drinkMenu(n).filter(f=>!q || f.name.toLowerCase().includes(q.toLowerCase()));
  const had = name => (counts[name] || {n:0}).n;
  $('#sheet').innerHTML = `<div class="grab" id="drinksSheet"></div>
    <h3 style="margin:0 0 2px">${esc(n)}'s drinks, ${esc(dayName)}</h3>
    <div class="hint" style="margin:0 0 6px">Tap a drink each time ${esc(n)} has one.</div>
    ${DRHAD.length ? `<label class="f">Had so far · ${kcalF(DRHAD.reduce((a,c)=>a+c.kcal,0))}</label><div class="list slot-list">${DRHAD.map((c,i)=>`<div class="item">
        <div class="mid"><div class="t">${esc(c.name)} <span class="muted">&times;${c.n}</span></div><div class="d">${kcalF(c.kcal)}</div></div>
        <button class="icon-btn" aria-label="One less ${esc(c.name)}" onclick="drLess(${i})">&minus;</button>
        <button class="icon-btn" aria-label="One more ${esc(c.name)}" onclick="drMore(${i})">+</button></div>`).join('')}</div>` : ''}
    <input class="inp" id="drQ" placeholder="Find a drink, or type a new one" value="${esc(DR.q)}" autocomplete="off" style="margin-top:10px"
      oninput="DR.q=this.value;clearTimeout(window._dq);window._dq=setTimeout(()=>{drawDrinks();const i=$('#drQ');i.focus();i.setSelectionRange(i.value.length,i.value.length)},200)">
    ${q && !DRLIST.some(f=>f.name.toLowerCase()===q.toLowerCase()) ? `<div class="two" style="margin-top:8px;align-items:center"><input class="inp" id="drK" inputmode="numeric" placeholder="kcal for ${esc(q)}"><button class="secondary" style="margin:0" onclick="drCustom()">Add it</button></div>
      <button class="link-btn" onclick="openFoodForm({name:${jsA(q.charAt(0).toUpperCase()+q.slice(1))}, group:'Drink', slot:'Drinks'})">+ Save it as one of our drinks</button>` : ''}
    <div class="drink-grid">${DRLIST.map((f,i)=>`<button class="drink ${had(f.name)?'on':''}" onclick="drAdd(${i})"><span class="t">${esc(f.name)}</span><span class="d">${Math.round(f.kcal)} kcal${had(f.name)?' · &times;'+had(f.name):''}</span></button>`).join('')}</div>
    ${!DRLIST.length && !q ? '<div class="empty">No drinks yet.</div>' : ''}
    <button class="primary" onclick="closeSheet()">Done</button>`;
}
function addDrink(name, kcal, veg){
  hRun('addMeals', [[{date:HD, person:DR.who, meal:'Drinks', food:name, kcal:Math.round(kcal), portion:1, veg:veg||0, group:'Drink'}], null],
    `${name} for ${DR.who}`, raw=>hRun('deleteMeal',[raw.batch],'Undone',null,{keep:true, redraw:drawDrinks}), {keep:true, redraw:drawDrinks});
}
function drAdd(i){ const f = DRLIST[i]; if (f) addDrink(f.name, f.kcal, f.veg); }
function drMore(i){ const c = DRHAD[i]; if (c) addDrink(c.name, c.one, c.veg); }
function drLess(i){ const c = DRHAD[i]; if (c) hRun('deleteMeal', [c.ids[c.ids.length-1]], 'One less ' + c.name, null, {keep:true, redraw:drawDrinks}); }
function drCustom(){ const q = DR.q.trim(), k = parseFloat($('#drK').value); if (!(k >= 0)) return toast('Type the kcal for one ' + q);
  DR.q = ''; addDrink(q.charAt(0).toUpperCase()+q.slice(1), k, 0); }

/* ---- changing an entry: a draft in EM, one Save, and Undo puts the old values back ---- */
let EM = null;
function mealMates(e){   // everyone else who had the same thing, added together (same batch, same day, same meal)
  const b = e.id.indexOf('.') > -1 ? e.id.slice(0, e.id.indexOf('.')) : null;
  return b ? H.meals.filter(x=>x.id!==e.id && x.id.indexOf(b+'.')===0 && x.date===e.date && x.meal===e.meal) : [];
}
function editMeal(id){
  const e = H.meals.find(x=>x.id===id); if (!e) return;
  const mates = mealMates(e);
  EM = {id, person:e.person, food:e.food, date:e.date, meal:e.meal, portion:e.portion||1, served:Math.round(e.served), eaten:e.eaten==null?1:e.eaten, note:e.note||'', veg:e.veg||0, group:e.group||'Meal',
    mates:mates.map(x=>x.id), all:mates.length>0, diary:e.diary};
  drawEditMeal(); showSheet();
}
function emPortion(p){ EM.served = Math.round((EM.served||0)/(EM.portion||1)*p); EM.portion = p; drawEditMeal(); }
function drawEditMeal(){
  const c = COLOR[EM.person], names = [EM.person].concat(EM.mates.map(id=>(H.meals.find(x=>x.id===id)||{}).person).filter(Boolean));
  const saved = H.foods.some(f=>f.name.toLowerCase()===EM.food.trim().toLowerCase());
  $('#sheet').innerHTML = `<div class="grab"></div>
    <h3 style="margin:0 0 2px">Change what ${esc(EM.person)} had</h3>
    <div class="hint" style="margin:0 0 6px">${EM.diary?'From the Food diary. Your changes stay unless that diary cell is edited again.':'Change anything, then Save.'}</div>
    ${EM.mates.length?`<label class="f">Change it for</label><div class="seg">
      <button class="${EM.all?'on':''}" onclick="EM.all=true;drawEditMeal()">Everyone (${names.length})</button>
      <button class="${EM.all?'':'on'}" onclick="EM.all=false;drawEditMeal()">Just ${esc(EM.person)}</button></div>
      <div class="hint" style="margin:4px 2px 0">${EM.all?esc(names.join(', '))+'. Each keeps their own portion.':'Only '+esc(EM.person)+"'s entry changes."}</div>`:''}
    <label class="f">What they had</label>
    <input class="inp" id="emFood" value="${esc(EM.food)}" autocomplete="off" oninput="EM.food=this.value">
    <div class="two" style="margin-top:8px"><button class="secondary" style="margin:0" onclick="emSwap()">Pick a different food</button><button class="secondary" style="margin:0" onclick="emEstimate()">Work out kcal</button></div>
    <label class="f">Meal</label>
    <div class="seg four">${SLOTS.map(s=>`<button class="${EM.meal===s?'on':''}" onclick="EM.meal='${s}';drawEditMeal()"><span>${SLOT_ICON[s]}</span>${s}</button>`).join('')}</div>
    <label class="f">Day</label>
    <div class="two" style="align-items:center"><input class="inp" id="emDate" type="date" max="${today()}" value="${EM.date}" onchange="if(this.value){EM.date=this.value;drawEditMeal()}">
      <div class="chips" style="margin:0">${[[today(),'Today'],[addDays(today(),-1),'Yesterday']].map(([d,l])=>`<button class="chip ${EM.date===d?'on':''}" onclick="EM.date='${d}';drawEditMeal()">${l}</button>`).join('')}</div></div>
    <label class="f">${esc(EM.person)}'s portion (of an adult's)</label>
    <div class="chips">${[0.25,0.5,0.75,1,1.25,1.5,2].map(p=>`<button class="chip ${Math.abs(EM.portion-p)<0.01?'on':''}" style="--c:${c}" onclick="emPortion(${p})">${FRAC[p]}</button>`).join('')}</div>
    <label class="f">Calories in ${esc(EM.person)}'s portion</label>
    <input class="inp" id="emK" inputmode="numeric" value="${isNaN(EM.served)?'':EM.served}" oninput="EM.served=parseFloat(this.value);const a=document.getElementById('emAte');if(a)a.textContent=kcalF((EM.served||0)*EM.eaten)">
    ${eatenCtl(EM.eaten, 'emEat')}
    <div class="hint" style="margin:2px">Counted as eaten: <b id="emAte">${kcalF((EM.served||0)*EM.eaten)}</b></div>
    <label class="f">Comment</label>
    <input class="inp" id="emNote" value="${esc(EM.note)}" placeholder="e.g. only ate the chips" oninput="EM.note=this.value" autocomplete="off">
    <label class="f">Fruit &amp; veg portions</label>
    <div class="stepper"><button class="icon-btn" aria-label="One less" onclick="EM.veg=Math.max(0,EM.veg-1);drawEditMeal()">&minus;</button>
      <b id="emVeg">${EM.veg}</b>
      <button class="icon-btn" aria-label="One more" onclick="EM.veg=Math.min(9,EM.veg+1);drawEditMeal()">+</button></div>
    <label class="f">Type</label>
    <div class="chips wrap">${GROUPS.map(g=>`<button class="chip ${EM.group===g?'on':''}" onclick="EM.group='${g}';drawEditMeal()">${GROUP_ICON[g]} ${g}</button>`).join('')}</div>
    <div class="save-bar"><button class="primary" onclick="emSave()">Save changes</button></div>
    ${saved?'':`<button class="secondary" onclick="emKeep()">Save as one of our meals</button>`}
    <button class="secondary" style="color:var(--neg)" onclick="emRemove()">Remove${EM.all&&EM.mates.length?' for everyone':''}</button>
    <button class="secondary" onclick="closeSheet()">Close</button>`;
}
function emRows(){ return [EM.id].concat(EM.all ? EM.mates : []).map(id=>H.meals.find(x=>x.id===id)).filter(Boolean); }
const mealVals = x => ({id:x.id, date:x.date, meal:x.meal, food:x.food, kcal:Math.round(x.kcal), portion:x.portion||1, veg:x.veg||0, group:x.group||'Meal', eaten:x.eaten==null?1:x.eaten, note:x.note||'', served:Math.round(x.served==null?x.kcal:x.served)});
function emSave(){
  const food = EM.food.trim(), sv = Math.round(EM.served), k = Math.round(sv*EM.eaten);
  if (!food) return toast('Give the food a name');
  if (!(sv >= 0 && sv < 10000)) return toast('Enter the calories');
  if (!EM.date || EM.date > today()) return toast('Pick a day, not in the future');
  const me = H.meals.find(x=>x.id===EM.id); if (!me) return toast('That entry has gone, tap refresh');
  const one = sv / (EM.portion||1), kcalChanged = sv !== Math.round(me.served) || Math.abs((EM.portion||1)-(me.portion||1)) > 0.001;
  const rows = emRows(), old = rows.map(mealVals);
  const list = rows.map(x=>x.id===EM.id
    ? {id:x.id, date:EM.date, meal:EM.meal, food, kcal:k, portion:EM.portion, veg:EM.veg, group:EM.group, eaten:EM.eaten, note:EM.note.trim(), served:sv}
    : (()=>{ const xs = kcalChanged ? Math.round(one*(x.portion||1)) : Math.round(x.served), xe = x.eaten==null?1:x.eaten;
        return {id:x.id, date:EM.date, meal:EM.meal, food, kcal:Math.round(xs*xe), portion:x.portion||1, veg:EM.veg, group:EM.group, eaten:xe, note:x.note||'', served:xs}; })());
  if (list.every((n,i)=>JSON.stringify(n)===JSON.stringify(old[i]))) return closeSheet();
  const was = HD; HD = EM.date;
  hRun('editMeals', [list], rows.length>1 ? `Changed for ${rows.length} people` : 'Changed', ()=>{ HD = was; hRun('editMeals',[old],'Put back'); }).then(r=>{ if (!r) HD = was; });
}
function emRemove(){
  const rows = emRows(), ids = rows.map(x=>x.id), back = rows.filter(x=>!x.diary).map(x=>({date:x.date, person:x.person, meal:x.meal, food:x.food, kcal:x.kcal, portion:x.portion, veg:x.veg, group:x.group, eaten:x.eaten, note:x.note, served:x.served}));
  hRun('deleteMeal', [ids], rows.length>1 ? `Removed for ${rows.length} people` : 'Removed', back.length ? ()=>hRun('addMeals',[back,null],'Put back') : null);
}
function emKeep(){ const food = EM.food.trim(); if (!food) return toast('Give the food a name');
  hRun('saveFood',[{name:food, kcal:Math.round(EM.served/(EM.portion||1)), group:EM.group, veg:EM.veg, meal:EM.meal}],'Saved to our meals'); }
async function emEstimate(){
  const q = EM.food.trim(); if (!q) return toast('Type what they had first');
  try{ const e = await api('estimateFood', q, EM.meal, ''); if (e.skip) return toast('That reads as not eaten');
    EM.kcal = Math.round(e.kcal*(EM.portion||1)); EM.veg = e.veg||0; EM.group = e.group||EM.group; drawEditMeal();
    toast(e.guessed ? 'No foods recognised, so that is a typical '+EM.meal.toLowerCase() : 'Worked out: '+EM.kcal+' kcal'); }
  catch(e){ toast('⚠ '+(e.message||e)); }
}
/* swap the food: the add-a-meal picker, but a tap replaces this entry (and its mates) instead of adding */
function emSwap(){
  const rows = emRows();
  AM = {who: rows.map(x=>x.person), meal: EM.meal, size:1, q:'', online:null, est:null, eaten:EM.eaten, note:EM.note, swap:{rows:rows.map(mealVals), date:EM.date, name:EM.food}};
  drawAddMeal();
}

  </tbody></table><div class="hint" style="margin:6px 2px 4px">Guide = what each person needs a day on average (Settings). F&amp;V = fruit and veg portions a day, 5 is the aim. Tap a name for more.</div></div>

    ${eat.length&&bankTo<to?`<div class="hint">Spending comes from the bank statement, which runs to ${dateY(bankTo)}.</div>`:''}

}
function statsOne(n, from, to){
  const s = personStats(n, from, to), need = kcalNeed(n), top = topFoods(e=>e.person===n && e.date>=from && e.date<=to, 10);
  const pc = s.kcal/need.kcal*100, tot = ALL_SLOTS.reduce((a,x)=>a+s.bySlot[x],0)||1, bi = bmiInfo(n);
  return `${eatingCard(n, from, to)}

/* daily bars for up to a month, weekly averages beyond */
function kcalSeries(n, from, to){
  const d = dayMap(n, from, to), out = [];
  if (HS.days <= 30){ for (let x = from; x <= to; x = addDays(x,1)){ const v = d[x]; out.push({key:x, label:String(dayOf(x)), title:dOf(x).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}), a: v && fullDay(v) ? v.kcal : 0}); } }
  else for (let x = from; x <= to; x = addDays(x,7)){ const e = addDays(x,6) > to ? to : addDays(x,6), full = Object.keys(d).filter(k=>k>=x && k<=e && fullDay(d[k]));
    out.push({key:x, label:shortMonth(x.slice(0,7)), title:'Week of '+niceDate(x), a: full.length ? full.reduce((a,k)=>a+d[k].kcal,0)/full.length : 0, foot: full.length+' full day'+(full.length===1?'':'s')}); }
  return out;
}
function hDrawStats(){
  const to = today(), from = addDays(to, -(HS.days-1)), axis = v => v>=1000 ? (v/1000).toLocaleString('en-GB',{maximumFractionDigits:1})+'k' : String(v);
  const one = document.getElementById('oneChart');
  if (one) barChart(one, kcalSeries(HS.who, from, to), {color:COLOR[HS.who], line:kcalNeed(HS.who).kcal, fmt:kcalF, axis, pick:k=>openDay(k), every: HS.days<=7?1:HS.days<=30?7:Math.ceil(HS.days/7/6)});
  const fam = document.getElementById('famChart');
  if (fam){ const W=340, Hh=150, L=38, B=22, T=8;
    const series = EATERS.map(n=>({n, pts:kcalSeries(n, from, to)})), len = series[0].pts.length, max = Math.max(1, ...series.flatMap(x=>x.pts.map(p=>p.a)));
    const step = niceStep(max), top = Math.ceil(max/step)*step, y = v => T+(Hh-T-B)*(1-v/top), x = i => L+(W-L)*(len<2?0.5:i/(len-1));
    let g = ''; for (let v=0; v<=top; v+=step) g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end" font-size="12.5" fill="var(--muted)">${axis(v)}</text>`;
    series.forEach(sr=>{ let path = '', pen = false; sr.pts.forEach((p,i)=>{ if (!p.a){ pen = false; return; } path += (pen?'L':'M')+x(i).toFixed(1)+','+y(p.a).toFixed(1); pen = true; });
      g += `<path d="${path}" fill="none" stroke="${COLOR[sr.n]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      sr.pts.forEach((p,i)=>{ if (p.a && (i===0 || !sr.pts[i-1].a) && (i===len-1 || !sr.pts[i+1].a)) g += `<circle cx="${x(i)}" cy="${y(p.a)}" r="2.5" fill="${COLOR[sr.n]}"/>`; }); });
    const every = Math.ceil(len/6); series[0].pts.forEach((p,i)=>{ if (i%every===0) g += `<text x="${x(i)}" y="${Hh-6}" text-anchor="middle" font-size="12.5" fill="var(--muted)">${esc(p.label)}</text>`; });
    fam.innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Calories a day for each person">${g}</svg>`; }
}

/* kg a day over the last 4 months, least squares, from 3 or more weigh-ins */
function weightTrend(n){
  const W = H.body.filter(b=>b.person===n && b.kg!=null && b.date>=addDays(today(),-120)); if (W.length < 3) return null;
  const t0 = dOf(W[0].date), xs = W.map(b=>(dOf(b.date)-t0)/864e5), mx = xs.reduce((a,x)=>a+x,0)/xs.length, my = W.reduce((a,b)=>a+b.kg,0)/W.length;
  const den = xs.reduce((a,x)=>a+(x-mx)*(x-mx),0); return den ? xs.reduce((a,x,i)=>a+(x-mx)*(W[i].kg-my),0)/den : null;
}
function goalWeight(n){
  const g = hp(n).goal, w = latestBody(n,'kg'); if (!g || !w) return '';
  const left = w.kg - g, slope = weightTrend(n), right = slope && Math.sign(slope) === -Math.sign(left) && Math.abs(slope) > 0.002;
  const months = right ? Math.abs(left/slope)/30.44 : null;
  return `<div class="stat-row"><span class="k">Goal ${kgF(g)}</span><span class="v">${Math.abs(left)<0.3?'<span class="pos">Reached 🎉</span>':kgF(Math.abs(left))+(left>0?' to lose':' to gain')}${months?` <small class="muted">~${months<1?'under a month':Math.ceil(months)+' month'+(Math.ceil(months)>1?'s':'')} at this pace</small>`:''}</span></div>`;
}

/* ---- takeaway days from the bank. A card payment posts the day after, so the meal was the day before
   (147 of 152 takeaway payments checked); PayPal rows carry their own day. ---- */
const normPlace = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const niceName = s => String(s||'').toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());
const jsA = v => esc(JSON.stringify(v));
function bankTakeaways(from, to){
  if (!D || !D.transactions) return [];
  return D.transactions.filter(t=>t.category==='Eating out & takeaway' && t.type==='spend' && t.amount <= -10)
    .map(t=>({date: /^PayPal/.test(t.note||'') ? t.date : addDays(t.date,-1), merchant:t.merchant, amount:-t.amount}))
    .filter(t=>t.date>=from && t.date<=to);
}
function placeMatch(f, merchant){ const a = normPlace(f.place), b = normPlace(merchant); return !!a && !!b && (b.includes(a) || a.includes(b)); }
function recentPlaces(){
  const c = {}; bankTakeaways(addDays(today(),-540), today()).forEach(t=>{ const k = niceName(t.merchant); c[k] = (c[k]||0)+1; });
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>x[0]);
}
const orderPortion = (f, n) => f.person ? 1 : usualPortion(n);
const orderKcal = (f, n) => Math.round(f.kcal*orderPortion(f, n));
function takeawayCard(d){
  const pays = bankTakeaways(d, d); if (!pays.length) return '';
  const had = H.meals.filter(e=>e.date===d && e.group==='Takeaway');
  return pays.map(p=>{
    const orders = H.foods.filter(f=>placeMatch(f, p.merchant)), place = niceName(p.merchant), todo = EATERS.filter(n=>!had.some(e=>e.person===n));
    const picks = todo.map(n=>{ const o = orders.find(f=>f.person===n) || orders.find(f=>!f.person); return o ? [n, H.foods.indexOf(o)] : null; }).filter(Boolean);
    return `<div class="due take" style="--due:var(--laura)"><b>&#x1F35F; Takeaway day: ${esc(place)} <span class="muted" style="font-weight:500">${gbp(p.amount)}</span></b>
      <span class="hint" style="margin:0">From the bank statement${had.length?'. Logged: '+esc(had.map(e=>e.person+', '+e.food).join(' · ')):''}.</span>
      ${picks.map(([n,i])=>`<button class="secondary take-add" onclick="addOrders('${d}',[['${n}',${i}]])"><span>Add ${esc(n)}'s usual: <b>${esc(H.foods[i].name)}</b></span><span class="muted">${kcalF(orderKcal(H.foods[i],n))}</span></button>`).join('')}
      ${picks.length>1?`<button class="primary" onclick="addOrders('${d}',${jsA(picks)})">Add both</button>`:''}

    </div>`; }).join('');
}

async function ffEstimate(){
  try{
    if (FF.items.some(x=>x.name.trim())){
      const todo = FF.items.filter(x=>x.name.trim() && !(parseFloat(x.kcal)>0)); if (!todo.length) return toast('Every part has its kcal already');
      for (const x of todo){ const e = await api('estimateFood', x.name, FF.slot||'Dinner', ''); x.kcal = e.skip ? 0 : e.kcal; if (e.veg) FF.veg = Math.max(FF.veg, e.veg); }
      drawFoodForm(); return toast('Worked out ' + todo.length + ' part' + (todo.length>1?'s':'') + '. Change any that look wrong.');
    }
    const t = FF.name.trim(); if (!t) return toast('Type the name or the parts first');
    const e = await api('estimateFood', t, FF.slot||'Dinner', ''); if (e.skip) return;
    FF.kcal = e.kcal; FF.veg = e.veg || FF.veg; drawFoodForm();
    toast(e.guessed ? 'Nothing recognised, so that is a typical meal. Adding the parts gets closer.' : 'About ' + kcalF(e.kcal) + ' for an adult');
  }catch(err){ toast('⚠ ' + (err.message||err)); }

async function ffSave(){
  const name = FF.name.trim(); if (!name) return toast('Give it a name');
  const items = FF.items.filter(x=>x.name.trim()).map(x=>({name:x.name.trim(), kcal:Math.round(parseFloat(x.kcal)||0)}));

  if (!(kcal>0)) return toast(items.length ? 'Add the kcal for each part, or tap Work out kcal' : 'Enter the kcal, or tap Work out kcal');

/* ============ ui plumbing ============ */
function showSheet(html){ if (!sheetShown()){ SHEET_STACK = []; sheetKey = ''; } if(html) $('#sheet').innerHTML=html; $('#scrim').classList.add('show'); $('#sheet').classList.add('show'); guard(); }
function closeSheet(){ $('#scrim').classList.remove('show'); $('#sheet').classList.remove('show'); SHEET_STACK = []; sheetKey = ''; }
$('#scrim').onclick = closeSheet;
/* ============ going back, from anywhere ============
   Screens: every move is remembered in BACK; the arrow in the bottom bar, the phone's back button or gesture, and a swipe
   in from the left edge all step back. Pop-ups: a bar that stays at the top with Back (the pop-up before, if any) and a
   close button, and a swipe down closes. */
const SH = document.getElementById('sheet');
let BACK = [], SHEET_STACK = [], sheetKey = '', sheetRestoring = false, guardOn = false;
const sheetShown = () => SH.classList.contains('show');
const canBack = () => sheetShown() || BACK.length > 0;
function navPush(){ BACK.push({mode:MODE, view, hview, HD, HM}); if (BACK.length > 40) BACK.shift(); guard(); }
function goBack(){
  if (sheetShown()){ SHEET_STACK.length ? sheetBack() : closeSheet(); return true; }
  const s = BACK.pop(); if (!s) return false;
  MODE = s.mode; try{ localStorage.setItem('ganymede-mode', MODE); }catch(e){}
  view = s.view; hview = s.hview; HD = s.HD; HM = s.HM;
  if (MODE==='money' && !D){ setNav(); $('#app').innerHTML = masterHTML()+'<div class="loading">Loading your pots&hellip;</div>'; return true; }
  render(); if (MODE==='money'){ if (view==='spending') drawCharts(); if (view==='settings') settingsPreview(); }
  return true;
}
/* the phone's back: one spare history entry while there is somewhere to go back to */
const GHIST = (typeof google !== 'undefined' && google.script && google.script.history) ? google.script.history : null;
function guard(){ if (guardOn) return; guardOn = true; try{ GHIST ? GHIST.push({back:1}) : history.pushState({back:1}, ''); }catch(e){} }
function onPhoneBack(){ guardOn = false; if (goBack() && canBack()) guard(); }
try{ GHIST ? GHIST.setChangeHandler(onPhoneBack) : window.addEventListener('popstate', onPhoneBack); }catch(e){}

/* pop-ups: the bar goes back in after every redraw; a new pop-up opened from one is stacked so Back returns to it */
const sheetKeyOf = () => { const h = SH.querySelector('h3') || SH.querySelector('label.f'); return h ? h.textContent.trim().slice(0, 80) : ''; };
function sheetBarHTML(){
  return `<div class="sheet-bar" id="sheetBar"><button class="sb-back ${SHEET_STACK.length?'':'off'}" onclick="sheetBack()" aria-label="Back">&lsaquo; Back</button>
    <div class="grab"></div><button class="sb-x" onclick="closeSheet()" aria-label="Close">&times;</button></div>`;
}
let sheetHTML = '';
new MutationObserver(()=>{
  if (SH.firstElementChild && SH.firstElementChild.id === 'sheetBar') return;
  const k = sheetKeyOf(), html = SH.innerHTML;
  if (sheetRestoring) sheetRestoring = false;
  else if (sheetShown() && sheetKey && k && k !== sheetKey){
    const top = SHEET_STACK[SHEET_STACK.length-1];
    if (top && top.key === k) SHEET_STACK.pop(); else SHEET_STACK.push({key:sheetKey, html:sheetHTML});
  }
  if (k) sheetKey = k;
  sheetHTML = html;
  SH.insertAdjacentHTML('afterbegin', sheetBarHTML());
}).observe(SH, {childList:true});
function sheetBack(){
  const prev = SHEET_STACK.pop(); if (!prev) return closeSheet();
  sheetRestoring = true; sheetKey = prev.key; SH.innerHTML = prev.html; SH.scrollTop = 0;
}
/* swipe a pop-up down to close it (from the bar, or anywhere once it is scrolled to the top) */
let sY0 = null, sDY = 0;
SH.addEventListener('touchstart', e=>{ sY0 = (e.target.closest('.sheet-bar') || SH.scrollTop <= 0) ? e.touches[0].clientY : null; sDY = 0; }, {passive:true});
SH.addEventListener('touchmove', e=>{ if (sY0 == null) return; sDY = e.touches[0].clientY - sY0;
  if (sDY > 0 && SH.scrollTop <= 0){ SH.style.transition = 'none'; SH.style.transform = `translateY(${sDY}px)`; }
  else if (sDY < 0){ sY0 = null; SH.style.transition = ''; SH.style.transform = ''; } }, {passive:true});
SH.addEventListener('touchend', ()=>{ if (sY0 == null) return; SH.style.transition = ''; SH.style.transform = ''; if (sDY > 90) closeSheet(); sY0 = null; }, {passive:true});
/* swipe in from the left edge: back a screen */
let eX0 = null, eY0 = 0;
document.addEventListener('touchstart', e=>{ const t = e.touches[0]; eX0 = t.clientX < 28 && !sheetShown() ? t.clientX : null; eY0 = t.clientY; }, {passive:true});
document.addEventListener('touchend', e=>{ if (eX0 == null) return; const t = e.changedTouches[0]; if (t.clientX - eX0 > 80 && Math.abs(t.clientY - eY0) < 60) goBack(); eX0 = null; }, {passive:true});


let toastT;
function toast(msg, undo){
  $('#toastMsg').textContent=msg; const u=$('#toastUndo');
  u.classList.toggle('hidden',!undo); u.onclick=()=>{ $('#toast').classList.remove('show'); undo&&undo(); };
  $('#toast').classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>$('#toast').classList.remove('show'), undo?6000:3000);
}
function go(v){ if (v!==view || MODE!=='money') navPush(); if (MODE==='health'){ MODE='money'; try{ localStorage.setItem('ganymede-mode','money'); }catch(e){} } if (!D) { view=v; return; }   // still loading: open this screen once the data arrives
  if (v==='parents' && !canP()) v='home'; view=v; render(); if(v==='settings') settingsPreview(); if(v==='spending') drawCharts(); }
document.querySelector('nav').onclick = e => { const b = e.target.closest('button'); if (b && b.classList.contains('nav-back')) return goBack(); if (b) MODE==='health' ? hgo(b.dataset.view) : go(b.dataset.view); };
document.addEventListener('visibilitychange',()=>{ if (!document.hidden) syncNow(); });

// Any error shows up on screen instead of failing silently
window.addEventListener('error', e => toast('⚠ ' + (e.message || 'Something went wrong')));
window.addEventListener('unhandledrejection', e => toast('⚠ ' + ((e.reason && e.reason.message) || e.reason || 'Something went wrong')));
if (MODE==='health'){ setNav(); render(); }
flush(); load(); hLoad();   // both sides are fetched, so both work offline
/* once the first screen is up, build the other screens once in idle time, so the first tap on each is quick */
(function warm(){ const idle = window.requestIdleCallback || (f=>setTimeout(f,200));
  const off = html => { const d = document.createElement('div'); d.setAttribute('aria-hidden','true');
    d.style.cssText = 'position:absolute;left:-9999px;top:0;width:'+innerWidth+'px;visibility:hidden;pointer-events:none';
    d.innerHTML = html; document.body.appendChild(d); d.offsetHeight; d.remove(); };
  const jobs = [()=>D&&off(vSpending()), ()=>D&&off(vPayments()), ()=>D&&off(vHistory()), ()=>D&&off(vTopups()), ()=>H&&off(hStats()), ()=>H&&off(hMonth()), ()=>H&&off(hFoods())];
  let n = 0; const next = () => idle(dl=>{ if (!D || !H) { if (n++ < 60) return setTimeout(next, 1000); }
    while (jobs.length && (!dl || dl.timeRemaining() > 8)) try{ jobs.shift()(); }catch(e){}
    if (jobs.length) next(); });
  setTimeout(next, 1500); })();
if (REMOTE && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
